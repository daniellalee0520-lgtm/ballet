<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f8f4f2;
  --card:#fffdfc;
  --text:#302c2d;
  --muted:#8c8182;
  --border:#e9dfdd;

  --pink:#c98f9f;
  --pink-light:#f5e5e9;
  --pink-soft:#fbf1f3;

  --lavender:#a69bbd;
  --lavender-light:#eeeaf5;

  --cream:#f5eee6;

  --green:#738d79;
  --green-light:#eaf1eb;

  --danger:#b86c70;
  --danger-light:#f8e9ea;

  --shadow:0 5px 20px rgba(70,45,50,.06);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1180px,calc(100% - 28px));
  margin:0 auto;
}

/* =========================
   Header
========================= */

.header{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 10%,rgba(201,143,159,.20),transparent 30%),
    radial-gradient(circle at 5% 100%,rgba(166,155,189,.16),transparent 35%),
    #fffaf8;
  border-bottom:1px solid var(--border);
}

.header-inner{
  position:relative;
  padding:28px 0 24px;
}

.header-kicker{
  color:var(--pink);
  font-size:11px;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:7px;
}

.header h1{
  margin:0;
  font-size:28px;
  letter-spacing:-.5px;
}

.header-sub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}

.ballet-mark{
  position:absolute;
  right:10px;
  top:17px;
  font-size:58px;
  opacity:.16;
  transform:rotate(-7deg);
}

/* decorative ribbon */
.ribbon{
  position:absolute;
  width:260px;
  height:80px;
  right:-80px;
  bottom:-45px;
  border:1px solid rgba(201,143,159,.25);
  border-radius:50%;
  transform:rotate(-18deg);
}

/* =========================
   Main
========================= */

main{
  padding:20px 0 50px;
}

.section{
  margin-bottom:18px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title small{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   Summary
========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
  min-width:0;
}

.summary-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.summary-value{
  font-size:23px;
  font-weight:700;
  line-height:1.1;
}

.summary-note{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* =========================
   Toolbar
========================= */

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.search{
  flex:1;
  min-width:190px;
}

input,
select{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:10px 11px;
  outline:none;
  color:var(--text);
}

input:focus,
select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(201,143,159,.10);
}

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  transition:.15s;
}

.btn:active{
  transform:scale(.98);
}

.btn-primary{
  background:var(--pink);
  color:white;
  border-color:var(--pink);
}

.btn-soft{
  background:var(--pink-soft);
  border-color:#efd7dc;
  color:#9a626d;
}

.btn-lavender{
  background:var(--lavender-light);
  border-color:#ddd5e9;
  color:#746a88;
}

.btn-danger{
  color:var(--danger);
  background:var(--danger-light);
  border-color:#efd4d5;
}

/* =========================
   Form
========================= */

.form-panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.form-toggle{
  width:100%;
  border:0;
  background:transparent;
  padding:14px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--text);
}

.form-toggle-left{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:600;
}

.plus{
  width:25px;
  height:25px;
  border-radius:8px;
  background:var(--pink-light);
  color:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.form-arrow{
  color:var(--muted);
  transition:.2s;
}

.form-panel.open .form-arrow{
  transform:rotate(180deg);
}

.form-body{
  display:none;
  padding:0 15px 16px;
  border-top:1px solid var(--border);
}

.form-panel.open .form-body{
  display:block;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding-top:14px;
}

.field label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}

.field.full{
  grid-column:span 2;
}

.field.wide{
  grid-column:span 2;
}

.form-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:14px;
}

/* validity */
.validity-row{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:7px;
}

.permanent-check{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
}

.permanent-check input{
  width:auto;
}

/* time wheel */
.time-picker{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.time-select{
  position:relative;
}

.time-select select{
  appearance:auto;
  padding-right:5px;
  text-align:center;
  background:#fff;
}

/* =========================
   Charts
========================= */

.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  padding:15px;
}

.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:13px;
}

.chart-header h3{
  margin:0;
  font-size:15px;
}

.chart-header p{
  margin:4px 0 0;
  font-size:11px;
  color:var(--muted);
}

.chart-wrap{
  overflow-x:auto;
  padding-bottom:4px;
}

.price-chart{
  min-width:500px;
}

.bar-row{
  display:grid;
  grid-template-columns:125px 1fr 70px;
  align-items:center;
  gap:10px;
  margin:10px 0;
}

.bar-name{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bar-track{
  height:18px;
  background:#f2eceb;
  border-radius:20px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,var(--pink),#d9a7b4);
  min-width:3px;
}

.bar-value{
  font-size:11px;
  font-weight:700;
  text-align:right;
  color:#765d63;
}

/* =========================
   Commute Chart
========================= */

.commute-chart{
  display:grid;
  gap:13px;
}

.commute-row{
  display:grid;
  grid-template-columns:145px 1fr;
  gap:12px;
  align-items:center;
}

.commute-name{
  min-width:0;
}

.commute-institution{
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.commute-district{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.commute-bars{
  display:grid;
  gap:6px;
}

.commute-line{
  display:grid;
  grid-template-columns:34px 1fr 55px;
  align-items:center;
  gap:7px;
}

.commute-icon{
  font-size:12px;
  text-align:center;
}

.commute-track{
  height:12px;
  border-radius:20px;
  background:#f0ebea;
  overflow:hidden;
}

.commute-fill-home{
  height:100%;
  border-radius:20px;
  background:#c9a1aa;
}

.commute-fill-work{
  height:100%;
  border-radius:20px;
  background:#aaa0c1;
}

.commute-time{
  text-align:right;
  font-size:10px;
  color:var(--muted);
}

/* =========================
   Package list
========================= */

.package-list{
  display:grid;
  gap:9px;
}

.package-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.package-main{
  padding:13px 14px;
}

.package-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.package-title{
  min-width:0;
}

.institution{
  font-size:11px;
  color:var(--pink);
  font-weight:700;
  margin-bottom:3px;
}

.package-name{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-price{
  text-align:right;
  white-space:nowrap;
}

.package-price strong{
  font-size:18px;
}

.package-price span{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.package-metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.metric{
  background:#faf6f5;
  border-radius:9px;
  padding:8px;
}

.metric-label{
  font-size:9px;
  color:var(--muted);
}

.metric-value{
  margin-top:3px;
  font-size:13px;
  font-weight:700;
}

.package-actions{
  display:flex;
  gap:6px;
  margin-top:11px;
}

.package-actions .btn{
  padding:6px 9px;
  font-size:11px;
}

.detail{
  display:none;
  padding:13px 14px 15px;
  border-top:1px solid var(--border);
  background:#fffaf9;
}

.package-card.show-detail .detail{
  display:block;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.detail-item{
  background:white;
  border:1px solid #eee4e2;
  border-radius:9px;
  padding:9px;
}

.detail-item label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:3px;
}

.detail-item div{
  font-size:12px;
  font-weight:600;
}

/* =========================
   Empty
========================= */

.empty{
  padding:35px 20px;
  text-align:center;
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:14px;
  color:var(--muted);
}

.empty-icon{
  font-size:32px;
  opacity:.45;
  margin-bottom:7px;
}

/* =========================
   Data tools
========================= */

.data-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hidden-input{
  display:none;
}

/* =========================
   Responsive
========================= */

@media(max-width:760px){

  .container{
    width:calc(100% - 20px);
  }

  .header-inner{
    padding:23px 0 20px;
  }

  .header h1{
    font-size:23px;
  }

  .ballet-mark{
    font-size:45px;
    right:0;
  }

  main{
    padding-top:14px;
  }

  .summary-grid{
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }

  .summary-card{
    padding:11px 8px;
    border-radius:11px;
  }

  .summary-label{
    font-size:10px;
    white-space:nowrap;
  }

  .summary-value{
    font-size:18px;
  }

  .summary-note{
    display:none;
  }

  .form-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .field.full,
  .field.wide{
    grid-column:span 2;
  }

  .bar-row{
    grid-template-columns:105px 1fr 60px;
  }

  .commute-row{
    grid-template-columns:105px 1fr;
  }

  .detail-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:430px){

  .package-metrics{
    grid-template-columns:repeat(3,1fr);
  }

  .metric{
    padding:7px 5px;
  }

  .metric-value{
    font-size:12px;
  }

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .search{
    grid-column:span 2;
  }

  .toolbar select{
    min-width:0;
  }

  .data-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .data-tools .btn:last-child{
    grid-column:span 2;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="container header-inner">
    <div class="header-kicker">BALLET STUDIO · PRICE BOOK</div>
    <h1>芭蕾机构价格对比</h1>
    <div class="header-sub">
      用每小时价格比较不同课时长度，让套餐更容易横向比较
    </div>
    <div class="ballet-mark">🩰</div>
    <div class="ribbon"></div>
  </div>
</header>

<main class="container">

  <!-- ======================
       价格总览
  ======================= -->
  <section class="section">
    <div class="section-title">
      <h2>价格总览</h2>
      <small id="packageCountText">0 个套餐</small>
    </div>

    <div class="summary-grid">

      <div class="summary-card">
        <div class="summary-label">机构数量</div>
        <div class="summary-value" id="institutionCount">0</div>
        <div class="summary-note">已记录机构</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">最低每小时</div>
        <div class="summary-value" id="lowestHourly">—</div>
        <div class="summary-note">按总课时换算</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">最高每小时</div>
        <div class="summary-value" id="highestHourly">—</div>
        <div class="summary-note">按总课时换算</div>
      </div>

    </div>
  </section>


  <!-- ======================
       搜索
  ======================= -->
  <section class="section">

    <div class="toolbar">

      <div class="search">
        <input
          id="searchInput"
          type="search"
          placeholder="搜索机构或套餐名称"
        >
      </div>

      <select id="sortSelect">
        <option value="hourlyAsc">每小时价格：低 → 高</option>
        <option value="hourlyDesc">每小时价格：高 → 低</option>
        <option value="priceAsc">套餐总价：低 → 高</option>
        <option value="priceDesc">套餐总价：高 → 低</option>
        <option value="institution">按机构名称</option>
      </select>

    </div>

  </section>


  <!-- ======================
       新建套餐
  ======================= -->
  <section class="section">

    <div class="form-panel" id="formPanel">

      <button class="form-toggle" id="formToggle">

        <span class="form-toggle-left">
          <span class="plus">＋</span>
          <span id="formToggleText">新建套餐</span>
        </span>

        <span class="form-arrow">⌄</span>

      </button>

      <div class="form-body">

        <div class="form-grid">

          <div class="field">
            <label>机构名称 *</label>
            <input id="institution" placeholder="例如：XX芭蕾">
          </div>

          <div class="field">
            <label>套餐名称 *</label>
            <input id="packageName" placeholder="例如：10节课">
          </div>

          <div class="field">
            <label>套餐价格 *</label>
            <input id="price" type="number" step="0.01" placeholder="1500">
          </div>

          <div class="field">
            <label>课时数量 *</label>
            <input id="lessons" type="number" step="1" placeholder="10">
          </div>

          <div class="field">
            <label>每节课时长（分钟）</label>
            <input id="minutes" type="number" step="1" value="60">
          </div>

          <div class="field">
            <label>有效期</label>

            <div class="validity-row">

              <input
                id="validityValue"
                type="number"
                step="0.1"
                placeholder="例如 3.5"
              >

              <select id="validityUnit">
                <option value="month">月</option>
                <option value="year">年</option>
                <option value="day">天</option>
              </select>

            </div>

            <label class="permanent-check">
              <input type="checkbox" id="permanent">
              永久有效
            </label>

          </div>


          <div class="field">
            <label>区域</label>
            <input id="district" placeholder="例如：朝阳区">
          </div>

          <div class="field">
            <label>最近地铁站</label>
            <input id="metroStation" placeholder="例如：XX站">
          </div>


          <div class="field">
            <label>距家距离（km）</label>
            <input id="homeDistance" type="number" step="0.1" placeholder="5.2">
          </div>

          <div class="field">
            <label>距公司距离（km）</label>
            <input id="workDistance" type="number" step="0.1" placeholder="3.8">
          </div>


          <!-- 到家时间 -->
          <div class="field">
            <label>到家时间</label>

            <div class="time-picker">

              <div class="time-select">
                <select id="homeTimeHour">
                  <option value="">小时</option>
                </select>
              </div>

              <div class="time-select">
                <select id="homeTimeMinute">
                  <option value="">分钟</option>
                </select>
              </div>

            </div>
          </div>


          <!-- 到公司时间 -->
          <div class="field">
            <label>到公司时间</label>

            <div class="time-picker">

              <div class="time-select">
                <select id="workTimeHour">
                  <option value="">小时</option>
                </select>
              </div>

              <div class="time-select">
                <select id="workTimeMinute">
                  <option value="">分钟</option>
                </select>
              </div>

            </div>
          </div>

        </div>


        <div class="form-actions">

          <button class="btn" id="cancelEditBtn" style="display:none">
            取消编辑
          </button>

          <button class="btn btn-soft" id="clearFormBtn">
            清空
          </button>

          <button class="btn btn-primary" id="saveBtn">
            保存套餐
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- ======================
       价格图表
  ======================= -->
  <section class="section">

    <div class="chart-card">

      <div class="chart-header">
        <div>
          <h3>价格比较</h3>
          <p>
            每小时价格 = 套餐总价 ÷（课次数 × 每节分钟数 ÷ 60）
          </p>
        </div>
      </div>

      <div class="chart-wrap">
        <div class="price-chart" id="priceChart"></div>
      </div>

    </div>

  </section>


  <!-- ======================
       通勤概览
  ======================= -->
  <section class="section">

    <div class="chart-card">

      <div class="chart-header">

        <div>
          <h3>通勤概览</h3>
          <p>直接比较到家与到公司的时间</p>
        </div>

      </div>

      <div class="commute-chart" id="commuteChart"></div>

    </div>

  </section>


  <!-- ======================
       套餐列表
  ======================= -->
  <section class="section">

    <div class="section-title">
      <h2>套餐</h2>
      <small>点击详情查看地点与通勤信息</small>
    </div>

    <div class="package-list" id="packageList"></div>

  </section>


  <!-- ======================
       数据管理
  ======================= -->
  <section class="section">

    <div class="section-title">
      <h2>数据管理</h2>
      <small>适合长期维护</small>
    </div>

    <div class="chart-card">

      <div class="data-tools">

        <button class="btn btn-soft" id="exportExcelBtn">
          导出 Excel
        </button>

        <button class="btn btn-soft" id="importExcelBtn">
          导入 Excel
        </button>

        <button class="btn btn-lavender" id="exportJsonBtn">
          JSON 备份
        </button>

        <button class="btn btn-lavender" id="importJsonBtn">
          JSON 恢复
        </button>

        <button class="btn btn-danger" id="clearAllBtn">
          删除全部数据
        </button>

      </div>

      <input
        id="excelInput"
        class="hidden-input"
        type="file"
        accept=".xlsx,.xls"
      >

      <input
        id="jsonInput"
        class="hidden-input"
        type="file"
        accept=".json"
      >

    </div>

  </section>

</main>


<script>

const STORAGE_KEY = "ballet_price_database_v3";

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

let editingId = null;


/* =================================
   DOM
================================= */

const $ = id => document.getElementById(id);


/* =================================
   初始化时间选择器
================================= */

function initTimeSelects(){

  const homeHour = $("homeTimeHour");
  const workHour = $("workTimeHour");

  const homeMinute = $("homeTimeMinute");
  const workMinute = $("workTimeMinute");

  for(let i=0;i<=12;i++){

    const text = `${i}小时`;

    homeHour.insertAdjacentHTML(
      "beforeend",
      `<option value="${i}">${text}</option>`
    );

    workHour.insertAdjacentHTML(
      "beforeend",
      `<option value="${i}">${text}</option>`
    );
  }

  for(let i=0;i<60;i++){

    const text = `${i}分钟`;

    homeMinute.insertAdjacentHTML(
      "beforeend",
      `<option value="${i}">${text}</option>`
    );

    workMinute.insertAdjacentHTML(
      "beforeend",
      `<option value="${i}">${text}</option>`
    );
  }
}

initTimeSelects();


/* =================================
   工具函数
================================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


function uid(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2);
}


function money(value){

  if(value === "" || value == null || isNaN(value)){
    return "—";
  }

  return "¥" + Number(value).toLocaleString(
    "zh-CN",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );
}


function getHourlyPrice(item){

  const price = Number(item.price);
  const lessons = Number(item.lessons);
  const minutes = Number(item.minutes);

  if(
    !price ||
    !lessons ||
    !minutes ||
    minutes <= 0
  ){
    return null;
  }

  const totalHours =
    lessons * minutes / 60;

  return price / totalHours;
}


function formatDuration(hours, minutes){

  hours = Number(hours || 0);
  minutes = Number(minutes || 0);

  if(!hours && !minutes){
    return "—";
  }

  if(hours && minutes){
    return `${hours}h ${minutes}min`;
  }

  if(hours){
    return `${hours}h`;
  }

  return `${minutes}min`;
}


function validityText(item){

  if(item.permanent){
    return "永久有效";
  }

  if(
    item.validityValue === "" ||
    item.validityValue == null
  ){
    return "—";
  }

  const unitMap = {
    year:"年",
    month:"月",
    day:"天"
  };

  return `${item.validityValue}${unitMap[item.validityUnit] || ""}`;
}


/* =================================
   表单
================================= */

function getFormData(){

  return {

    id: editingId || uid(),

    institution: $("institution").value.trim(),

    packageName:
      $("packageName").value.trim(),

    price:
      Number($("price").value),

    lessons:
      Number($("lessons").value),

    minutes:
      Number($("minutes").value || 60),

    validityValue:
      $("validityValue").value,

    validityUnit:
      $("validityUnit").value,

    permanent:
      $("permanent").checked,

    district:
      $("district").value.trim(),

    metroStation:
      $("metroStation").value.trim(),

    homeDistance:
      $("homeDistance").value === ""
        ? ""
        : Number($("homeDistance").value),

    workDistance:
      $("workDistance").value === ""
        ? ""
        : Number($("workDistance").value),

    homeTimeHour:
      $("homeTimeHour").value,

    homeTimeMinute:
      $("homeTimeMinute").value,

    workTimeHour:
      $("workTimeHour").value,

    workTimeMinute:
      $("workTimeMinute").value
  };
}


function fillForm(item){

  $("institution").value =
    item.institution || "";

  $("packageName").value =
    item.packageName || "";

  $("price").value =
    item.price ?? "";

  $("lessons").value =
    item.lessons ?? "";

  $("minutes").value =
    item.minutes ?? 60;

  $("validityValue").value =
    item.validityValue ?? "";

  $("validityUnit").value =
    item.validityUnit || "month";

  $("permanent").checked =
    !!item.permanent;

  $("district").value =
    item.district || "";

  $("metroStation").value =
    item.metroStation || "";

  $("homeDistance").value =
    item.homeDistance ?? "";

  $("workDistance").value =
    item.workDistance ?? "";

  $("homeTimeHour").value =
    item.homeTimeHour ?? "";

  $("homeTimeMinute").value =
    item.homeTimeMinute ?? "";

  $("workTimeHour").value =
    item.workTimeHour ?? "";

  $("workTimeMinute").value =
    item.workTimeMinute ?? "";
}


function resetForm(){

  editingId = null;

  $("institution").value = "";
  $("packageName").value = "";
  $("price").value = "";
  $("lessons").value = "";
  $("minutes").value = 60;

  $("validityValue").value = "";
  $("validityUnit").value = "month";
  $("permanent").checked = false;

  $("district").value = "";
  $("metroStation").value = "";

  $("homeDistance").value = "";
  $("workDistance").value = "";

  $("homeTimeHour").value = "";
  $("homeTimeMinute").value = "";

  $("workTimeHour").value = "";
  $("workTimeMinute").value = "";

  $("formToggleText").textContent =
    "新建套餐";

  $("cancelEditBtn").style.display =
    "none";

  $("saveBtn").textContent =
    "保存套餐";
}


function openForm(){

  $("formPanel").classList.add("open");
}


function closeForm(){

  $("formPanel").classList.remove("open");
}


/* =================================
   保存
================================= */

$("saveBtn").addEventListener(
  "click",
  () => {

    const item = getFormData();

    if(!item.institution){
      alert("请填写机构名称");
      return;
    }

    if(!item.packageName){
      alert("请填写套餐名称");
      return;
    }

    if(!item.price || item.price < 0){
      alert("请填写正确的套餐价格");
      return;
    }

    if(!item.lessons || item.lessons <= 0){
      alert("请填写正确的课时数量");
      return;
    }

    if(!item.minutes || item.minutes <= 0){
      alert("请填写正确的每节课时长");
      return;
    }

    if(editingId){

      const index =
        data.findIndex(
          x => x.id === editingId
        );

      if(index !== -1){
        data[index] = item;
      }

    }else{

      data.push(item);

    }

    saveData();

    resetForm();

    closeForm();

    renderAll();

  }
);


/* =================================
   新建套餐展开
================================= */

$("formToggle").addEventListener(
  "click",
  () => {

    $("formPanel")
      .classList.toggle("open");

  }
);


/* =================================
   编辑
================================= */

function editItem(id){

  const item =
    data.find(x => x.id === id);

  if(!item) return;

  editingId = id;

  fillForm(item);

  $("formToggleText").textContent =
    "编辑套餐";

  $("cancelEditBtn").style.display =
    "inline-block";

  $("saveBtn").textContent =
    "保存修改";

  openForm();

  window.scrollTo({
    top:$("formPanel").offsetTop - 10,
    behavior:"smooth"
  });
}


$("cancelEditBtn").addEventListener(
  "click",
  () => {

    resetForm();
    closeForm();

  }
);


$("clearFormBtn").addEventListener(
  "click",
  () => {

    resetForm();

  }
);


/* =================================
   复制套餐
================================= */

function duplicateItem(id){

  const original =
    data.find(x => x.id === id);

  if(!original) return;

  /*
    复制全部信息，
    但生成新的ID。
    这样同一家机构可以快速
    建立第二个、第三个套餐。
  */

  const copy = {
    ...original,
    id:uid(),
    packageName:
      original.packageName
        ? original.packageName + "（复制）"
        : "复制套餐"
  };

  /*
    复制不会直接保存，
    而是放进“新建套餐”表单，
    用户可以修改价格/课数等后再保存。
  */

  editingId = null;

  fillForm(copy);

  $("formToggleText").textContent =
    "新建套餐";

  $("cancelEditBtn").style.display =
    "none";

  $("saveBtn").textContent =
    "保存套餐";

  openForm();

  window.scrollTo({
    top:$("formPanel").offsetTop - 10,
    behavior:"smooth"
  });

}


/* =================================
   删除
================================= */

function deleteItem(id){

  const item =
    data.find(x => x.id === id);

  if(!item) return;

  if(
    !confirm(
      `确定删除「${item.institution} · ${item.packageName}」吗？`
    )
  ){
    return;
  }

  data =
    data.filter(x => x.id !== id);

  saveData();

  renderAll();
}


/* =================================
   详情
================================= */

function toggleDetail(id){

  const card =
    document.querySelector(
      `[data-card-id="${id}"]`
    );

  if(card){
    card.classList.toggle(
      "show-detail"
    );
  }
}


/* =================================
   搜索 / 排序
================================= */

$("searchInput").addEventListener(
  "input",
  renderAll
);

$("sortSelect").addEventListener(
  "change",
  renderAll
);


function getFilteredData(){

  const keyword =
    $("searchInput").value
      .trim()
      .toLowerCase();

  let result =
    data.filter(item => {

      if(!keyword){
        return true;
      }

      return (
        String(item.institution || "")
          .toLowerCase()
          .includes(keyword)
        ||
        String(item.packageName || "")
          .toLowerCase()
          .includes(keyword)
      );

    });

  const sort =
    $("sortSelect").value;

  result.sort((a,b) => {

    const ah =
      getHourlyPrice(a) ?? Infinity;

    const bh =
      getHourlyPrice(b) ?? Infinity;

    if(sort === "hourlyAsc"){
      return ah - bh;
    }

    if(sort === "hourlyDesc"){
      return bh - ah;
    }

    if(sort === "priceAsc"){
      return Number(a.price) - Number(b.price);
    }

    if(sort === "priceDesc"){
      return Number(b.price) - Number(a.price);
    }

    if(sort === "institution"){
      return String(a.institution)
        .localeCompare(
          String(b.institution),
          "zh-CN"
        );
    }

    return 0;

  });

  return result;
}


/* =================================
   价格总览
================================= */

function renderSummary(){

  const institutions =
    new Set(
      data
        .map(x => x.institution)
        .filter(Boolean)
    );

  const hourlyPrices =
    data
      .map(getHourlyPrice)
      .filter(x =>
        x !== null &&
        Number.isFinite(x)
      );

  $("institutionCount").textContent =
    institutions.size;

  $("packageCountText").textContent =
    `${data.length} 个套餐`;

  if(hourlyPrices.length){

    const min =
      Math.min(...hourlyPrices);

    const max =
      Math.max(...hourlyPrices);

    $("lowestHourly").textContent =
      money(min);

    $("highestHourly").textContent =
      money(max);

  }else{

    $("lowestHourly").textContent =
      "—";

    $("highestHourly").textContent =
      "—";
  }
}


/* =================================
   价格图表
================================= */

function renderPriceChart(){

  const container =
    $("priceChart");

  const list =
    getFilteredData();

  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        暂无可比较的套餐
      </div>`;

    return;
  }

  const prices =
    list
      .map(getHourlyPrice)
      .filter(
        x =>
          x !== null &&
          Number.isFinite(x)
      );

  if(!prices.length){

    container.innerHTML =
      `<div class="empty">
        请先填写价格、课时数量和每节课时长
      </div>`;

    return;
  }

  const max =
    Math.max(...prices);

  container.innerHTML =
    list.map(item => {

      const value =
        getHourlyPrice(item);

      if(
        value === null ||
        !Number.isFinite(value)
      ){
        return "";
      }

      const width =
        Math.max(
          3,
          value / max * 100
        );

      return `

        <div class="bar-row">

          <div class="bar-name"
               title="${escapeHtml(item.institution + " · " + item.packageName)}">

            ${escapeHtml(item.institution)}
            ·
            ${escapeHtml(item.packageName)}

          </div>

          <div class="bar-track">

            <div
              class="bar-fill"
              style="width:${width}%">
            </div>

          </div>

          <div class="bar-value">
            ${money(value)}/h
          </div>

        </div>

      `;

    }).join("");

}


/* =================================
   通勤图表
================================= */

function renderCommuteChart(){

  const container =
    $("commuteChart");

  const list =
    getFilteredData()
      .filter(item =>
        item.homeTimeHour !== "" ||
        item.workTimeHour !== ""
      );

  if(!list.length){

    container.innerHTML =
      `<div class="empty">
        还没有填写通勤时间
      </div>`;

    return;
  }

  const times =
    list.flatMap(item => [

      Number(item.homeTimeHour || 0) * 60 +
      Number(item.homeTimeMinute || 0),

      Number(item.workTimeHour || 0) * 60 +
      Number(item.workTimeMinute || 0)

    ]);

  const max =
    Math.max(
      ...times,
      1
    );

  container.innerHTML =
    list.map(item => {

      const home =
        Number(item.homeTimeHour || 0) * 60 +
        Number(item.homeTimeMinute || 0);

      const work =
        Number(item.workTimeHour || 0) * 60 +
        Number(item.workTimeMinute || 0);

      const homeWidth =
        home ? Math.max(4,home/max*100) : 0;

      const workWidth =
        work ? Math.max(4,work/max*100) : 0;

      return `

        <div class="commute-row">

          <div class="commute-name">

            <div class="commute-institution">
              ${escapeHtml(item.institution)}
            </div>

            <div class="commute-district">
              ${escapeHtml(
                item.district || "未填写区域"
              )}
            </div>

          </div>


          <div class="commute-bars">

            <div class="commute-line">

              <div class="commute-icon">
                🏠
              </div>

              <div class="commute-track">
                <div
                  class="commute-fill-home"
                  style="width:${homeWidth}%">
                </div>
              </div>

              <div class="commute-time">
                ${formatDuration(
                  item.homeTimeHour,
                  item.homeTimeMinute
                )}
              </div>

            </div>


            <div class="commute-line">

              <div class="commute-icon">
                💼
              </div>

              <div class="commute-track">
                <div
                  class="commute-fill-work"
                  style="width:${workWidth}%">
                </div>
              </div>

              <div class="commute-time">
                ${formatDuration(
                  item.workTimeHour,
                  item.workTimeMinute
                )}
              </div>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =================================
   套餐列表
================================= */

function renderPackages(){

  const container =
    $("packageList");

  const list =
    getFilteredData();

  if(!list.length){

    container.innerHTML =
      `<div class="empty">

        <div class="empty-icon">🩰</div>

        <div>还没有套餐数据</div>

        <div style="font-size:11px;margin-top:5px">
          点击上面的「新建套餐」开始记录
        </div>

      </div>`;

    return;
  }


  container.innerHTML =
    list.map(item => {

      const hourly =
        getHourlyPrice(item);

      const totalHours =
        item.lessons &&
        item.minutes
          ? item.lessons *
            item.minutes /
            60
          : null;

      return `

        <div
          class="package-card"
          data-card-id="${item.id}"
        >

          <div class="package-main">

            <div class="package-top">

              <div class="package-title">

                <div class="institution">
                  ${escapeHtml(
                    item.institution
                  )}
                </div>

                <div class="package-name">
                  ${escapeHtml(
                    item.packageName
                  )}
                </div>

              </div>


              <div class="package-price">

                <strong>
                  ${money(item.price)}
                </strong>

                <span>
                  套餐总价
                </span>

              </div>

            </div>


            <div class="package-metrics">

              <div class="metric">

                <div class="metric-label">
                  每小时
                </div>

                <div class="metric-value">
                  ${hourly === null
                    ? "—"
                    : money(hourly)}
                </div>

              </div>


              <div class="metric">

                <div class="metric-label">
                  课时
                </div>

                <div class="metric-value">
                  ${item.lessons || "—"}节
                </div>

              </div>


              <div class="metric">

                <div class="metric-label">
                  每节
                </div>

                <div class="metric-value">
                  ${item.minutes || "—"}min
                </div>

              </div>

            </div>


            <div class="package-actions">

              <button
                class="btn btn-soft"
                onclick="toggleDetail('${item.id}')"
              >
                详情
              </button>

              <button
                class="btn btn-lavender"
                onclick="duplicateItem('${item.id}')"
              >
                复制
              </button>

              <button
                class="btn"
                onclick="editItem('${item.id}')"
              >
                编辑
              </button>

              <button
                class="btn btn-danger"
                onclick="deleteItem('${item.id}')"
              >
                删除
              </button>

            </div>

          </div>


          <!-- 详情 -->
          <div class="detail">

            <div class="detail-grid">

              <div class="detail-item">

                <label>总课时</label>

                <div>
                  ${
                    totalHours
                      ? totalHours.toFixed(2) + " 小时"
                      : "—"
                  }
                </div>

              </div>


              <div class="detail-item">

                <label>每小时价格</label>

                <div>
                  ${
                    hourly === null
                      ? "—"
                      : money(hourly)
                  }
                </div>

              </div>


              <div class="detail-item">

                <label>有效期</label>

                <div>
                  ${validityText(item)}
                </div>

              </div>


              <div class="detail-item">

                <label>区域</label>

                <div>
                  ${escapeHtml(
                    item.district || "—"
                  )}
                </div>

              </div>


              <div class="detail-item">

                <label>最近地铁站</label>

                <div>
                  ${escapeHtml(
                    item.metroStation || "—"
                  )}
                </div>

              </div>


              <div class="detail-item">

                <label>距家</label>

                <div>
                  ${
                    item.homeDistance !== ""
                      ? item.homeDistance + " km"
                      : "—"
                  }
                </div>

              </div>


              <div class="detail-item">

                <label>距公司</label>

                <div>
                  ${
                    item.workDistance !== ""
                      ? item.workDistance + " km"
                      : "—"
                  }
                </div>

              </div>


              <div class="detail-item">

                <label>到家时间</label>

                <div>
                  ${formatDuration(
                    item.homeTimeHour,
                    item.homeTimeMinute
                  )}
                </div>

              </div>


              <div class="detail-item">

                <label>到公司时间</label>

                <div>
                  ${formatDuration(
                    item.workTimeHour,
                    item.workTimeMinute
                  )}
                </div>

              </div>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =================================
   HTML安全
================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =================================
   Excel 导出
================================= */

$("exportExcelBtn").addEventListener(
  "click",
  () => {

    if(!data.length){

      alert("目前没有数据可以导出");

      return;
    }

    const rows =
      data.map(item => {

        const hourly =
          getHourlyPrice(item);

        return {

          "机构名称":
            item.institution,

          "套餐名称":
            item.packageName,

          "套餐价格":
            item.price,

          "课时数量":
            item.lessons,

          "每节课时长":
            item.minutes,

          "总课时":
            item.lessons *
            item.minutes /
            60,

          "每小时价格":
            hourly,

          "有效期数值":
            item.validityValue,

          "有效期单位":
            item.permanent
              ? "永久"
              : item.validityUnit,

          "有效期":
            validityText(item),

          "区域":
            item.district,

          "最近地铁站":
            item.metroStation,

          "距家距离(km)":
            item.homeDistance,

          "距公司距离(km)":
            item.workDistance,

          "到家时间":
            formatDuration(
              item.homeTimeHour,
              item.homeTimeMinute
            ),

          "到公司时间":
            formatDuration(
              item.workTimeHour,
              item.workTimeMinute
            ),

          "到家小时":
            item.homeTimeHour,

          "到家分钟":
            item.homeTimeMinute,

          "到公司小时":
            item.workTimeHour,

          "到公司分钟":
            item.workTimeMinute

        };

      });


    const ws =
      XLSX.utils.json_to_sheet(rows);

    const wb =
      XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      "芭蕾价格"
    );

    XLSX.writeFile(
      wb,
      "芭蕾机构价格对比.xlsx"
    );

  }
);


/* =================================
   Excel 导入
================================= */

$("importExcelBtn").addEventListener(
  "click",
  () => {

    $("excelInput").click();

  }
);


$("excelInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file) return;

    try{

      const buffer =
        await file.arrayBuffer();

      const workbook =
        XLSX.read(buffer,{
          type:"array"
        });

      const sheet =
        workbook.Sheets[
          workbook.SheetNames[0]
        ];

      const rows =
        XLSX.utils.sheet_to_json(sheet);

      if(!rows.length){

        alert("Excel里没有数据");

        return;
      }


      const imported =
        rows.map(row => {

          let unit =
            row["有效期单位"];

          let permanent =
            unit === "永久";

          if(unit === "年"){
            unit = "year";
          }

          else if(unit === "月"){
            unit = "month";
          }

          else if(unit === "天"){
            unit = "day";
          }

          else if(
            unit !== "year" &&
            unit !== "month" &&
            unit !== "day"
          ){

            unit = "month";

          }


          return {

            id:uid(),

            institution:
              String(
                row["机构名称"] || ""
              ),

            packageName:
              String(
                row["套餐名称"] || ""
              ),

            price:
              Number(
                row["套餐价格"] || 0
              ),

            lessons:
              Number(
                row["课时数量"] || 0
              ),

            minutes:
              Number(
                row["每节课时长"] || 60
              ),

            validityValue:
              row["有效期数值"] ?? "",

            validityUnit:
              unit,

            permanent,

            district:
              String(
                row["区域"] || ""
              ),

            metroStation:
              String(
                row["最近地铁站"] || ""
              ),

            homeDistance:
              row["距家距离(km)"] ?? "",

            workDistance:
              row["距公司距离(km)"] ?? "",

            homeTimeHour:
              row["到家小时"] ?? "",

            homeTimeMinute:
              row["到家分钟"] ?? "",

            workTimeHour:
              row["到公司小时"] ?? "",

            workTimeMinute:
              row["到公司分钟"] ?? ""

          };

        });


      data =
        data.concat(imported);

      saveData();

      renderAll();

      alert(
        `成功导入 ${imported.length} 个套餐`
      );

    }catch(error){

      console.error(error);

      alert(
        "Excel导入失败，请检查文件格式"
      );

    }

    event.target.value = "";

  }
);


/* =================================
   JSON备份
================================= */

$("exportJsonBtn").addEventListener(
  "click",
  () => {

    const blob =
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type:"application/json"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "芭蕾机构价格备份.json";

    a.click();

    URL.revokeObjectURL(url);

  }
);


/* =================================
   JSON恢复
================================= */

$("importJsonBtn").addEventListener(
  "click",
  () => {

    $("jsonInput").click();

  }
);


$("jsonInput").addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];

    if(!file) return;

    try{

      const text =
        await file.text();

      const imported =
        JSON.parse(text);

      if(!Array.isArray(imported)){

        throw new Error(
          "格式错误"
        );

      }

      if(
        !confirm(
          `确定用备份数据替换现在的 ${data.length} 条数据吗？`
        )
      ){
        return;
      }

      data = imported;

      saveData();

      renderAll();

      alert("恢复成功");

    }catch(error){

      alert(
        "JSON文件格式不正确"
      );

    }

    event.target.value = "";

  }
);


/* =================================
   删除全部
================================= */

$("clearAllBtn").addEventListener(
  "click",
  () => {

    if(!data.length){

      alert("目前没有数据");

      return;
    }

    if(
      !confirm(
        `确定删除全部 ${data.length} 个套餐吗？此操作不可恢复。`
      )
    ){

      return;

    }

    data = [];

    saveData();

    renderAll();

  }
);


/* =================================
   永久有效联动
================================= */

$("permanent").addEventListener(
  "change",
  () => {

    const disabled =
      $("permanent").checked;

    $("validityValue").disabled =
      disabled;

    $("validityUnit").disabled =
      disabled;

    if(disabled){

      $("validityValue").value = "";

    }

  }
);


/* =================================
   渲染
================================= */

function renderAll(){

  renderSummary();

  renderPriceChart();

  renderCommuteChart();

  renderPackages();

}


renderAll();

</script>
