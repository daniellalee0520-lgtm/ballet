<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f8f4f2;
  --card:#fffdfc;
  --text:#302c2d;
  --muted:#93888a;
  --border:#eadfdd;

  --pink:#c98f9f;
  --pink-dark:#a9687c;
  --pink-light:#f5e5e9;
  --pink-soft:#fbf1f3;

  --lavender:#a69bbd;
  --lavender-light:#eeeaf5;

  --cream:#f5eee6;

  --green:#78917d;
  --green-light:#eaf1eb;

  --danger:#b86c70;
  --danger-light:#f8e9ea;

  --shadow:0 8px 25px rgba(91,68,72,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",
  "Helvetica Neue",Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.container{
  width:min(1100px,calc(100% - 28px));
  margin:auto;
}

/* =========================
   HEADER
========================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:30px 0 28px;
  background:
    radial-gradient(circle at 90% 10%,rgba(201,143,159,.18),transparent 28%),
    radial-gradient(circle at 5% 70%,rgba(166,155,189,.13),transparent 25%),
    linear-gradient(135deg,#fffaf8,#f8f0f0 55%,#f5f0f6);
  border-bottom:1px solid var(--border);
}

.hero:after{
  content:"";
  position:absolute;
  right:-20px;
  bottom:-50px;
  width:190px;
  height:190px;
  border:1px solid rgba(169,104,124,.14);
  border-radius:50%;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--pink-dark);
  font-size:11px;
  letter-spacing:2px;
  font-weight:700;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.75);
  box-shadow:0 5px 15px rgba(120,80,90,.08);
  font-size:19px;
}

.hero h1{
  margin:13px 0 7px;
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:31px;
  font-weight:500;
  letter-spacing:1px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   BUTTON
========================= */

.primary-btn{
  background:var(--pink);
  color:white;
  border-radius:13px;
  padding:12px 17px;
  font-weight:600;
  box-shadow:0 5px 15px rgba(201,143,159,.25);
}

.primary-btn:active{
  transform:scale(.98);
}

.secondary-btn{
  background:white;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
}

.small-btn{
  padding:8px 11px;
  font-size:12px;
  border-radius:10px;
}

/* =========================
   MAIN
========================= */

main{
  padding:22px 0 60px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.section-title{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:20px;
}

.section-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

/* =========================
   FORM
========================= */

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:20px;
}

.form-toggle{
  width:100%;
  background:transparent;
  padding:15px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--text);
}

.form-toggle-left{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}

.plus-circle{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--pink-light);
  color:var(--pink-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.chevron{
  color:var(--muted);
  transition:.25s;
}

.form-card.open .chevron{
  transform:rotate(180deg);
}

.form-body{
  display:none;
  padding:0 17px 18px;
  border-top:1px solid var(--border);
}

.form-card.open .form-body{
  display:block;
}

.form-note{
  margin:14px 0;
  padding:10px 12px;
  background:var(--pink-soft);
  border-radius:10px;
  color:var(--pink-dark);
  font-size:12px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  color:var(--muted);
}

.field input,
.field select{
  width:100%;
  height:43px;
  padding:0 12px;
  border:1px solid var(--border);
  background:white;
  border-radius:11px;
  color:var(--text);
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(201,143,159,.1);
}

.validity-row{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:8px;
}

.permanent-row{
  display:flex;
  align-items:center;
  height:43px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:11px;
  background:white;
  gap:9px;
}

.permanent-row input{
  width:18px;
  height:18px;
}

.validity-preview{
  margin-top:6px;
  color:var(--pink-dark);
  font-size:11px;
}

.time-display{
  width:100%;
  height:43px;
  padding:0 12px;
  border:1px solid var(--border);
  background:white;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--text);
  cursor:pointer;
}

.time-display.empty{
  color:#aaa0a1;
}

.time-display span:last-child{
  color:var(--muted);
  font-size:12px;
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:16px;
}

/* =========================
   SUMMARY
========================= */

.summary-title{
  margin:24px 0 10px;
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:19px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  box-shadow:var(--shadow);
  min-width:0;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
}

.stat-value{
  margin-top:5px;
  font-size:21px;
  font-weight:700;
  white-space:nowrap;
}

.stat-unit{
  margin-left:3px;
  color:var(--muted);
  font-size:11px;
}

/* =========================
   FILTER
========================= */

.filter-row{
  margin:18px 0 15px;
  display:flex;
  gap:9px;
}

.search{
  flex:1;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 13px;
  background:white;
  outline:none;
}

.sort-select{
  width:150px;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 10px;
  background:white;
}

/* =========================
   CHART
========================= */

.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:17px;
  margin-bottom:18px;
}

.chart-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:15px;
}

.chart-title{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:18px;
}

.chart-caption{
  font-size:11px;
  color:var(--muted);
}

.bar-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.bar-row{
  display:grid;
  grid-template-columns:minmax(85px,150px) 1fr 76px;
  align-items:center;
  gap:9px;
  min-height:32px;
}

.bar-name{
  min-width:0;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.bar-track{
  height:18px;
  background:#f1e9e8;
  border-radius:999px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#d6a5b2,#b98496);
  min-width:3px;
}

.bar-value{
  text-align:right;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

/* 通勤图 */

.commute-bar .bar-fill{
  background:linear-gradient(90deg,#b5a8ca,#8e7fa9);
}

.commute-name{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.commute-name strong{
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.commute-name span{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   PACKAGE LIST
========================= */

.list-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:23px 0 10px;
}

.package-count{
  color:var(--muted);
  font-size:11px;
}

.package-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.swipe-card{
  position:relative;
  overflow:hidden;
  border-radius:16px;
}

.package-actions{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:290px;
  display:flex;
  align-items:stretch;
  transform:translateX(100%);
  transition:transform .22s ease;
  z-index:1;
}

.swipe-card.open .package-actions{
  transform:translateX(0);
}

.action-btn{
  flex:1;
  min-width:0;
  color:white;
  font-size:12px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.action-btn.detail{
  background:#9c8fb2;
}

.action-btn.copy{
  background:#c18e9d;
}

.action-btn.edit{
  background:#5e5a5b;
}

.action-btn.delete{
  background:#c96f74;
}

.action-icon{
  font-size:19px;
}

.package-main{
  position:relative;
  z-index:2;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:15px;
  transition:transform .22s ease;
  touch-action:pan-y;
}

.swipe-card.open .package-main{
  transform:translateX(-290px);
  border-radius:16px 0 0 16px;
}

.package-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.package-institution{
  font-size:11px;
  color:var(--pink-dark);
  margin-bottom:4px;
}

.package-name{
  font-size:16px;
  font-weight:650;
}

.package-price{
  font-size:21px;
  font-weight:750;
  white-space:nowrap;
}

.package-bottom{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:13px;
}

.metric{
  background:#f8f3f1;
  padding:7px 10px;
  border-radius:9px;
  font-size:11px;
}

.metric strong{
  font-size:13px;
}

.metric.price{
  background:var(--pink-light);
  color:var(--pink-dark);
}

.swipe-tip{
  margin-top:9px;
  color:#aaa0a1;
  font-size:10px;
  text-align:right;
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:16px;
}

/* =========================
   DETAIL MODAL
========================= */

.modal-mask{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(44,37,39,.35);
  backdrop-filter:blur(5px);
  align-items:flex-end;
  justify-content:center;
}

.modal-mask.show{
  display:flex;
}

.detail-modal{
  width:min(620px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fffdfc;
  border-radius:23px 23px 0 0;
  padding:18px 18px 30px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-title{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:20px;
}

.close-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f3eeed;
  color:var(--muted);
}

.detail-section{
  margin-top:17px;
}

.detail-section-title{
  color:var(--pink-dark);
  font-size:12px;
  font-weight:700;
  margin-bottom:9px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.detail-item{
  background:#f8f4f2;
  border-radius:11px;
  padding:11px;
}

.detail-item label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.detail-item strong{
  font-size:13px;
}

/* =========================
   TIME PICKER
========================= */

.time-modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  background:rgba(44,37,39,.38);
  backdrop-filter:blur(5px);
  align-items:flex-end;
  justify-content:center;
}

.time-modal.show{
  display:flex;
}

.time-picker{
  width:min(520px,100%);
  background:white;
  border-radius:23px 23px 0 0;
  overflow:hidden;
  animation:slideUp .22s ease;
}

.time-picker-head{
  padding:14px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.time-picker-title{
  font-size:15px;
  font-weight:650;
}

.time-picker-value{
  color:var(--pink-dark);
  font-size:14px;
  font-weight:700;
}

.wheels{
  height:250px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  padding:0 20px;
  position:relative;
  overflow:hidden;
}

.wheels:before{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  top:105px;
  height:50px;
  border-radius:25px;
  background:#f5f3f3;
  z-index:0;
}

.wheel{
  height:250px;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  position:relative;
  z-index:1;
  overscroll-behavior:contain;
}

.wheel::-webkit-scrollbar{
  display:none;
}

.wheel-inner{
  padding:100px 0;
}

.wheel-item{
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:center;
  font-size:25px;
  color:#b9b5b5;
  font-weight:500;
}

.wheel-item.selected{
  color:#2f2c2d;
  font-weight:700;
}

.wheel-unit{
  position:absolute;
  top:121px;
  z-index:3;
  pointer-events:none;
  color:#777;
  font-size:12px;
}

.unit-hour{
  left:calc(33.333% - 10px);
}

.unit-minute{
  left:calc(66.666% - 12px);
}

.unit-second{
  right:18px;
}

.time-picker-footer{
  display:flex;
  gap:9px;
  padding:13px 17px calc(13px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
}

.time-picker-footer button{
  flex:1;
  height:44px;
  border-radius:12px;
}

.time-cancel{
  background:#f2eeee;
}

.time-confirm{
  background:var(--pink);
  color:white;
}

/* =========================
   DATA MANAGE
========================= */

.data-card{
  margin-top:20px;
  padding:15px;
  border-radius:17px;
  background:var(--card);
  border:1px solid var(--border);
}

.data-title{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:17px;
  margin-bottom:11px;
}

.data-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:500;
  background:#343031;
  color:white;
  padding:10px 15px;
  border-radius:999px;
  font-size:12px;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:680px){

  .container{
    width:min(100% - 20px,1100px);
  }

  .hero{
    padding:25px 0 23px;
  }

  .hero h1{
    font-size:26px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .summary-grid{
    gap:7px;
  }

  .stat-card{
    padding:11px 8px;
  }

  .stat-value{
    font-size:17px;
  }

  .stat-label{
    font-size:10px;
  }

  .filter-row{
    flex-direction:row;
  }

  .sort-select{
    width:125px;
  }

  .bar-row{
    grid-template-columns:92px 1fr 67px;
    gap:7px;
  }

  .bar-name{
    font-size:10px;
  }

  .bar-value{
    font-size:11px;
  }

  .package-actions{
    width:276px;
  }

  .swipe-card.open .package-main{
    transform:translateX(-276px);
  }

  .package-bottom{
    flex-wrap:wrap;
  }

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:390px){

  .package-actions{
    width:260px;
  }

  .swipe-card.open .package-main{
    transform:translateX(-260px);
  }

  .action-icon{
    font-size:17px;
  }

  .action-btn{
    font-size:10px;
  }

  .bar-row{
    grid-template-columns:80px 1fr 63px;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="container">
    <div class="brand">
      <div class="brand-mark">🩰</div>
      BALLET STUDIO · PRICE BOOK
    </div>

    <h1>芭蕾机构价格对比</h1>
    <p>把不同机构、不同课时长度的套餐，统一换算成每小时价格。</p>
  </div>
</header>

<main>
<div class="container">

  <!-- 新建套餐 -->
  <section class="form-card" id="formCard">

    <button class="form-toggle" onclick="toggleForm()">
      <div class="form-toggle-left">
        <span class="plus-circle" id="plusIcon">＋</span>
        <span id="formTitle">新建套餐</span>
      </div>
      <span class="chevron">⌄</span>
    </button>

    <div class="form-body">

      <div class="form-note">
        🩰 同一家机构可以录入多个套餐；你也可以在已有套餐上右滑，选择「复制」快速建立新套餐。
      </div>

      <div class="form-grid">

        <div class="field">
          <label>机构名称 *</label>
          <input id="institution" placeholder="例如：XX芭蕾">
        </div>

        <div class="field">
          <label>套餐名称 *</label>
          <input id="packageName" placeholder="例如：20节成人基础班">
        </div>

        <div class="field">
          <label>套餐价格 *</label>
          <input id="price" type="number" step="0.01" placeholder="例如 2580">
        </div>

        <div class="field">
          <label>课时数量 *</label>
          <input id="lessons" type="number" step="1" placeholder="例如 20">
        </div>

        <div class="field">
          <label>每节课时长（分钟） *</label>
          <input id="minutes" type="number" step="1" value="60" placeholder="60 / 75 / 90">
        </div>

        <!-- 有效期 -->
        <div class="field">
          <label>有效期</label>

          <div class="validity-row">

  <!-- 搜索 -->

<div class="modal-mask" id="detailMask" onclick="closeDetail(event)">

  <div class="detail-modal">

    <div class="modal-head">
      <div class="modal-title">套餐详情</div>
      <button class="close-btn" onclick="closeDetail()">×</button>
    </div>

    <div id="detailContent"></div>

  </div>
</div>


<!-- 时间滚轮 -->
<div class="time-modal" id="timeModal">

  <div class="time-picker">

    <div class="time-picker-head">

      <div class="time-picker-title" id="timePickerTitle">
        到家时间
      </div>

      <div class="time-picker-value" id="timePickerValue">
        00:00:00
      </div>

    </div>


    <div class="wheels">

      <div class="wheel" id="hourWheel">
        <div class="wheel-inner" id="hourWheelInner"></div>
      </div>

      <div class="wheel" id="minuteWheel">
        <div class="wheel-inner" id="minuteWheelInner"></div>
      </div>

      <div class="wheel" id="secondWheel">
        <div class="wheel-inner" id="secondWheelInner"></div>
      </div>

      <div class="wheel-unit unit-hour">时</div>
      <div class="wheel-unit unit-minute">分</div>
      <div class="wheel-unit unit-second">秒</div>

    </div>


    <div class="time-picker-footer">

      <button class="time-cancel" onclick="closeTimePicker()">
        取消
      </button>

      <button class="time-confirm" onclick="confirmTimePicker()">
        确定
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   数据
========================================================= */

const STORAGE_KEY = "ballet_price_database_v3";

let packages = [];

let editingId = null;

let timePickerTarget = null;

let tempTime = {
  hours:0,
  minutes:0,
  seconds:0
};


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   初始化
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

  loadData();

  buildTimeWheels();

  updateValidityPreview();

  $("validityValue").addEventListener(
    "input",
    updateValidityPreview
  );

  $("validityUnit").addEventListener(
    "change",
    updateValidityPreview
  );

  renderAll();

});


/* =========================================================
   数据读取
========================================================= */

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      packages = JSON.parse(saved);

      if(!Array.isArray(packages)){
        packages = [];
      }

    }

  }catch(e){

    console.error(e);

    packages = [];

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(packages)
  );

}


/* =========================================================
   新建表单
========================================================= */

function toggleForm(){

  $("formCard").classList.toggle("open");

}


function openNewForm(){

  editingId = null;

  resetForm();

  $("formTitle").textContent = "新建套餐";

  $("plusIcon").textContent = "＋";

  $("formCard").classList.add("open");

  window.scrollTo({
    top:$("formCard").offsetTop - 15,
    behavior:"smooth"
  });

}


function resetForm(){

  $("institution").value = "";
  $("packageName").value = "";
  $("price").value = "";
  $("lessons").value = "";
  $("minutes").value = 60;

  $("validityValue").value = "";
  $("validityUnit").value = "day";

  $("district").value = "";
  $("metroStation").value = "";

  $("homeDistance").value = "";
  $("workDistance").value = "";

  setTimeDisplay("home",null);
  setTimeDisplay("work",null);

  updateValidityPreview();

}


function cancelEdit(){

  editingId = null;

  resetForm();

  $("formTitle").textContent = "新建套餐";
  $("plusIcon").textContent = "＋";

  $("formCard").classList.remove("open");

}


/* =========================================================
   有效期
========================================================= */

function updateValidityPreview(){

  const value = parseFloat($("validityValue").value);
  const unit = $("validityUnit").value;

  if(unit === "permanent"){

    $("validityValue").style.display = "none";

    $("validityPreview").textContent =
      "永久有效";

    return;

  }

  $("validityValue").style.display = "block";

  if(!Number.isFinite(value) || value <= 0){

    $("validityPreview").textContent =
      "例如：90 天 ≈ 3.0 个月";

    return;

  }

  let days = 0;

  if(unit === "day"){
    days = value;
  }

  if(unit === "month"){
    days = value * 30;
  }

  if(unit === "year"){
    days = value * 365;
  }

  const months = days / 30;

  $("validityPreview").textContent =
    `${formatNumber(value)} ${unitText(unit)} ≈ ${months.toFixed(1)} 个月`;

}


function unitText(unit){

  if(unit === "day") return "天";
  if(unit === "month") return "个月";
  if(unit === "year") return "年";
  return "";

}


function formatNumber(n){

  if(Number.isInteger(n)){
    return n.toString();
  }

  return Number(n).toFixed(1);

}


/* =========================================================
   每小时价格
========================================================= */

function hourlyPrice(item){

  const price = Number(item.price) || 0;

  const lessons = Number(item.lessons) || 0;

  const minutes = Number(item.minutes) || 0;

  if(lessons <= 0 || minutes <= 0){
    return 0;
  }

  /*
    核心公式：

    总价格 ÷ 总课时分钟 × 60

    例如：
    10节 × 90分钟 = 900分钟

    1800 ÷ 900 × 60
    = 120元/小时
  */

  return price / (lessons * minutes) * 60;

}


function totalMinutes(item){

  return (
    (Number(item.lessons) || 0) *
    (Number(item.minutes) || 0)
  );

}


/* =========================================================
   时间
========================================================= */

function formatTime(h,m,s){

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");

}


function timeToSeconds(t){

  if(!t) return null;

  const h = Number(t.hours) || 0;
  const m = Number(t.minutes) || 0;
  const s = Number(t.seconds) || 0;

  return h * 3600 + m * 60 + s;

}


function secondsToText(seconds){

  if(seconds == null){
    return "未填写";
  }

  seconds = Number(seconds);

  const h = Math.floor(seconds / 3600);

  const m = Math.floor(
    (seconds % 3600) / 60
  );

  const s = seconds % 60;

  if(h > 0){
    return `${h}小时${m}分${s}秒`;
  }

  if(m > 0){
    return `${m}分${s}秒`;
  }

  return `${s}秒`;

}


/* =========================================================
   时间滚轮
========================================================= */

function buildTimeWheels(){

  buildWheel(
    $("hourWheelInner"),
    24,
    "hours"
  );

  buildWheel(
    $("minuteWheelInner"),
    60,
    "minutes"
  );

  buildWheel(
    $("secondWheelInner"),
    60,
    "seconds"
  );

}


function buildWheel(container,max,key){

  container.innerHTML = "";

  for(let i=0;i<max;i++){

    const item = document.createElement("div");

    item.className = "wheel-item";

    item.dataset.value = i;

    item.textContent =
      String(i).padStart(2,"0");

    container.appendChild(item);

  }

}


function openTimePicker(target){

  timePickerTarget = target;

  const current =
    target === "home"
      ? getStoredTime("home")
      : getStoredTime("work");

  if(current){

    tempTime = {
      hours:current.hours,
      minutes:current.minutes,
      seconds:current.seconds
    };

  }else{

    tempTime = {
      hours:0,
      minutes:0,
      seconds:0
    };

  }

  $("timePickerTitle").textContent =
    target === "home"
      ? "到家时间"
      : "到公司时间";

  $("timeModal").classList.add("show");

  setTimeout(()=>{

    scrollWheelTo(
      $("hourWheel"),
      tempTime.hours
    );

    scrollWheelTo(
      $("minuteWheel"),
      tempTime.minutes
    );

    scrollWheelTo(
      $("secondWheel"),
      tempTime.seconds
    );

    updateWheelSelected();

  },20);

}


function getStoredTime(target){

  const el =
    target === "home"
      ? $("homeTimeDisplay")
      : $("workTimeDisplay");

  if(!el.dataset.time){
    return null;
  }

  try{
    return JSON.parse(el.dataset.time);
  }catch{
    return null;
  }

}


function scrollWheelTo(wheel,value){

  const itemHeight = 50;

  wheel.scrollTop = value * itemHeight;

}


function updateWheelSelected(){

  updateWheel(
    $("hourWheel"),
    "hours"
  );

  updateWheel(
    $("minuteWheel"),
    "minutes"
  );

  updateWheel(
    $("secondWheel"),
    "seconds"
  );

  tempTime.hours =
    getWheelValue($("hourWheel"));

  tempTime.minutes =
    getWheelValue($("minuteWheel"));

  tempTime.seconds =
    getWheelValue($("secondWheel"));

  $("timePickerValue").textContent =
    formatTime(
      tempTime.hours,
      tempTime.minutes,
      tempTime.seconds
    );

}


function getWheelValue(wheel){

  const itemHeight = 50;

  return Math.max(
    0,
    Math.min(
      Math.round(wheel.scrollTop / itemHeight),
      wheel.querySelectorAll(".wheel-item").length - 1
    )
  );

}


function updateWheel(wheel,key){

  const value = getWheelValue(wheel);

  wheel.querySelectorAll(".wheel-item")
    .forEach(item=>{
      item.classList.toggle(
        "selected",
        Number(item.dataset.value) === value
      );
    });

}


["hourWheel","minuteWheel","secondWheel"]
.forEach(id=>{

  document.getElementById(id)
    .addEventListener("scroll",()=>{

      updateWheelSelected();

    });

});


function closeTimePicker(){

  $("timeModal").classList.remove("show");

  timePickerTarget = null;

}


function confirmTimePicker(){

  if(!timePickerTarget) return;

  setTimeDisplay(
    timePickerTarget,
    {
      hours:tempTime.hours,
      minutes:tempTime.minutes,
      seconds:tempTime.seconds
    }
  );

  closeTimePicker();

}


function setTimeDisplay(target,time){

  const el =
    target === "home"
      ? $("homeTimeDisplay")
      : $("workTimeDisplay");

  if(!time){

    el.classList.add("empty");

    el.innerHTML =
      "<span>请选择</span><span>›</span>";

    delete el.dataset.time;

    return;

  }

  el.classList.remove("empty");

  el.innerHTML =
    `<span>${formatTime(
      time.hours,
      time.minutes,
      time.seconds
    )}</span><span>›</span>`;

  el.dataset.time =
    JSON.stringify(time);

}


/* =========================================================
   保存套餐
========================================================= */

function savePackage(){

  const institution =
    $("institution").value.trim();

  const packageName =
    $("packageName").value.trim();

  const price =
    Number($("price").value);

  const lessons =
    Number($("lessons").value);

  const minutes =
    Number($("minutes").value);

  if(!institution){

    toast("请填写机构名称");

    return;

  }

  if(!packageName){

    toast("请填写套餐名称");

    return;

  }

  if(!Number.isFinite(price) || price < 0){

    toast("请输入正确的套餐价格");

    return;

  }

  if(!Number.isFinite(lessons) || lessons <= 0){

    toast("请输入正确的课时数量");

    return;

  }

  if(!Number.isFinite(minutes) || minutes <= 0){

    toast("请输入正确的每节课时长");

    return;

  }

  const validityUnit =
    $("validityUnit").value;

  let validityValue =
    Number($("validityValue").value);

  if(validityUnit !== "permanent"){

    if(!Number.isFinite(validityValue) || validityValue <= 0){

      toast("请填写有效期");

      return;

    }

  }else{

    validityValue = null;

  }


  const homeTime =
    getStoredTime("home");

  const workTime =
    getStoredTime("work");


  const item = {

    id:
      editingId ||
      Date.now().toString(),

    institution,

    packageName,

    price,

    lessons,

    minutes,

    validityValue,

    validityUnit,

    district:
      $("district").value.trim(),

    metroStation:
      $("metroStation").value.trim(),

    homeDistance:
      Number($("homeDistance").value) || 0,

    workDistance:
      Number($("workDistance").value) || 0,

    homeTime,

    workTime,

    createdAt:
      editingId
        ? (
            packages.find(x=>x.id===editingId)
              ?.createdAt || Date.now()
          )
        : Date.now()

  };


  if(editingId){

    const index =
      packages.findIndex(
        x=>x.id===editingId
      );

    if(index !== -1){

      packages[index] = item;

    }

  }else{

    packages.push(item);

  }


  saveData();

  renderAll();

  cancelEdit();

  toast(
    editingId
      ? "套餐已更新"
      : "套餐已保存"
  );

}


/* =========================================================
   编辑
========================================================= */

function editPackage(id){

  const item =
    packages.find(x=>x.id===id);

  if(!item) return;

  editingId = id;

  $("institution").value =
    item.institution || "";

  $("packageName").value =
    item.packageName || "";

  $("price").value =
    item.price ?? "";

  $("lessons").value =
    item.lessons ?? "";

  $("minutes").value =
    item.minutes ?? 60;

  $("validityValue").value =
    item.validityValue ?? "";

  $("validityUnit").value =
    item.validityUnit || "day";

  $("district").value =
    item.district || "";

  $("metroStation").value =
    item.metroStation || "";

  $("homeDistance").value =
    item.homeDistance || "";

  $("workDistance").value =
    item.workDistance || "";

  setTimeDisplay(
    "home",
    item.homeTime || null
  );

  setTimeDisplay(
    "work",
    item.workTime || null
  );

  $("formTitle").textContent =
    "编辑套餐";

  $("plusIcon").textContent =
    "✎";

  $("formCard").classList.add("open");

  updateValidityPreview();

  closeAllSwipe();

  window.scrollTo({
    top:$("formCard").offsetTop - 15,
    behavior:"smooth"
  });

}


/* =========================================================
   复制套餐
========================================================= */

function copyPackage(id){

  const item =
    packages.find(x=>x.id===id);

  if(!item) return;

  editingId = null;

  $("institution").value =
    item.institution || "";

  $("packageName").value =
    (item.packageName || "") + "（复制）";

  $("price").value =
    item.price ?? "";

  $("lessons").value =
    item.lessons ?? "";

  $("minutes").value =
    item.minutes ?? 60;

  $("validityValue").value =
    item.validityValue ?? "";

  $("validityUnit").value =
    item.validityUnit || "day";

  $("district").value =
    item.district || "";

  $("metroStation").value =
    item.metroStation || "";

  $("homeDistance").value =
    item.homeDistance || "";

  $("workDistance").value =
    item.workDistance || "";

  setTimeDisplay(
    "home",
    item.homeTime || null
  );

  setTimeDisplay(
    "work",
    item.workTime || null
  );

  $("formTitle").textContent =
    "新建套餐";

  $("plusIcon").textContent =
    "＋";

  $("formCard").classList.add("open");

  updateValidityPreview();

  closeAllSwipe();

  window.scrollTo({
    top:$("formCard").offsetTop - 15,
    behavior:"smooth"
  });

  toast("已复制套餐信息，请修改后保存");

}


/* =========================================================
   删除
========================================================= */

function deletePackage(id){

  const item =
    packages.find(x=>x.id===id);

  if(!item) return;

  if(!confirm(
    `确定删除「${item.institution} · ${item.packageName}」吗？`
  )){
    return;
  }

  packages =
    packages.filter(
      x=>x.id!==id
    );

  saveData();

  renderAll();

  toast("已删除");

}


/* =========================================================
   详情
========================================================= */

function showDetail(id){

  const item =
    packages.find(x=>x.id===id);

  if(!item) return;

  const hourly =
    hourlyPrice(item);

  let validityText = "未填写";

  if(item.validityUnit === "permanent"){

    validityText = "永久有效";

  }else if(item.validityValue){

    let days = 0;

    if(item.validityUnit === "day"){
      days = Number(item.validityValue);
    }

    if(item.validityUnit === "month"){
      days = Number(item.validityValue) * 30;
    }

    if(item.validityUnit === "year"){
      days = Number(item.validityValue) * 365;
    }

    validityText =
      `${formatNumber(item.validityValue)} ${unitText(item.validityUnit)} · ≈ ${(
        days / 30
      ).toFixed(1)} 个月`;

  }


  $("detailContent").innerHTML = `

    <div class="detail-section">

      <div class="detail-section-title">
        套餐信息
      </div>

      <div class="detail-grid">

        <div class="detail-item">
          <label>机构</label>
          <strong>${escapeHTML(item.institution)}</strong>
        </div>

        <div class="detail-item">
          <label>套餐</label>
          <strong>${escapeHTML(item.packageName)}</strong>
        </div>

        <div class="detail-item">
          <label>套餐总价</label>
          <strong>¥${Number(item.price).toFixed(2)}</strong>

/* =========================================================
   HTML 转义
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   总览
========================================================= */

function renderSummary(){

  const institutions =
    new Set(
      packages.map(x=>x.institution)
    );

  const prices =
    packages
      .map(hourlyPrice)
      .filter(x=>x>0);

  $("statInstitutions").textContent =
    institutions.size;

  $("statPackages").textContent =

/* =========================================================
   搜索
========================================================= */

function getFilteredPackages(){

  const keyword =
    $("searchInput").value
      .trim()
      .toLowerCase();

  let result =
    packages.filter(item=>{

      if(!keyword) return true;

      return (
        String(item.institution || "")
          .toLowerCase()
          .includes(keyword)
        ||
        String(item.packageName || "")
          .toLowerCase()
          .includes(keyword)
      );

    });


  const sort =
    $("sortSelect").value;

  if(sort === "priceAsc"){

    result.sort(
      (a,b)=>
        hourlyPrice(a)-hourlyPrice(b)
    );

  }else if(sort === "priceDesc"){

    result.sort(
      (a,b)=>
        hourlyPrice(b)-hourlyPrice(a)
    );

  }else if(sort === "name"){

    result.sort(
      (a,b)=>
        String(a.institution)
          .localeCompare(
            String(b.institution),
            "zh-CN"
          )
    );

  }

  return result;

}


/* =========================================================
   价格图
========================================================= */

function renderPriceChart(){

  const list =
    getFilteredPackages()
      .filter(x=>hourlyPrice(x)>0)
      .sort(
        (a,b)=>
          hourlyPrice(a)-hourlyPrice(b)
      );

  const box =
    $("priceChart");

  if(!list.length){

    box.innerHTML =
      `<div class="empty">暂无可比较的价格数据</div>`;

    return;

  }

  const max =
    Math.max(
      ...list.map(hourlyPrice)
    );


  box.innerHTML =
    list.map(item=>{

      const value =
        hourlyPrice(item);

      const percent =
        max > 0
          ? value / max * 100
          : 0;

      return `

        <div class="bar-row">

          <div class="bar-name"
               title="${escapeHTML(
                 item.institution +
                 " · " +
                 item.packageName
               )}">

            ${escapeHTML(item.institution)}
            ·
            ${escapeHTML(item.packageName)}

          </div>

          <div class="bar-track">

            <div
              class="bar-fill"
              style="width:${Math.max(percent,3)}%"
            ></div>

          </div>

          <div class="bar-value">
            ¥${value.toFixed(2)}/h

        </div>

      `;

    }).join("");

}


/* =========================================================
   通勤图
   同一家机构只出现一次
========================================================= */

function renderCommuteChart(){

  const list =
    getFilteredPackages();

  const map =
    new Map();

  list.forEach(item=>{

    const existing =
      map.get(item.institution);

    const homeSeconds =
      timeToSeconds(item.homeTime);

    const workSeconds =
      timeToSeconds(item.workTime);

    if(!existing){

      map.set(
        item.institution,
        {
          institution:item.institution,
          district:item.district || "",
          metroStation:item.metroStation || "",
          homeSeconds,
          workSeconds
        }
      );

    }else{

      /*
        同一家机构多个套餐：
        地点相同的话只保留一个机构。
        如果有多个通勤时间，则取最短的。
      */

      if(
        homeSeconds != null &&
        (
          existing.homeSeconds == null ||
          homeSeconds < existing.homeSeconds
        )
      ){

        existing.homeSeconds =
          homeSeconds;

      }

      if(
        workSeconds != null &&
        (
          existing.workSeconds == null ||
          workSeconds < existing.workSeconds
        )
      ){

        existing.workSeconds =
          workSeconds;

      }

      if(!existing.district){
        existing.district =
          item.district || "";
      }

      if(!existing.metroStation){
        existing.metroStation =
          item.metroStation || "";
      }

    }

  });


  const data =
    Array.from(map.values())
      .filter(x=>
        x.homeSeconds != null ||
        x.workSeconds != null
      )
      .sort((a,b)=>{

        const aa =
          a.homeSeconds ?? Infinity;

        const bb =
          b.homeSeconds ?? Infinity;

        return aa-bb;

      });


  const box =
    $("commuteChart");

  if(!data.length){

    box.innerHTML =
      `<div class="empty">暂无通勤时间数据</div>`;

    return;

  }


  const max =
    Math.max(
      ...data.flatMap(x=>[
        x.homeSeconds || 0,
        x.workSeconds || 0
      ])
    );


  box.innerHTML =
    data.map(item=>{

      const value =
        item.homeSeconds ??
        item.workSeconds;

      const percent =
        max > 0
          ? value / max * 100
          : 0;

      const location =
        [
          item.district,
          item.metroStation
        ]
        .filter(Boolean)
        .join(" · ") ||
        "位置未填写";


      let commuteLabel = "";

      if(
        item.homeSeconds != null &&
        item.workSeconds != null
      ){

        commuteLabel =
          `家 ${secondsToShort(item.homeSeconds)}
           · 公司 ${secondsToShort(item.workSeconds)}`;

      }else if(item.homeSeconds != null){

        commuteLabel =
          `家 ${secondsToShort(item.homeSeconds)}`;

      }else{

        commuteLabel =
          `公司 ${secondsToShort(item.workSeconds)}`;

      }


      return `

        <div class="bar-row">

          <div class="commute-name">

            <strong>
              ${escapeHTML(item.institution)}
            </strong>

            <span>
              ${escapeHTML(location)}
            </span>

          </div>

          <div class="bar-track">

            <div
              class="bar-fill"
              style="width:${Math.max(percent,3)}%"
            ></div>

          </div>

          <div class="bar-value">
            ${commuteLabel}
          </div>

        </div>

      `;

    }).join("");

}


function secondsToShort(seconds){

  if(seconds == null){
    return "--";
  }

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  if(h > 0){

    if(s > 0){
      return `${h}h${m}m${s}s`;
    }

    return `${h}h${m}m`;

  }

  if(s > 0){
    return `${m}m${s}s`;
  }

  return `${m}m`;

}

/* =========================================================
   右滑操作
========================================================= */

let swipeData = {
  card:null,
  startX:0,
  currentX:0,
  moving:false
};


function swipeStart(event){

  const main =
    event.currentTarget;

  const card =
    main.closest(".swipe-card");

  swipeData.card = card;

  swipeData.startX =
    event.touches[0].clientX;

  swipeData.currentX =
    swipeData.startX;

  swipeData.moving = true;

}


function swipeMove(event){

  if(!swipeData.moving) return;

  const x =
    event.touches[0].clientX;

  swipeData.currentX = x;

  const diff =
    x - swipeData.startX;

  const card =
    swipeData.card;

  if(!card) return;

  if(diff < -10){

    const amount =
      Math.min(
        Math.abs(diff),
        290
      );

    card.querySelector(".package-main")
      .style.transform =
      `translateX(-${amount}px)`;

  }

}


function swipeEnd(){

  if(!swipeData.moving) return;

  const diff =
    swipeData.currentX -
    swipeData.startX;

  const card =
    swipeData.card;

  if(!card){

    swipeData.moving = false;

    return;

  }

  card.querySelector(".package-main")
    .style.transform = "";

  if(diff < -70){

    closeAllSwipe();

    card.classList.add("open");

  }else if(diff > 70){

    card.classList.remove("open");

  }

  swipeData.moving = false;

}


function closeAllSwipe(){

  document
    .querySelectorAll(".swipe-card.open")
    .forEach(card=>{
      card.classList.remove("open");
    });

}


/* 点击空白区域关闭右滑 */

  if(

  }

});

            : unitText(item.validityUnit),

            ? formatTime(

              )

    });


  const ws =

  );

  toast("Excel 已导出");

}


/* =========================================================
   Excel 导入
========================================================= */

function importExcel(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e){

    try{

      const workbook =
        XLSX.read(
          e.target.result,
          {type:"array"}
        );

      const sheet =
        workbook.Sheets[
          workbook.SheetNames[0]
        ];

      const rows =
        XLSX.utils.sheet_to_json(
          sheet,
          {defval:""}
        );

      const imported =
        rows.map(row=>{

          const unitRaw =
            String(
              row["有效期单位"] || "天"
            ).trim();

          let validityUnit = "day";

          if(
            unitRaw.includes("永久")
          ){

            validityUnit = "permanent";

          }else if(
            unitRaw.includes("年")
          ){

            validityUnit = "year";

          }else if(
            unitRaw.includes("月")
          ){

            validityUnit = "month";

          }else{

            validityUnit = "day";

          }


          return {

            id:
              Date.now().toString() +
              Math.random()
                .toString(36)
                .slice(2),

            institution:
              String(
                row["机构名称"] || ""
              ),

            packageName:
              String(
                row["套餐名称"] || ""
              ),

            price:
              Number(row["套餐价格"]) || 0,

            lessons:
              Number(row["课时数量"]) || 0,

            minutes:
              Number(row["每节课时长"]) || 60,

            validityValue:
              validityUnit === "permanent"
                ? null
                : (
                    Number(
                      row["有效期数值"]
                    ) || 0
                  ),

            validityUnit,

            district:
              String(
                row["区域"] || ""
              ),

            metroStation:
              String(
                row["最近地铁站"] || ""
              ),

            homeDistance:
              Number(
                row["距家距离(km)"]
              ) || 0,

            workDistance:
              Number(
                row["距公司距离(km)"]
              ) || 0,

            homeTime:
              parseTimeString(
                row["到家时间"]
              ),

            workTime:
              parseTimeString(
                row["到公司时间"]
              ),

            createdAt:
              Date.now()

          };

        })
        .filter(
          x =>
            x.institution ||
            x.packageName
        );


      packages =
        packages.concat(imported);

      saveData();

      renderAll();

      toast(
        `成功导入 ${imported.length} 个套餐`
      );

    }catch(err){

      console.error(err);

      alert(
        "Excel 导入失败，请检查文件格式。"
      );

    }

  };

  reader.readAsArrayBuffer(file);

  event.target.value = "";

}


/* =========================================================
   时间字符串解析
========================================================= */

function parseTimeString(value){

  if(!value) return null;

  const str =
    String(value).trim();

  const match =
    str.match(
      /^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/
    );

  if(!match){
    return null;
  }

  return {

    hours:
      Number(match[1]) || 0,

    minutes:
      Number(match[2]) || 0,

    seconds:
      Number(match[3]) || 0

  };

}

/* =========================================================
   工具
========================================================= */

function dateString(){

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("");

}


let toastTimer;

function toast(message){

  const el =
    $("toast");

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      el.classList.remove("show");
    },2200);

}
