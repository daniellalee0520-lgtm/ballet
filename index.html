<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f8f4f2;
  --card:#fffdfc;
  --text:#302c2d;
  --muted:#8f8586;
  --border:#e9dfdd;

  --pink:#c98f9f;
  --pink-dark:#a96f7c;
  --pink-light:#f5e5e9;
  --pink-soft:#fbf1f3;

  --lavender:#a69bbd;
  --lavender-light:#eeeaf5;

  --green:#738d79;
  --green-light:#eaf1eb;

  --danger:#b86c70;
  --danger-light:#f8e9ea;

  --shadow:0 5px 20px rgba(70,45,50,.055);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1180px,calc(100% - 28px));
  margin:0 auto;
}

/* =========================================
   HEADER
========================================= */

.header{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(201,143,159,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 5% 100%,
      rgba(166,155,189,.16),
      transparent 35%
    ),
    #fffaf8;

  border-bottom:1px solid var(--border);
}

.header-inner{
  position:relative;
  padding:27px 0 23px;
}

.header-kicker{
  color:var(--pink);
  font-size:10px;
  letter-spacing:2.2px;
  font-weight:700;
  margin-bottom:7px;
}

.header h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.6px;
}

.header-sub{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.ballet-mark{
  position:absolute;
  right:5px;
  top:14px;
  font-size:54px;
  opacity:.13;
  transform:rotate(-7deg);
}

/* =========================================
   MAIN
========================================= */

main{
  padding:18px 0 50px;
}

.section{
  margin-bottom:17px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.section-title h2{
  margin:0;
  font-size:15px;
}

.section-title small{
  color:var(--muted);
  font-size:11px;
}

/* =========================================
   SUMMARY
========================================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px 10px;
  box-shadow:var(--shadow);
}

.summary-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.summary-value{
  font-size:21px;
  font-weight:700;
  line-height:1.1;
}

.summary-note{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

/* =========================================
   TOOLBAR
========================================= */

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:180px;
}

input,
select{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:9px 10px;
  outline:none;
  color:var(--text);
}

input:focus,
select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(201,143,159,.09);
}

/* =========================================
   BUTTON
========================================= */

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
  transition:.15s;
}

.btn:active{
  transform:scale(.97);
}

.btn-primary{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.btn-soft{
  background:var(--pink-soft);
  border-color:#efd7dc;
  color:#99636e;
}

.btn-lavender{
  background:var(--lavender-light);
  border-color:#ddd5e9;
  color:#746a88;
}

.btn-danger{
  color:var(--danger);
  background:var(--danger-light);
  border-color:#efd4d5;
}

/* =========================================
   NEW PACKAGE FORM
========================================= */

.form-panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.form-toggle{
  width:100%;
  border:0;
  background:transparent;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--text);
}

.form-toggle-left{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:600;
  font-size:13px;
}

.plus{
  width:25px;
  height:25px;
  border-radius:8px;
  background:var(--pink-light);
  color:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.form-arrow{
  color:var(--muted);
  transition:.2s;
}

.form-panel.open .form-arrow{
  transform:rotate(180deg);
}

.form-body{
  display:none;
  padding:0 14px 15px;
  border-top:1px solid var(--border);
}

.form-panel.open .form-body{
  display:block;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding-top:13px;
}

.field label{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-bottom:5px;
}

.field.full,
.field.wide{
  grid-column:span 2;
}

.form-actions{
  display:flex;
  gap:7px;
  justify-content:flex-end;
  margin-top:13px;
}

/* validity */

.validity-row{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:7px;
}

.permanent-check{
  margin-top:6px;
  display:flex !important;
  align-items:center;
  gap:5px;
  font-size:10px !important;
}

.permanent-check input{
  width:auto;
}

/* =========================================
   CUSTOM TIME PICKER
========================================= */

.time-input{
  position:relative;
  width:100%;
}

.time-display{
  width:100%;
  min-height:38px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:9px 10px;
  color:var(--text);
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.time-display.placeholder{
  color:#aaa;
}

.time-display::after{
  content:"⌄";
  color:var(--muted);
  font-size:12px;
}

/* popup */

.time-picker-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(45,35,38,.25);
  backdrop-filter:blur(3px);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.time-picker-overlay.show{
  display:flex;
}

.time-picker-sheet{
  width:min(520px,100%);
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:12px 15px 25px;
  box-shadow:0 -8px 35px rgba(40,25,30,.15);
  animation:sheetUp .2s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.time-picker-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.time-picker-title{
  font-size:15px;
  font-weight:600;
}

.time-picker-done{
  border:0;
  background:var(--pink);
  color:#fff;
  border-radius:9px;
  padding:6px 12px;
  font-size:12px;
}

.wheel-area{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  height:210px;
  overflow:hidden;
}

.wheel-column{
  position:relative;
  height:210px;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding:84px 0;
}

.wheel-column::-webkit-scrollbar{
  display:none;
}

.wheel-item{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:center;
  font-size:25px;
  color:#bcbcbc;
  transition:.12s;
  user-select:none;
}

.wheel-item.selected{
  color:#333;
  font-weight:600;
  transform:scale(1.02);
}

.wheel-highlight{
  position:absolute;
  pointer-events:none;
  left:0;
  right:0;
  top:84px;
  height:42px;
  border-radius:25px;
  background:#f3f3f3;
}

.wheel-unit{
  position:absolute;
  top:98px;
  font-size:11px;
  color:#999;
  pointer-events:none;
}

.wheel-unit.hour{
  left:calc(25% + 17px);
}

.wheel-unit.minute{
  right:calc(25% + 13px);
}

/* =========================================
   CHART CARD
========================================= */

.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:14px;
}

.chart-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}

.chart-header h3{
  margin:0;
  font-size:14px;
}

.chart-header p{
  margin:4px 0 0;
  font-size:10px;
  color:var(--muted);
}

/* =========================================
   PRICE COMPARISON
   不再使用长进度条
========================================= */

.price-list{
  display:grid;
  gap:7px;
}

.price-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;

  padding:10px 11px;

  background:#faf7f6;
  border-radius:10px;
}

.price-left{
  min-width:0;
}

.price-institution{
  color:var(--pink-dark);
  font-size:10px;
  font-weight:700;
  margin-bottom:2px;
}

.price-package{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price-right{
  text-align:right;
  white-space:nowrap;
}

.price-right strong{
  font-size:16px;
  color:#57474b;
}

.price-right span{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

/* =========================================
   COMMUTE
========================================= */

.commute-list{
  display:grid;
  gap:10px;
}

.commute-card{
  background:#faf7f6;
  border-radius:11px;
  padding:11px 12px;
}

.commute-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.commute-title{
  min-width:0;
}

.commute-institution{
  font-size:13px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.commute-location{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.location-decoration{
  color:var(--pink);
  font-size:11px;
}

.commute-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.commute-stat{
  position:relative;
  background:#fff;
  border:1px solid #eee4e2;
  border-radius:9px;
  padding:8px;
  overflow:hidden;
}

.commute-stat::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--pink);
}

.commute-stat.work::before{
  background:var(--lavender);
}

.commute-stat-label{
  font-size:9px;
  color:var(--muted);
}

.commute-stat-time{
  font-size:14px;
  font-weight:700;
  margin-top:3px;
}

.commute-bar{
  height:4px;
  background:#eee9e7;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}

.commute-bar-fill{
  height:100%;
  border-radius:10px;
  background:linear-gradient(
    90deg,
    #d3a6b0,
    var(--pink)
  );
}

.commute-stat.work .commute-bar-fill{
  background:linear-gradient(
    90deg,
    #c2b8d2,
    var(--lavender)
  );
}

/* =========================================
   PACKAGE LIST
========================================= */

.package-list{
  display:grid;
  gap:9px;
}

/*
  滑动结构：
  外层负责隐藏
  中间 content 可以向左移动
  右边 actions 被隐藏
*/

.package-swipe{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#fff;
}

.package-actions-reveal{
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  width:282px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  z-index:1;
}

.swipe-action{
  border:0;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.swipe-action-icon{
  font-size:19px;
  line-height:1;
}

.action-detail{
  background:#c18d9c;
}

.action-copy{
  background:#9f94b7;
}

.action-edit{
  background:#555255;
}

.action-delete{
  background:#d46d73;
}

.package-content{
  position:relative;
  z-index:2;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  transform:translateX(0);
  transition:transform .22s ease;
  touch-action:pan-y;
}

.package-swipe.revealed .package-content{
  transform:translateX(-282px);
}

.package-main{
  padding:13px 14px;
}

.package-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.package-title{
  min-width:0;
}

.institution{
  color:var(--pink);
  font-size:10px;
  font-weight:700;
  margin-bottom:3px;
}

.package-name{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-price{
  text-align:right;
  white-space:nowrap;
}

.package-price strong{
  font-size:17px;
}

.package-price span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

.package-metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:11px;
}

.metric{
  background:#faf6f5;
  border-radius:9px;
  padding:7px 8px;
}

.metric-label{
  font-size:9px;
  color:var(--muted);
}

.metric-value{
  margin-top:3px;
  font-size:12px;
  font-weight:700;
}

/* hint */

.swipe-hint{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  color:#b7acad;
  font-size:9px;
  margin-top:7px;
}

/* detail */

.detail{
  display:none;
  padding:12px 14px 14px;
  border-top:1px solid var(--border);
  background:#fffaf9;
}

.package-swipe.show-detail .detail{
  display:block;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.detail-item{
  background:#fff;
  border:1px solid #eee4e2;
  border-radius:9px;
  padding:8px;
}

.detail-item label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:3px;
}

.detail-item div{
  font-size:11px;
  font-weight:600;
}

/* =========================================
   EMPTY
========================================= */

.empty{
  padding:30px 18px;
  text-align:center;
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:13px;
  color:var(--muted);
  font-size:12px;
}

.empty-icon{
  font-size:29px;
  opacity:.4;
  margin-bottom:6px;
}

/* =========================================
   DATA
========================================= */

.data-tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.hidden-input{
  display:none;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:760px){

  .container{
    width:calc(100% - 20px);
  }

  .header-inner{
    padding:23px 0 19px;
  }

  .header h1{
    font-size:23px;
  }

  .ballet-mark{
    font-size:44px;
  }

  main{
    padding-top:14px;
  }

  .summary-grid{
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }

  .summary-card{
    padding:10px 8px;
    border-radius:11px;
  }

  .summary-label{
    font-size:9px;
    white-space:nowrap;
  }

  .summary-value{
    font-size:18px;
  }

  .summary-note{
    display:none;
  }

  .form-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .field.full,
  .field.wide{
    grid-column:span 2;
  }

  .detail-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:430px){

  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .search{
    grid-column:span 2;
  }

  .summary-value{
    font-size:17px;
  }

  .package-metrics{
    grid-template-columns:repeat(3,1fr);
  }

  .metric{
    padding:7px 5px;
  }

  .metric-value{
    font-size:11px;
  }

  .commute-stats{
    grid-template-columns:1fr 1fr;
  }

  .detail-grid{
    grid-template-columns:1fr 1fr;
  }

  .data-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .data-tools .btn:last-child{
    grid-column:span 2;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="container header-inner">

    <div class="header-kicker">
      BALLET STUDIO · PRICE BOOK
    </div>

    <h1>
      芭蕾机构价格对比
    </h1>

    <div class="header-sub">
      用每小时价格比较不同课时长度
    </div>

    <div class="ballet-mark">
      🩰
    </div>

  </div>

</header>


<main class="container">

  <!-- =====================================
       价格总览
  ====================================== -->

  <section class="section">

    <div class="section-title">
      <h2>价格总览</h2>
      <small id="packageCountText">0 个套餐</small>
    </div>

    <div class="summary-grid">

      <div class="summary-card">

        <div class="summary-label">
          机构数量
        </div>

        <div
          class="summary-value"
          id="institutionCount"
        >
          0
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          最低每小时
        </div>

        <div
          class="summary-value"
          id="lowestHourly"
        >
          —
        </div>

      </div>


      <div class="summary-card">

        <div class="summary-label">
          最高每小时
        </div>

        <div
          class="summary-value"
          id="highestHourly"
        >
          —
        </div>

      </div>

    </div>

  </section>


  <!-- =====================================
       搜索
  ====================================== -->

  <section class="section">

    <div class="toolbar">

      <div class="search">

        <input
          id="searchInput"
          type="search"
          placeholder="搜索机构或套餐名称"
        >

      </div>


      <select id="sortSelect">

        <option value="hourlyAsc">
          每小时价格：低 → 高
        </option>

        <option value="hourlyDesc">
          每小时价格：高 → 低
        </option>

        <option value="priceAsc">
          套餐总价：低 → 高
        </option>

        <option value="priceDesc">
          套餐总价：高 → 低
        </option>

        <option value="institution">
          按机构名称
        </option>

      </select>

    </div>

  </section>


  <!-- =====================================
       新建
  ====================================== -->

  <section class="section">

    <div
      class="form-panel"
      id="formPanel"
    >

      <button
        class="form-toggle"
        id="formToggle"
      >

        <span class="form-toggle-left">

          <span class="plus">
            ＋
          </span>

          <span id="formToggleText">
            新建套餐
          </span>

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "ballet_price_database_v4";

let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

let editingId = null;


/* =====================================================
   DOM
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   TIME PICKER STATE
===================================================== */

let activeTimeType = null;

let tempHour = null;
let tempMinute = null;


/* =====================================================
   基础函数
===================================================== */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function money(value){

  if(
    value === "" ||
    value == null ||
    isNaN(value)
  ){
    return "—";
  }

  return "¥" +
    Number(value).toLocaleString(
      "zh-CN",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* =====================================================
   每小时价格
===================================================== */

function getHourlyPrice(item){

  const price =
    Number(item.price);

  const lessons =
    Number(item.lessons);

  const minutes =
    Number(item.minutes);

  if(
    !price ||
    !lessons ||
    !minutes ||
    minutes <= 0
  ){
    return null;
  }

  const totalHours =
    lessons *
    minutes /
    60;

  return price /
    totalHours;

}


/* =====================================================
   时间格式
===================================================== */

function formatDuration(hour,minute){

  const hasHour =
    hour !== "" &&
    hour !== null &&
    hour !== undefined;

  const hasMinute =
    minute !== "" &&
    minute !== null &&
    minute !== undefined;

  const h =
    hasHour
      ? Number(hour)
      : 0;

  const m =
    hasMinute
      ? Number(minute)
      : 0;

  if(
    !hasHour &&
    !hasMinute
  ){
    return "—";
  }

  if(
    h === 0 &&
    m === 0 &&
    !hasHour
  ){
    return "—";
  }

  if(h > 0 && m > 0){
    return `${h}小时${String(m).padStart(2,"0")}分钟`;
  }

  if(h > 0){
    return `${h}小时`;
  }

  return `${m}分钟`;

}


/* =====================================================
   时间总分钟
===================================================== */

function getTimeMinutes(hour,minute){

  const h =
    hour === "" ||
    hour == null
      ? 0
      : Number(hour);

  const m =
    minute === "" ||
    minute == null
      ? 0
      : Number(minute);

  if(
    hour === "" &&
    minute === ""
  ){
    return null;
  }

  return h * 60 + m;

}


/* =====================================================
   时间显示
===================================================== */

function updateTimeDisplay(type){

  const hour =
    type === "home"
      ? $("homeTimeHour")
      : $("workTimeHour");

  const minute =
    type === "home"
      ? $("homeTimeMinute")
      : $("workTimeMinute");

  const display =
    type === "home"
      ? $("homeTimeDisplay")
      : $("workTimeDisplay");

  const h =
    hour.value;

  const m =
    minute.value;

  if(
    h === "" &&
    m === ""
  ){

    display.textContent =
      "请选择时间";

    display.classList.add(
      "placeholder"
    );

    return;

  }

  display.textContent =
    formatDuration(h,m);

  display.classList.remove(
    "placeholder"
  );

}


/* =====================================================
   初始化时间状态
===================================================== */

function createTimeInputs(){

  $("homeTimeHour") = null;
}


/* =====================================================
   我们不再使用原来的 select
   使用隐藏状态保存时间
===================================================== */

function ensureHiddenTimeInputs(){

  if(!$("homeTimeHour")){

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.id = "homeTimeHour";

    document.body.appendChild(input);

  }

  if(!$("homeTimeMinute")){

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.id = "homeTimeMinute";

    document.body.appendChild(input);

  }

  if(!$("workTimeHour")){

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.id = "workTimeHour";

    document.body.appendChild(input);

  }

  if(!$("workTimeMinute")){

    const input =
      document.createElement("input");

    input.type = "hidden";
    input.id = "workTimeMinute";

    document.body.appendChild(input);

  }

}

ensureHiddenTimeInputs();


/* =====================================================
   创建滚轮
===================================================== */

function buildWheel(){

  const hourWheel =
    $("hourWheel");

  const minuteWheel =
    $("minuteWheel");


  /*
    第一个空白选项非常重要：
    允许用户只选择“30分钟”
    而不选择小时。
  */

  hourWheel.innerHTML =
    `<div
      class="wheel-item"
      data-value=""
    >
      —
    </div>`;


  for(let i=0;i<=12;i++){

    hourWheel.insertAdjacentHTML(
      "beforeend",

      `<div
        class="wheel-item"
        data-value="${i}"
      >
        ${i}
      </div>`
    );

  }


  minuteWheel.innerHTML =
    `<div
      class="wheel-item"
      data-value=""
    >
      —
    </div>`;


  /*
    按5分钟为一个选择单位，
    和你截图里的滚动方式类似。
  */

  for(let i=0;i<60;i+=5){

    minuteWheel.insertAdjacentHTML(
      "beforeend",

      `<div
        class="wheel-item"
        data-value="${i}"
      >
        ${String(i).padStart(2,"0")}
      </div>`
    );

  }


  setupWheel(hourWheel,"hour");

  setupWheel(minuteWheel,"minute");

}


function setupWheel(wheel,type){

  wheel.addEventListener(
    "scroll",
    () => {

      clearTimeout(
        wheel._scrollTimer
      );

      wheel._scrollTimer =
        setTimeout(
          () => {

            const center =
              wheel.scrollTop +
              wheel.clientHeight / 2;

            const items =
              [...wheel.querySelectorAll(
                ".wheel-item"
              )];

            let closest =
              null;

            let min =
              Infinity;

            items.forEach(item => {

              const itemCenter =
                item.offsetTop +
                item.offsetHeight / 2;

              const distance =
                Math.abs(
                  itemCenter -
                  center
                );

              if(distance < min){

                min = distance;
                closest = item;

              }

            });


            if(closest){

              items.forEach(
                x =>
                  x.classList.remove(
                    "selected"
                  )
              );

              closest.classList.add(
                "selected"
              );

              if(type === "hour"){

                tempHour =
                  closest.dataset.value;

              }else{

                tempMinute =
                  closest.dataset.value;

              }

            }

          },
          80
        );

    }
  );

}


/* =====================================================
   滚动到指定值
===================================================== */

function scrollWheelTo(
  wheelId,
  value
){

  const wheel =
    $(wheelId);

  const items =
    [...wheel.querySelectorAll(
      ".wheel-item"
    )];

  let target =
    items.find(
      item =>
        item.dataset.value ===
        String(value ?? "")
    );

  if(!target){

    target =
      items[0];

  }

  const top =
    target.offsetTop -
    (
      wheel.clientHeight -
      target.offsetHeight
    ) / 2;

  wheel.scrollTop =
    Math.max(0,top);

  items.forEach(
    x =>
      x.classList.remove(
        "selected"
      )
  );

  target.classList.add(
    "selected"
  );

}


/* =====================================================
   打开时间滚轮
===================================================== */

function openTimePicker(type){

  activeTimeType =
    type;

  const hourInput =
    type === "home"
      ? $("homeTimeHour")
      : $("workTimeHour");

  const minuteInput =
    type === "home"
      ? $("homeTimeMinute")
      : $("workTimeMinute");


  tempHour =
    hourInput.value || "";

  tempMinute =
    minuteInput.value || "";


  $("timePickerOverlay")
    .classList.add("show");


  requestAnimationFrame(
    () => {

      scrollWheelTo(
        "hourWheel",
        tempHour
      );

      scrollWheelTo(
        "minuteWheel",
        tempMinute
      );

    }
  );

}


/* =====================================================
   时间选择完成
===================================================== */

$("timePickerDone")
.addEventListener(
  "click",
  () => {

    if(!activeTimeType){
      return;
    }


    const hourInput =
      activeTimeType === "home"
        ? $("homeTimeHour")
        : $("workTimeHour");

    const minuteInput =
      activeTimeType === "home"
        ? $("homeTimeMinute")
        : $("workTimeMinute");


    hourInput.value =
      tempHour ?? "";

    minuteInput.value =
      tempMinute ?? "";


    updateTimeDisplay(
      activeTimeType
    );


    $("timePickerOverlay")
      .classList.remove("show");


    activeTimeType =
      null;

  }
);


/* 点击背景关闭 */

$("timePickerOverlay")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("timePickerOverlay")
    ){

      $("timePickerOverlay")
        .classList.remove("show");

      activeTimeType =
        null;

    }

  }
);


/* 打开 */

$("homeTimeInput")
.addEventListener(
  "click",
  () => openTimePicker("home")
);

$("workTimeInput")
.addEventListener(
  "click",
  () => openTimePicker("work")
);


buildWheel();


/* =====================================================
   表单
===================================================== */

function getFormData(){

    id:
      editingId || uid(),

      ),

    homeDistance:
      $("homeDistance").value === ""

        : Number(
            $("homeDistance").value
          ),

    workDistance:
      $("workDistance").value === ""
        ? ""
        : Number(
            $("workDistance").value
          ),

    homeTimeHour:
      $("homeTimeHour").value,

    homeTimeMinute:

    workTimeHour:
      $("workTimeHour").value,

    workTimeMinute:

  };

}

   填充表单
===================================================== */

function fillForm(item){

  $("price").value =
    item.price ?? "";

  $("lessons").value =

  $("workDistance").value =

  $("homeTimeMinute").value =

      getFormData();

      return;
    }


    if(!item.packageName){

      alert("请填写套餐名称");

      return;
    }


    if(
      !item.price ||
      item.price < 0
    ){

      alert("请填写正确的套餐价格");

      return;
    }


    if(
      !item.lessons ||
      item.lessons <= 0
    ){

      alert("请填写正确的课时数量");

      return;
    }


    if(
      !item.minutes ||
      item.minutes <= 0
    ){

      alert("请填写正确的每节课时长");

      return;
    }


    if(editingId){

      const index =
        data.findIndex(
          x =>
            x.id === editingId
        );

      if(index !== -1){

        data[index] =
          item;

      }

    }else{

      data.push(item);

    }


    saveData();

    resetForm();

    $("formPanel")

    renderAll();

);

  editingId =

function duplicateItem(id){

  const original =
    data.find(
      x => x.id === id
    );

  if(!original){
    return;

  const copy = {

    ...original,

    id:uid(),

    packageName:
      original.packageName
        ? original.packageName +
          "（复制）"
        : "复制套餐"

  };


  editingId =

/* =====================================================
   滑动操作
===================================================== */

function closeAllSwipeCards(exceptId){

  document
    .querySelectorAll(
      ".package-swipe.revealed"
    )
    .forEach(card => {

      if(
        !exceptId ||
        card.dataset.cardId !==
        exceptId
      ){

        card.classList.remove(
          "revealed"
        );

      }

    });

}


function setupSwipe(card){

  let startX = 0;
  let startY = 0;

  let currentX = 0;

  let touching = false;


  card.addEventListener(
    "touchstart",
    event => {

      const touch =
        event.touches[0];

      startX =
        touch.clientX;

      startY =
        touch.clientY;

      currentX =
        startX;

      touching =
        true;

    },
    {
      passive:true
    }
  );


  card.addEventListener(
    "touchmove",
    event => {

      if(!touching){
        return;
      }

      const touch =
        event.touches[0];

      currentX =
        touch.clientX;

      const dx =
        currentX - startX;

      const dy =
        touch.clientY - startY;


      /*
        如果明显是上下滚动，
        不处理横向滑动。
      */

      if(
        Math.abs(dy) >
        Math.abs(dx)
      ){

        return;

      }

    },
    {
      passive:true
    }
  );


  card.addEventListener(
    "touchend",
    () => {

      if(!touching){
        return;
      }

      touching =
        false;


      const dx =
        currentX - startX;


      /*
        向左滑：
        显示右边操作栏
      */

      if(dx < -45){

        closeAllSwipeCards(
          card.dataset.cardId
        );

        card.classList.add(
          "revealed"
        );

      }


      /*
        向右滑：
        收回操作栏
      */

      else if(dx > 45){

        card.classList.remove(
          "revealed"
        );

      }

    }
  );

}

/* =====================================================
   筛选
===================================================== */

function getFilteredData(){

  const keyword =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  let result =
    data.filter(item => {

      if(!keyword){
        return true;
      }

      return (

        String(
          item.institution || ""
        )
        .toLowerCase()
        .includes(keyword)

        ||

        String(
          item.packageName || ""
        )
        .toLowerCase()
        .includes(keyword)

      );

    });


  const sort =
    $("sortSelect").value;


  result.sort(
    (a,b) => {

      const ah =
        getHourlyPrice(a)
        ?? Infinity;

      const bh =
        getHourlyPrice(b)
        ?? Infinity;


      if(sort === "hourlyAsc"){
        return ah - bh;
      }


      if(sort === "hourlyDesc"){
        return bh - ah;
      }


      if(sort === "priceAsc"){
        return (
          Number(a.price) -
          Number(b.price)
        );
      }


      if(sort === "priceDesc"){
        return (
          Number(b.price) -
          Number(a.price)
        );
      }


      if(sort === "institution"){

        return String(
          a.institution
        ).localeCompare(
          String(b.institution),
          "zh-CN"
        );

      }


      return 0;

    }
  );


  return result;

}

/* =====================================================
   通勤概览
   同一家机构只显示一次
===================================================== */

function renderCommuteChart(){

  const container =
    $("commuteChart");


  /*
    机构级别去重。

    如果同一个机构有：
    10节套餐
    20节套餐
    30节套餐

    这里仍然只显示一次。

    位置和通勤信息取该机构
    第一个有完整信息的套餐。
  */

  const institutionMap =
    new Map();


  getFilteredData()
    .forEach(item => {

      const key =
        String(
          item.institution || ""
        ).trim();


      if(!key){
        return;
      }


      if(!institutionMap.has(key)){

        institutionMap.set(
          key,
          item
        );

        return;

      }


      /*
        如果之前那条没有地点/时间，
        后面的套餐有，就补进去。
      */

      const old =
        institutionMap.get(key);


      const merged = {

        ...old,

        district:
          old.district ||
          item.district,

        metroStation:
          old.metroStation ||
          item.metroStation,

        homeDistance:
          old.homeDistance !== ""
            ? old.homeDistance
            : item.homeDistance,

        workDistance:
          old.workDistance !== ""
            ? old.workDistance
            : item.workDistance,

        homeTimeHour:
          old.homeTimeHour !== ""
            ? old.homeTimeHour
            : item.homeTimeHour,

        homeTimeMinute:
          old.homeTimeMinute !== ""
            ? old.homeTimeMinute
            : item.homeTimeMinute,

        workTimeHour:
          old.workTimeHour !== ""
            ? old.workTimeHour
            : item.workTimeHour,

        workTimeMinute:
          old.workTimeMinute !== ""
            ? old.workTimeMinute
            : item.workTimeMinute

      };


      institutionMap.set(
        key,
        merged
      );

    });


  const list =
    [...institutionMap.values()]
      .filter(item => {

        return (

          item.homeTimeHour !== "" ||

          item.homeTimeMinute !== "" ||

          item.workTimeHour !== "" ||

          item.workTimeMinute !== ""

        );

      });


  if(!list.length){

    container.innerHTML =
      `<div class="empty">

        <div class="empty-icon">
          ✧
        </div>

        还没有填写通勤时间

      </div>`;

    return;

  }


  const allTimes =
    list.flatMap(
      item => [

        getTimeMinutes(
          item.homeTimeHour,
          item.homeTimeMinute
        ) || 0,

        getTimeMinutes(
          item.workTimeHour,
          item.workTimeMinute
        ) || 0

      ]
    );


  const maxTime =
    Math.max(
      ...allTimes,
      1
    );


  container.innerHTML =
    list.map(
      item => {

        const home =
          getTimeMinutes(
            item.homeTimeHour,
            item.homeTimeMinute
          );


        const work =
          getTimeMinutes(
            item.workTimeHour,
            item.workTimeMinute
          );


        const homeWidth =
          home
            ? Math.max(
                4,
                home /
                maxTime *
                100
              )
            : 0;


        const workWidth =
          work
            ? Math.max(
                4,
                work /
                maxTime *
                100
              )
            : 0;


        const locationParts =
          [];


        if(item.district){

          locationParts.push(
            escapeHtml(
              item.district
            )
          );

        }


        if(item.metroStation){

          locationParts.push(
            escapeHtml(
              item.metroStation
            )
          );

        }


        return `

          <div class="commute-card">

            <div class="commute-head">

              <div class="commute-title">

                <div class="commute-institution">

                  ${escapeHtml(
                    item.institution
                  )}

                </div>


                <div class="commute-location">

                  <span class="location-decoration">
                    ✧
                  </span>

                  ${
                    locationParts.length
                      ? locationParts.join(
                          " · "
                        )
                      : "未填写位置"
                  }

                </div>

              </div>

            </div>


            <div class="commute-stats">


              <div class="commute-stat">

                <div class="commute-stat-label">
                  回家
                </div>

                <div class="commute-stat-time">

                  ${
                    formatDuration(
                      item.homeTimeHour,
                      item.homeTimeMinute
                    )
                  }

                </div>

                <div class="commute-bar">

                  <div
                    class="commute-bar-fill"
                    style="width:${homeWidth}%"
                  ></div>

                </div>

              </div>


              <div class="commute-stat work">

                <div class="commute-stat-label">
                  去公司
                </div>

                <div class="commute-stat-time">

                  ${
                    formatDuration(
                      item.workTimeHour,
                      item.workTimeMinute
                    )
                  }

                </div>

                <div class="commute-bar">

                  <div
                    class="commute-bar-fill"
                    style="width:${workWidth}%"
                  ></div>

                </div>

              </div>


            </div>

          </div>

        `;

      }
    ).join("");

}

/* =====================================================
   有效期
===================================================== */

function validityText(item){

  if(item.permanent){
    return "永久有效";
  }


  if(
    item.validityValue === "" ||
    item.validityValue == null
  ){

    return "—";

  }


  const map = {

    year:"年",
    month:"月",
    day:"天"

  };


  return (
    item.validityValue +
    (
      map[
        item.validityUnit
      ] || ""
    )
  );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

$("importExcelBtn")
.addEventListener(
  "click",
  () => {

    $("excelInput").click();

  }
);


$("excelInput")
.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if(!file){
      return;
    }


    try{

      const buffer =
        await file.arrayBuffer();


      const workbook =
        XLSX.read(
          buffer,
          {
            type:"array"
          }
        );


      const sheet =
        workbook.Sheets[
          workbook.SheetNames[0]
        ];


      const rows =
        XLSX.utils.sheet_to_json(
          sheet
        );


      if(!rows.length){

        alert(
          "Excel里没有数据"
        );

        return;

      }


      const imported =
        rows.map(
          row => {

            let unit =
              row["有效期单位"];


            const permanent =
              unit === "永久";


            if(unit === "年"){
              unit = "year";
            }

            else if(unit === "月"){
              unit = "month";
            }

            else if(unit === "天"){
              unit = "day";
            }

            else if(
              unit !== "year" &&
              unit !== "month" &&
              unit !== "day"
            ){

              unit = "month";

            }


            return {

              id:uid(),

              institution:
                String(
                  row["机构名称"] ||
                  ""
                ),

              packageName:
                String(
                  row["套餐名称"] ||
                  ""
                ),

              price:
                Number(
                  row["套餐价格"] ||
                  0
                ),

              lessons:
                Number(
                  row["课时数量"] ||
                  0
                ),

              minutes:
                Number(
                  row["每节课时长"] ||
                  60
                ),

              validityValue:
                row["有效期数值"] ??
                "",

              validityUnit:
                unit,

              permanent,

              district:
                String(
                  row["区域"] ||
                  ""
                ),

              metroStation:
                String(
                  row["最近地铁站"] ||
                  ""
                ),

              homeDistance:
                row["距家距离(km)"] ??
                "",

              workDistance:
                row["距公司距离(km)"] ??
                "",

              homeTimeHour:
                row["到家小时"] ??
                "",

              homeTimeMinute:
                row["到家分钟"] ??
                "",

              workTimeHour:
                row["到公司小时"] ??
                "",

              workTimeMinute:
                row["到公司分钟"] ??
                ""

            };

          }
        );


      data =
        data.concat(
          imported
        );


      saveData();

      renderAll();


      alert(
        `成功导入 ${imported.length} 个套餐`
      );


    }catch(error){

      console.error(
        error
      );

      alert(
        "Excel导入失败，请检查文件格式"
      );

    }


    event.target.value =
      "";

  }
);


/* =====================================================
   JSON 导出
===================================================== */

$("exportJsonBtn")
.addEventListener(
  "click",
  () => {

    const blob =
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href =
      url;

    a.download =
      "芭蕾机构价格备份.json";


    a.click();


    URL.revokeObjectURL(
      url
    );

  }
);


/* =====================================================
   JSON 导入
===================================================== */

$("importJsonBtn")
.addEventListener(
  "click",
  () => {

    $("jsonInput").click();

  }
);


$("jsonInput")
.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files[0];


    if(!file){
      return;
    }


    try{

      const text =
        await file.text();


      const imported =
        JSON.parse(
          text
        );


      if(
        !Array.isArray(
          imported
        )
      ){

        throw new Error(
          "格式错误"
        );

      }


      if(
        !confirm(
          `确定用备份数据替换现在的 ${data.length} 条数据吗？`
        )
      ){

        return;

      }


      data =
        imported;


      saveData();

      renderAll();


      alert(
        "恢复成功"
      );


    }catch(error){

      alert(
        "JSON文件格式不正确"
      );

    }


    event.target.value =
      "";

  }
);


/* =====================================================
   删除全部
===================================================== */

$("clearAllBtn")
.addEventListener(
  "click",
  () => {

    if(!data.length){

      alert(
        "目前没有数据"
      );

      return;

    }


    if(
      !confirm(
        `确定删除全部 ${data.length} 个套餐吗？此操作不可恢复。`
      )
    ){

      return;

    }


    data = [];

    saveData();

    renderAll();

  }
);


/* =====================================================
   点击空白处关闭滑动卡片
===================================================== */

document.addEventListener(
  "touchstart",
  event => {

    const insideCard =
      event.target.closest(
        ".package-swipe"
      );


    if(!insideCard){

      closeAllSwipeCards();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   初始渲染
===================================================== */

function renderAll(){

  renderSummary();

  renderPriceChart();

  renderCommuteChart();

  renderPackages();

}


renderAll();

</script>

</body>
</html>
