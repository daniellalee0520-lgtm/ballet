<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f8f4f2;
  --card:#fffdfc;
  --text:#302c2d;
  --muted:#95898b;
  --border:#eadfdd;

  --pink:#c98f9f;
  --pink-dark:#b87588;
  --pink-light:#f5e5e9;
  --pink-soft:#fbf2f4;

  --lavender:#a79abb;
  --lavender-light:#eeeaf5;

  --cream:#f5eee6;

  --green:#78917e;
  --green-light:#eaf1eb;

  --danger:#bd7076;
  --danger-light:#f8e9ea;

  --shadow:0 8px 28px rgba(75,55,60,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 60px;
}

/* =========================
   HEADER
========================= */

.hero{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      #fffaf8 0%,
      #f9eff1 48%,
      #f0ebf6 100%
    );
  border:1px solid #eee3e1;
  border-radius:28px;
  padding:26px 25px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.hero:after{
  content:"";
  position:absolute;
  right:-30px;
  top:-55px;
  width:190px;
  height:190px;
  border:1px solid rgba(201,143,159,.18);
  border-radius:50%;
}

.hero-small{
  font-size:11px;
  letter-spacing:2px;
  color:var(--pink-dark);
  font-weight:700;
  margin-bottom:7px;
}

.hero h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.5px;
}

.hero p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}

.hero-mark{
  position:absolute;
  right:24px;
  bottom:15px;
  font-size:42px;
  opacity:.12;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:16px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 3px 10px;
}

.section-title h2{
  font-size:17px;
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   FORM
========================= */

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:17px;
}

.form-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.form-header strong{
  font-size:16px;
}

.close-form{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#f4eeee;
  color:#87787a;
  font-size:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--muted);
  font-size:11px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  height:40px;
  padding:0 11px;
  outline:none;
  color:var(--text);
}

.field input:focus,
.field select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(201,143,159,.10);
}

.validity-row{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:8px;
}

.time-picker{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.time-picker select{
  text-align:center;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.btn{
  min-height:40px;
  border-radius:13px;
  padding:0 15px;
  font-weight:600;
}

.btn-primary{
  flex:1;
  background:var(--pink);
  color:white;
}

.btn-secondary{
  background:#f2eceb;
  color:#74686a;
}

/* =========================
   SUMMARY
========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summary-card{
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:13px 12px;
  box-shadow:0 5px 20px rgba(75,55,60,.04);
}

.summary-label{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.summary-value{
  margin-top:5px;
  font-size:21px;
  font-weight:700;
  letter-spacing:-.4px;
}

.summary-card:nth-child(1) .summary-value{
  color:var(--pink-dark);
}

.summary-card:nth-child(2) .summary-value{
  color:var(--lavender);
}

.summary-card:nth-child(3) .summary-value{
  color:var(--green);
}

/* =========================
   FILTER
========================= */

.filter-bar{
  display:flex;
  gap:8px;
  margin-bottom:11px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:40px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  padding:0 13px;
  outline:none;
}

.filter-bar select{
  width:130px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  padding:0 9px;
  color:var(--text);
}

/* =========================
   CHART
========================= */

.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
}

.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.chart-header strong{
  font-size:15px;
}

.chart-header span{
  color:var(--muted);
  font-size:11px;
}

.price-chart{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.price-row{
  display:grid;
  grid-template-columns:125px 1fr;
  gap:9px;
  align-items:center;
}

.price-name{
  min-width:0;
}

.price-name strong{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price-name span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price-bar-area{
  min-width:0;
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
}

.price-track{
  flex:1;
  height:24px;
  background:#f5eeee;
  border-radius:8px;
  overflow:hidden;
  min-width:40px;
}

.price-bar{
  height:100%;
  border-radius:8px;
  background:
    linear-gradient(
      90deg,
      #d4a2af,
      #b88999
    );
  min-width:4px;
}

.price-number{
  width:65px;
  text-align:right;
  font-size:12px;
  font-weight:700;
  color:var(--pink-dark);
  flex:none;
}

.price-extra{
  grid-column:2;
  display:flex;
  gap:6px;
  margin-top:-5px;
  flex-wrap:wrap;
}

.price-tag{
  background:#f7f0ef;
  color:#817476;
  border-radius:8px;
  padding:3px 7px;
  font-size:10px;
}

/* =========================
   COMMUTE
========================= */

.commute-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
}

.commute-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.commute-item{
  border:1px solid #eee4e2;
  border-radius:17px;
  padding:12px;
  background:
    linear-gradient(
      135deg,
      #fffdfc,
      #fbf5f6
    );
}

.commute-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.commute-name{
  min-width:0;
}

.commute-name strong{
  font-size:14px;
}

.location-line{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.station{
  display:inline-flex;
  align-items:center;
  margin-left:5px;
  padding-left:7px;
  border-left:1px solid #ddd0cf;
}

.metro-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--lavender);
  margin-right:4px;
}

.commute-values{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.commute-box{
  background:#fff;
  border:1px solid #eee5e3;
  border-radius:13px;
  padding:9px 10px;
}

.commute-box-label{
  font-size:10px;
  color:var(--muted);
}

.commute-box-value{
  margin-top:3px;
  font-size:16px;
  font-weight:700;
}

.commute-box.home .commute-box-value{
  color:var(--pink-dark);
}

.commute-box.work .commute-box-value{
  color:var(--lavender);
}

.commute-bar{
  margin-top:9px;
  height:5px;
  background:#f0e9e8;
  border-radius:99px;
  overflow:hidden;
}

.commute-bar-fill{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#d4a3b0,#b9aecb);
}

/* =========================
   PACKAGE LIST
========================= */

.package-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.package-shell{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#eee7e6;
}

.package-actions{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:184px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
}

.swipe-action{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:white;
  font-size:10px;
  font-weight:600;
}

.swipe-action .action-icon{
  font-size:19px;
}

.copy-action{
  background:#8ea7bc;
}

.edit-action{
  background:#4d4b4d;
}

.delete-action{
  background:#c8757b;
}

.package-card{
  position:relative;
  z-index:2;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  min-height:96px;
  padding:11px 13px;
  box-shadow:0 4px 16px rgba(75,55,60,.045);

  transform:translateX(0);
  transition:transform .22s ease;
  touch-action:pan-y;
}

.package-card.open{
  transform:translateX(-184px);
}

.package-main{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) auto auto;
  align-items:center;
  gap:12px;
}

.package-title{
  min-width:0;
}

.package-title strong{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-title span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-price{
  text-align:right;
}

.package-price strong{
  display:block;
  color:var(--pink-dark);
  font-size:17px;
}

.package-price span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.package-lessons{
  text-align:right;
  min-width:58px;
}

.package-lessons strong{
  display:block;
  font-size:15px;
}

.package-lessons span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.package-bottom{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.mini-tag{
  border-radius:7px;
  padding:3px 7px;
  font-size:9px;
  color:#796d6f;
  background:#f6eeee;
}

.mini-tag.valid{
  background:var(--lavender-light);
  color:#776b8e;
}

.mini-tag.location{
  background:var(--cream);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
  font-size:13px;
}

/* =========================
   DATA MANAGEMENT
========================= */

.data-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
}

.data-buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.data-btn{
  min-width:0;
  min-height:66px;
  border-radius:17px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#665b5d;
  border:1px solid rgba(0,0,0,.035);
}

.data-btn .icon{
  font-size:20px;
}

.data-btn span{
  font-size:10px;
  white-space:nowrap;
}

.data-btn:nth-child(1){
  background:#f5e5e9;
}

.data-btn:nth-child(2){
  background:#eeeaf5;
}

.data-btn:nth-child(3){
  background:#eaf1eb;
}

.data-btn:nth-child(4){
  background:#f5eee6;
}

.data-btn:nth-child(5){
  background:#f5e9ea;
  color:#a5676d;
}

/* =========================
   MODAL
========================= */

.modal-mask{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(45,37,40,.35);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal-mask.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fffdfc;
  border-radius:27px 27px 18px 18px;
  padding:18px;
  box-shadow:0 20px 60px rgba(40,30,35,.20);
  animation:modalUp .22s ease;
}

@keyframes modalUp{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.modal-header strong{
  font-size:18px;
}

.modal-close{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#f3eceb;
  color:#796d6f;
  font-size:18px;
}

.detail-modal{
  padding-bottom:22px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.detail-item{
  background:#f9f4f3;
  border-radius:13px;
  padding:10px;
}

.detail-item.full{
  grid-column:1/-1;
}

.detail-item label{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.detail-item strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:2000;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  background:#3e3739;
  color:white;
  border-radius:12px;
  padding:10px 15px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

  .app{
    padding:10px 10px 45px;
  }

  .hero{
    border-radius:22px;
    padding:21px 18px;
  }

  .hero h1{
    font-size:23px;
  }

  .summary-grid{
    gap:7px;
  }

  .summary-card{
    padding:11px 8px;
    border-radius:15px;
  }

  .summary-value{
    font-size:18px;
  }

  .summary-label{
    font-size:10px;
  }

  .price-row{
    grid-template-columns:105px 1fr;
  }

  .price-number{
    width:56px;
    font-size:11px;
  }

  .package-main{
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:8px;
  }

  .package-price strong{
    font-size:15px;
  }

  .package-lessons{
    min-width:45px;
  }

  .data-buttons{
    gap:5px;
  }

  .data-btn{
    min-height:62px;
    border-radius:14px;
  }

  .data-btn .icon{
    font-size:18px;
  }

  .data-btn span{
    font-size:9px;
  }
}

@media(max-width:420px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .data-btn span{
    font-size:8px;
  }

  .data-btn{
    min-height:59px;
  }

  .price-row{
    grid-template-columns:92px 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <section class="hero">
    <div class="hero-small">BALLET STUDIO · PRICE BOOK</div>
    <h1>芭蕾机构价格对比</h1>
    <p>把不同机构、不同套餐放在一起，用相同课时长度比较真实成本。</p>
    <div class="hero-mark">🩰</div>
  </section>

  <!-- NEW PACKAGE -->
  <section class="section">
    <div class="section-title">
      <h2>套餐</h2>
      <span id="packageCount">0 个套餐</span>
    </div>

    <div id="packageList" class="package-list"></div>
  </section>

  <!-- SUMMARY -->
  <section class="section">
    <div class="section-title">
      <h2>价格总览</h2>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">套餐数量</div>
        <div class="summary-value" id="summaryPackages">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">机构数量</div>
        <div class="summary-value" id="summaryInstitutions">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">最低每60分钟</div>
        <div class="summary-value" id="summaryMinPrice">—</div>
      </div>
    </div>
  </section>

  <!-- FILTER -->
  <section class="section">
    <div class="filter-bar">
      <div class="search">
        <input id="searchInput" placeholder="搜索机构 / 套餐">
      </div>

      <select id="sortSelect">
        <option value="price">价格从低到高</option>
        <option value="priceDesc">价格从高到低</option>
        <option value="name">机构名称</option>
      </select>
    </div>
  </section>

  <!-- PRICE CHART -->
  <section class="section">
    <div class="section-title">
      <h2>价格比较</h2>
      <span>每60分钟实际成本</span>
    </div>

    <div class="chart-card">
      <div id="priceChart" class="price-chart"></div>
    </div>
  </section>

  <!-- COMMUTE -->
  <section class="section">
    <div class="section-title">
      <h2>通勤概览</h2>
      <span>每家机构仅显示一次</span>
    </div>

    <div class="commute-card">
      <div id="commuteList" class="commute-list"></div>
    </div>
  </section>

  <!-- DATA -->
  <section class="section">
    <div class="section-title">
      <h2>数据管理</h2>
    </div>

    <div class="data-card">
      <div class="data-buttons">

        <button class="data-btn" onclick="openEditor()">
          <div class="icon">🩰</div>
          <span>新建套餐</span>
        </button>

        <button class="data-btn" onclick="exportExcel()">
          <div class="icon">🎀</div>
          <span>导出 Excel</span>
        </button>

        <button class="data-btn" onclick="document.getElementById('excelInput').click()">
          <div class="icon">🌸</div>
          <span>导入 Excel</span>
        </button>

        <button class="data-btn" onclick="exportJSON()">
          <div class="icon">🎼</div>
          <span>备份数据</span>
        </button>

        <button class="data-btn" onclick="clearAll()">
          <div class="icon">🩷</div>
          <span>清空数据</span>
        </button>

      </div>

      <input
        type="file"
        id="excelInput"

<script>

const STORAGE_KEY = "ballet_price_database_v3";

let data = loadData();
let editingId = null;
let activeCardId = null;


/* =========================
   BASIC
========================= */

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw) return [];

    const parsed = JSON.parse(raw);

    if(!Array.isArray(parsed)) return [];

    return parsed.map(normalizeItem);

  }catch(e){
    console.error(e);
    return [];
  }
}

function saveData(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function normalizeItem(item){

  return {
    id:item.id || uid(),

    institution:item.institution || "",
    packageName:item.packageName || "",

    price:num(item.price),
    lessons:num(item.lessons),
    minutes:num(item.minutes) || 60,

    validityValue:item.validityValue === undefined
      ? ""
      : item.validityValue,

    validityUnit:item.validityUnit || "month",

    district:item.district || "",
    metroStation:item.metroStation || "",

    homeDistance:num(item.homeDistance),
    workDistance:num(item.workDistance),

    homeTime:parseTimeValue(item.homeTime),
    workTime:parseTimeValue(item.workTime)
  };
}

function num(v){
  if(v === null || v === undefined || v === "") return 0;

  const n = parseFloat(
    String(v).replace(/[^\d.-]/g,"")
  );

  return Number.isFinite(n) ? n : 0;
}


/* =========================
   PRICE
========================= */

/*
  核心价格：

  每节课多少钱：
  总价 ÷ 课时数量

  每60分钟多少钱：
  总价 ÷ (课时数量 × 每节分钟) × 60

  所以：
  60分钟课 = 正常每节价格
  90分钟课 = 每节价格 × 60 ÷ 90
*/

function price60(item){

  if(
    !item.lessons ||
    !item.minutes ||
    !item.price
  ){
    return 0;
  }

  return (
    item.price /
    (item.lessons * item.minutes)
  ) * 60;
}

function lessonPrice(item){

  if(!item.lessons) return 0;

  return item.price / item.lessons;
}


/* =========================
   VALIDITY
========================= */

function validityMonths(item){

  if(item.validityUnit === "permanent"){
    return Infinity;
  }

  const value = num(item.validityValue);

  if(!value) return 0;

  if(item.validityUnit === "year"){
    return value * 12;
  }

  if(item.validityUnit === "day"){
    return value / 30;
  }

  return value;
}

function validityText(item){

  if(item.validityUnit === "permanent"){
    return "永久有效";
  }

  const value = num(item.validityValue);

  if(!value){
    return "未设置有效期";
  }

  if(item.validityUnit === "day"){

    const months = value / 30;

    return months.toFixed(1) + "个月";
  }

  if(item.validityUnit === "year"){

    return trimDecimal(value) + "年";
  }

  return trimDecimal(value) + "个月";
}

function trimDecimal(n){

  const x = Number(n);

  if(Number.isInteger(x)){
    return String(x);
  }

  return x.toFixed(1);
}


/* =========================
   TIME
========================= */

function populateMinuteSelect(id){

  const select = document.getElementById(id);

  select.innerHTML = "";

  for(let i=0;i<60;i++){

    const option = document.createElement("option");

    option.value = i;
    option.textContent =
      String(i).padStart(2,"0") + " 分钟";

    select.appendChild(option);
  }
}

populateMinuteSelect("fHomeMinute");
populateMinuteSelect("fWorkMinute");


function timeToParts(total){

  total = parseTimeValue(total);

  if(!total){
    return {
      hour:0,
      minute:0
    };
  }

  return {
    hour:Math.floor(total / 60),
    minute:total % 60
  };
}


/*
  兼容以前各种 Excel / 本地数据：

  65
  "65"
  "65分钟"
  "1小时05分钟"
  "1小时 5分钟"
  "1h 5min"
  "1:05"
*/
function parseTimeValue(value){

  if(value === null || value === undefined || value === ""){
    return 0;
  }

  if(typeof value === "number"){
    return Math.max(
      0,
      Math.round(value)
    );
  }

  let s = String(value)
    .trim()
    .toLowerCase();

  if(!s){
    return 0;
  }

  // Excel 时间格式，例如 1:05
  if(/^\d+\s*:\s*\d+$/.test(s)){

    const parts = s.split(":");

    const h = parseInt(parts[0],10) || 0;
    const m = parseInt(parts[1],10) || 0;

    return h * 60 + m;
  }

  let hours = 0;
  let minutes = 0;

  const hMatch = s.match(
    /(\d+(?:\.\d+)?)\s*(?:小时|小時|h|hr|hrs)/
  );

  if(hMatch){
    hours = parseFloat(hMatch[1]) || 0;
  }

  const mMatch = s.match(
    /(\d+(?:\.\d+)?)\s*(?:分钟|分鐘|min|mins|m)/
  );

  if(mMatch){
    minutes = parseFloat(mMatch[1]) || 0;
  }

  if(hMatch || mMatch){
    return Math.round(
      hours * 60 + minutes
    );
  }

  const pure = parseFloat(
    s.replace(/[^\d.-]/g,"")
  );

  if(Number.isFinite(pure)){
    return Math.round(pure);
  }

  return 0;
}

function formatTime(total){

  total = parseTimeValue(total);

  if(total <= 0){
    return "未设置";
  }

  const h = Math.floor(total / 60);
  const m = total % 60;

  if(h && m){
    return `${h}小时${String(m).padStart(2,"0")}分钟`;
  }

  if(h){
    return `${h}小时`;
  }

  return `${m}分钟`;
}

function openEditor(item=null){

  document.getElementById("fDistrict").value =
    item?.district || "";

    item?.metroStation || "";

  document.getElementById("fHomeDistance").value =
    item?.homeDistance || "";

  document.getElementById("fWorkDistance").value =
    item?.workDistance || "";

  const home = timeToParts(
    item?.homeTime || 0
  );

  const work = timeToParts(
    item?.workTime || 0

  document.getElementById("fHomeHour").value =
    Math.min(home.hour,6);

  document.getElementById("fHomeMinute").value =

    Math.min(work.hour,6);

  document
    .getElementById("editorMask")
    .classList.add("show");

  setTimeout(()=>{
    document
      .getElementById("fInstitution")
      .focus();
  },100);
}

    .getElementById("editorMask")

  editingId = null;
}

    closeEditor();

function saveEditor(){

  const institution =
    document.getElementById("fInstitution").value.trim();

  const packageName =
    document.getElementById("fPackage").value.trim();

  const price =
    num(document.getElementById("fPrice").value);

  const lessons =
    num(document.getElementById("fLessons").value);

  const minutes =
    num(document.getElementById("fMinutes").value);

  if(!institution){
    toast("请填写机构名称");
    return;
  }

  if(!packageName){
    toast("请填写套餐名称");
    return;
  }

  if(!price){
    toast("请填写套餐价格");
    return;
  }

  if(!lessons){
    toast("请填写课时数量");
    return;
  }

  if(!minutes){
    toast("请填写每节课时长");
    return;
  }

  const validityUnit =
    document.getElementById("fValidityUnit").value;

  const validityValue =
    validityUnit === "permanent"
      ? ""
      : num(
          document.getElementById("fValidityValue").value
        );

  const homeHour =
    parseInt(
      document.getElementById("fHomeHour").value,
      10
    ) || 0;

  const homeMinute =
    parseInt(
      document.getElementById("fHomeMinute").value,
      10
    ) || 0;

  const workHour =
    parseInt(
      document.getElementById("fWorkHour").value,
      10
    ) || 0;

  const workMinute =
    parseInt(
      document.getElementById("fWorkMinute").value,
      10
    ) || 0;

  const item = {

    id:editingId || uid(),

    institution,

    packageName,

    price,

    lessons,

    minutes,

    validityValue,

    validityUnit,

    district:
      document.getElementById("fDistrict").value.trim(),

    metroStation:
      document.getElementById("fMetro").value.trim(),

    homeDistance:
      num(document.getElementById("fHomeDistance").value),

    workDistance:
      num(document.getElementById("fWorkDistance").value),

    homeTime:
      homeHour * 60 + homeMinute,

    workTime:
      workHour * 60 + workMinute
  };

  if(editingId){

    const index =
      data.findIndex(x=>x.id === editingId);

    if(index !== -1){
      data[index] = item;
    }

    toast("套餐已更新");

  }else{

    data.unshift(item);

    toast("套餐已添加");
  }

  saveData();
  closeEditor();
  render();
}


/* =========================

    packageName:

function deleteItem(id){

  if(!item) return;

  if(
    !confirm(
      `确定删除「${item.packageName}」吗？`
    )
  ){
    return;
  }

  data =
    data.filter(x=>x.id !== id);

  saveData();

  render();

  toast("已删除");
}

/* =========================
   SWIPE
========================= */

let swipeState = {
  card:null,
  startX:0,
  startY:0,
  currentX:0,
  moving:false
};

function swipeStart(e){

  const touch = e.touches[0];

  const card =
    e.currentTarget;

  swipeState = {
    card,
    startX:touch.clientX,
    startY:touch.clientY,
    currentX:touch.clientX,
    moving:false
  };
}

function swipeMove(e){

  if(!swipeState.card) return;

  const touch = e.touches[0];

  const dx =
    touch.clientX - swipeState.startX;

  const dy =
    touch.clientY - swipeState.startY;

  if(Math.abs(dy) > Math.abs(dx)){
    return;
  }

  swipeState.moving = true;
  swipeState.currentX = touch.clientX;

  let distance = dx;

  if(distance > 0){
    distance = 0;
  }

  if(distance < -184){
    distance = -184;
  }

  swipeState.card.style.transition = "none";
  swipeState.card.style.transform =
    `translateX(${distance}px)`;
}

function swipeEnd(){

  if(!swipeState.card) return;

  const dx =
    swipeState.currentX -
    swipeState.startX;

  const card =
    swipeState.card;

  card.style.transition =
    "transform .22s ease";

  if(dx < -55){

    card.classList.add("open");

    activeCardId =
      card.dataset.id;

  }else if(dx > 55){

    card.classList.remove("open");

    activeCardId = null;

  }else if(!swipeState.moving){

    if(card.classList.contains("open")){

      card.classList.remove("open");
      activeCardId = null;

    }else{

      openDetail(
        data.find(
          x=>x.id === card.dataset.id
        )
      );
    }
  }

  swipeState.card = null;
}

function cardClick(e,id){

  if(
    e.target.closest(".swipe-action")
  ){
    return;
  }
}


/* =========================
   ACTION
========================= */

function handleAction(e,type,id){

  e.stopPropagation();

  const item =
    data.find(x=>x.id===id);

  if(!item) return;

  if(type === "copy"){
    copyItem(item);
  }

  if(type === "edit"){
    openEditor(item);
  }

  if(type === "delete"){
    deleteItem(id);
  }
}


/* =========================
   PRICE CHART
========================= */

function renderPriceChart(){

  const box =
    document.getElementById("priceChart");

  if(!data.length){

    box.innerHTML =
      `<div class="empty">暂无价格数据</div>`;

    return;
  }

  const items =
    [...data]
      .filter(x=>price60(x)>0)
      .sort(
        (a,b)=>price60(a)-price60(b)
      );

  if(!items.length){

    box.innerHTML =
      `<div class="empty">暂无有效价格数据</div>`;

    return;
  }

  const max =
    Math.max(
      ...items.map(price60)
    );

  box.innerHTML =
    items.map(item=>{

      const p =
        price60(item);

      const width =
        Math.max(
          5,
          (p / max) * 100
        );

      return `

        <div class="price-row">

          <div class="price-name">

            <strong>
              ${esc(item.institution)}
            </strong>

            <span>
              ${esc(item.packageName)}
            </span>

          </div>

          <div class="price-bar-area">

            <div class="price-track">

              <div
                class="price-bar"
                style="width:${width}%"
              ></div>

            </div>

            <div class="price-number">
              ¥${p.toFixed(2)}
            </div>

          </div>

          <div class="price-extra">

            <span class="price-tag">
              总价 ¥${item.price.toFixed(2)}
            </span>

            <span class="price-tag">
              ${validityText(item)}
            </span>

            <span class="price-tag">
              ${item.lessons}节 · ${item.minutes}分钟
            </span>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   COMMUTE
========================= */

function renderCommute(){

  const box =
    document.getElementById("commuteList");

  if(!data.length){

    box.innerHTML =
      `<div class="empty">暂无通勤数据</div>`;

    return;
  }

  /*
    同一家机构只出现一次。
    优先使用第一条完整的通勤资料。
  */

  const map =
    new Map();

  data.forEach(item=>{

    const key =
      item.institution.trim();

    if(!key) return;

    if(!map.has(key)){

      map.set(key,item);

      return;
    }

    const old =
      map.get(key);

    /*
      如果后面的套餐有更完整的信息，
      自动补充。
    */

    const merged = {
      ...old,

      district:
        old.district ||
        item.district,

      metroStation:
        old.metroStation ||
        item.metroStation,

      homeDistance:
        old.homeDistance ||
        item.homeDistance,

      workDistance:
        old.workDistance ||
        item.workDistance,

      homeTime:
        old.homeTime ||
        item.homeTime,

      workTime:
        old.workTime ||
        item.workTime
    };

    map.set(key,merged);
  });

  const items =
    [...map.values()];

  const maxTime =
    Math.max(
      1,
      ...items.flatMap(item=>[
        parseTimeValue(item.homeTime),
        parseTimeValue(item.workTime)
      ])
    );

  box.innerHTML =
    items.map(item=>{

      const home =
        parseTimeValue(item.homeTime);

      const work =
        parseTimeValue(item.workTime);

      const homeWidth =
        home
        ? Math.max(
            8,
            home / maxTime * 100
          )
        : 0;

      const workWidth =
        work
        ? Math.max(
            8,
            work / maxTime * 100
          )
        : 0;

      return `

        <div class="commute-item">

          <div class="commute-top">

            <div class="commute-name">

              <strong>
                ${esc(item.institution)}
              </strong>

              <div class="location-line">

                ${
                  item.district
                  ? esc(item.district)
                  : "区域未设置"
                }

                ${
                  item.metroStation
                  ?
                  `
                  <span class="station">
                    <span class="metro-dot"></span>
                    ${esc(item.metroStation)}
                  </span>
                  `
                  :
                  ""
                }

              </div>

            </div>

          </div>

          <div class="commute-values">

            <div class="commute-box home">

              <div class="commute-box-label">
                回家
              </div>

              <div class="commute-box-value">
                ${formatTime(home)}
              </div>

              ${
                home
                ?
                `
                <div class="commute-bar">
                  <div
                    class="commute-bar-fill"
                    style="width:${homeWidth}%"
                  ></div>
                </div>
                `
                :
                ""
              }

            </div>

            <div class="commute-box work">

              <div class="commute-box-label">
                去公司
              </div>

              <div class="commute-box-value">
                ${formatTime(work)}
              </div>

              ${
                work
                ?
                `
                <div class="commute-bar">
                  <div
                    class="commute-bar-fill"
                    style="width:${workWidth}%"
                  ></div>
                </div>
                `
                :
                ""
              }

            </div>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================
   SUMMARY
========================= */

function renderSummary(){

  const institutions =
    new Set(
      data
        .map(x=>x.institution.trim())
        .filter(Boolean)
    );

  const prices =
    data
      .map(price60)
      .filter(x=>x>0);

  const min =
    prices.length
      ? Math.min(...prices)
      : 0;

  document.getElementById(
    "summaryPackages"
  ).textContent =
    data.length;

  document.getElementById(
    "summaryInstitutions"
  ).textContent =
    institutions.size;

  document.getElementById(
    "summaryMinPrice"
  ).textContent =
    min
      ? "¥" + min.toFixed(2)
      : "—";
}


/* =========================
   RENDER ALL
========================= */

function render(){

  renderPackages();
  renderPriceChart();
  renderCommute();
  renderSummary();
}

          : item.validityValue,

        item.validityUnit === "permanent"
          ? "永久有效"
          : item.validityUnit === "day"
            ? "天"
            : item.validityUnit === "year"
              ? "年"
              : "月",

      "每60分钟价格":
        price60(item),

      "区域":
        item.district,

      "最近地铁站":
        item.metroStation,

      "距家距离(km)":
        item.homeDistance,

      "距公司距离(km)":
        item.workDistance,

      "到家时间":
        formatTime(item.homeTime),

      "到公司时间":
        formatTime(item.workTime),

      /*
        额外保存纯分钟，
        方便下一次准确恢复。
      */
      "到家时间_分钟":
        item.homeTime,

      "到公司时间_分钟":

    }));

  const worksheet =
    XLSX.utils.json_to_sheet(rows);

  );

}


/* =========================
   EXCEL IMPORT
========================= */

function importExcel(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e){

    try{

      const workbook =
        XLSX.read(
          e.target.result,
          {
            type:"array"
          }
        );

      const sheet =
        workbook.Sheets[
          workbook.SheetNames[0]
        ];

      const rows =
        XLSX.utils.sheet_to_json(
          sheet,
          {
            defval:""
          }
        );

      if(!rows.length){

        toast("Excel 没有数据");
        return;
      }

      let imported = 0;

      rows.forEach(row=>{

        const item =
          importRow(row);

        if(
          item.institution &&
          item.packageName
        ){

          data.push(item);

          imported++;
        }
      });

      saveData();
      render();

      toast(
        `成功导入 ${imported} 条套餐`
      );

    }catch(error){

      console.error(error);

      toast(
        "Excel 导入失败，请检查文件"
      );

    }finally{

      event.target.value = "";
    }
  };

  reader.readAsArrayBuffer(file);
}


function getCell(row,names){

  for(const name of names){

    if(
      Object.prototype.hasOwnProperty.call(
        row,
        name
      )
    ){
      return row[name];
    }
  }

  return "";
}


function importRow(row){

  const institution =
    getCell(
      row,
      [
        "机构名称",
        "机构",
        "institution"
      ]
    );

  const packageName =
    getCell(
      row,
      [
        "套餐名称",
        "套餐",
        "packageName"
      ]
    );

  const price =
    num(
      getCell(
        row,
        [
          "套餐价格",
          "总价格",
          "价格",
          "price"
        ]
      )
    );

  const lessons =
    num(
      getCell(
        row,
        [
          "课时数量",
          "课时",
          "节数",
          "lessons"
        ]
      )
    );

  const minutes =
    num(
      getCell(
        row,
        [
          "每节课时长",
          "课时长度",
          "minutes"
        ]
      )
    ) || 60;


  /* =========
     有效期
  ========= */

  let validityValue =
    getCell(
      row,
      [
        "有效期数值",
        "validityValue"
      ]
    );

  let validityUnit =
    getCell(
      row,
      [
        "有效期单位",
        "validityUnit"
      ]
    );

  const validityTextRaw =
    getCell(
      row,
      [
        "有效期"
      ]
    );

  if(
    !validityUnit &&
    String(validityTextRaw)
      .includes("永久")
  ){
    validityUnit = "permanent";
    validityValue = "";
  }

  if(
    validityUnit === "年" ||
    validityUnit === "year"
  ){
    validityUnit = "year";
  }
  else if(
    validityUnit === "天" ||
    validityUnit === "day"
  ){
    validityUnit = "day";
  }
  else if(
    validityUnit === "永久有效" ||
    validityUnit === "permanent"
  ){
    validityUnit = "permanent";
    validityValue = "";
  }
  else{
    validityUnit = "month";
  }


  /* =========
     通勤时间
  ========= */

  let homeTime =
    getCell(
      row,
      [
        "到家时间_分钟",
        "到家时间分钟",
        "homeTime"
      ]
    );

  let workTime =
    getCell(
      row,
      [
        "到公司时间_分钟",
        "到公司时间分钟",
        "workTime"
      ]
    );

  /*
    如果 Excel 有纯分钟，
    直接使用。
  */

  if(
    homeTime === "" ||
    homeTime === null ||
    homeTime === undefined
  ){

    homeTime =
      getCell(
        row,
        [
          "到家时间",
          "回家时间"
        ]
      );
  }

  if(
    workTime === "" ||
    workTime === null ||
    workTime === undefined
  ){

    workTime =
      getCell(
        row,
        [
          "到公司时间",
          "去公司时间"
        ]
      );
  }


  return {

    id:uid(),

    institution:String(
      institution || ""
    ).trim(),

    packageName:String(
      packageName || ""
    ).trim(),

    price,

    lessons,

    minutes,

    validityValue:
      validityUnit === "permanent"
        ? ""
        : validityValue,

    validityUnit,

    district:
      String(
        getCell(
          row,
          [
            "区域",
            "地区",
            "district"
          ]
        ) || ""
      ).trim(),

    metroStation:
      String(
        getCell(
          row,
          [
            "最近地铁站",
            "地铁站",
            "metroStation"
          ]
        ) || ""
      ).trim(),

    homeDistance:
      num(
        getCell(
          row,
          [
            "距家距离(km)",
            "距家距离",
            "homeDistance"
          ]
        )
      ),

    workDistance:
      num(
        getCell(
          row,
          [
            "距公司距离(km)",
            "距公司距离",
            "workDistance"
          ]
        )
      ),

    homeTime:
      parseTimeValue(homeTime),

    workTime:
      parseTimeValue(workTime)
  };
}


/* =========================
   JSON BACKUP
========================= */

function exportJSON(){

  if(!data.length){

    toast("没有可以备份的数据");
    return;
  }

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "芭蕾机构价格备份.json";

  a.click();

  URL.revokeObjectURL(url);

  toast("数据备份已导出");
}

/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      el.classList.remove("show");
    },1800);
}


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}
