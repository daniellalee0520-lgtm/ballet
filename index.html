<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
    --bg:#f8f4f2;
    --card:#fffdfc;
    --text:#302c2d;
    --muted:#918687;
    --border:#eadfdd;

    --pink:#c98f9f;
    --pink-dark:#ae7385;
    --pink-light:#f5e5e9;
    --pink-soft:#fbf1f3;

    --lavender:#a69bbd;
    --lavender-light:#eeeaf5;

    --cream:#f5eee6;

    --green:#738d79;
    --green-light:#eaf1eb;

    --danger:#b86c70;
    --danger-light:#f8e9ea;

    --shadow:0 8px 24px rgba(92,70,76,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:0 16px 60px;
}

/* =========================
   Header
========================= */

.hero{
    position:relative;
    margin:0 -16px 18px;
    padding:28px 22px 24px;
    overflow:hidden;
    background:
        radial-gradient(circle at 90% 10%, rgba(201,143,159,.18), transparent 30%),
        radial-gradient(circle at 10% 100%, rgba(166,155,189,.13), transparent 28%),
        linear-gradient(135deg,#fffaf8,#f7eeee);
    border-bottom:1px solid var(--border);
}

.hero::after{
    content:"";
    position:absolute;
    right:-25px;
    bottom:-45px;
    width:150px;
    height:150px;
    border:1px solid rgba(201,143,159,.22);
    border-radius:50%;
}

.hero-top{
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    z-index:1;
}

.ballet-mark{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--pink-light);
    font-size:22px;
}

.eyebrow{
    font-size:10px;
    letter-spacing:2px;
    color:var(--pink-dark);
    font-weight:700;
}

.hero h1{
    margin:10px 0 4px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:27px;
    font-weight:600;
    letter-spacing:.3px;
}

.hero p{
    margin:0;
    color:var(--muted);
    font-size:13px;
}

/* =========================
   Section
========================= */

.section{
    margin-bottom:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 2px 10px;
}

.section-title h2{
    margin:0;
    font-size:16px;
    font-weight:700;
}

.section-title span{
    font-size:11px;
    color:var(--muted);
}

/* =========================
   Summary
========================= */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.summary-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 10px;
    box-shadow:var(--shadow);
    min-width:0;
}

.summary-label{
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
}

.summary-value{
    margin-top:5px;
    font-size:20px;
    font-weight:700;
    line-height:1.1;
}

.summary-unit{
    font-size:10px;
    color:var(--muted);
    margin-left:2px;
}

/* =========================
   Controls
========================= */

.controls{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:11px;
    box-shadow:var(--shadow);
}

.control-row{
    display:flex;
    gap:8px;
}

.search-wrap{
    flex:1;
    position:relative;
}

.search-wrap span{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-size:14px;
}

.search-wrap input{
    width:100%;
    height:38px;
    padding:0 12px 0 32px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    outline:none;
}

.search-wrap input:focus{
    border-color:var(--pink);
}

.filter-btn{
    height:38px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--pink-soft);
    color:var(--pink-dark);
}

.filter-row{
    display:flex;
    gap:7px;
    margin-top:8px;
    overflow-x:auto;
    scrollbar-width:none;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter-select{
    flex:1;
    min-width:110px;
    height:35px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
    color:var(--text);
    padding:0 8px;
    outline:none;
    font-size:12px;
}

/* =========================
   New package
========================= */

.new-package{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.new-package-head{
    min-height:52px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 13px;
}

.new-package-title{
    display:flex;
    align-items:center;
    gap:9px;
}

.new-package-icon{
    width:30px;
    height:30px;
    border-radius:9px;
    background:var(--pink-light);
    display:flex;
    align-items:center;
    justify-content:center;
}

.new-package-title strong{
    display:block;
    font-size:14px;
}

.new-package-title small{
    color:var(--muted);
    font-size:10px;
}

.primary-btn{
    border:0;
    background:var(--pink);
    color:#fff;
    height:34px;
    padding:0 13px;
    border-radius:9px;
    font-size:12px;
    font-weight:600;
}

.primary-btn:active{
    transform:scale(.98);
}

.form-body{
    display:none;
    border-top:1px solid var(--border);
    padding:13px;
}

.form-body.open{
    display:block;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.form-field{
    min-width:0;
}

.form-field.full{
    grid-column:1/-1;
}

.form-field label{
    display:block;
    margin-bottom:5px;
    font-size:11px;
    color:var(--muted);
}

.form-field input,
.form-field select{
    width:100%;
    height:36px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
    color:var(--text);
    outline:none;
    font-size:12px;
}

.form-field input:focus,
.form-field select:focus{
    border-color:var(--pink);
}

.form-section-label{
    grid-column:1/-1;
    padding-top:3px;
    font-size:11px;
    color:var(--pink-dark);
    font-weight:700;
}

.form-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.secondary-btn{
    flex:1;
    height:36px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    border-radius:9px;
}

.form-actions .primary-btn{
    flex:1;
}

/* =========================
   Time picker
========================= */

.time-select{
    width:100%;
    height:36px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
    color:var(--text);
    padding:0 9px;
    outline:none;
    font-size:13px;
}

/* =========================
   Charts
========================= */

.chart-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    box-shadow:var(--shadow);
    padding:13px;
    overflow:hidden;
}

.chart-scroll{
    overflow-x:auto;
    padding-bottom:5px;
    scrollbar-width:thin;
}

.chart-scroll::-webkit-scrollbar{
    height:4px;
}

.chart{
    min-width:520px;
    height:270px;
    display:flex;
    align-items:flex-end;
    gap:12px;
    padding:30px 8px 28px;
    border-bottom:1px solid var(--border);
    position:relative;
}

.chart-grid{
    position:absolute;
    left:0;
    right:0;
    top:30px;
    bottom:28px;
    pointer-events:none;
}

.grid-line{
    position:absolute;
    left:0;
    right:0;
    border-top:1px dashed #eee5e3;
}

.grid-line:nth-child(1){top:0}
.grid-line:nth-child(2){top:25%}
.grid-line:nth-child(3){top:50%}
.grid-line:nth-child(4){top:75%}
.grid-line:nth-child(5){top:100%}

.chart-item{
    position:relative;
    z-index:2;
    flex:0 0 64px;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
}

.chart-value{
    font-size:10px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;
    white-space:nowrap;
}

.chart-bar-wrap{
    height:175px;
    width:42px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.chart-bar{
    width:34px;
    min-height:5px;
    border-radius:7px 7px 2px 2px;
    background:linear-gradient(to top,#b97e90,#d9aeb9);
    transition:height .35s ease;
}

.chart-label{
    width:70px;
    margin-top:7px;
    font-size:9px;
    color:var(--muted);
    text-align:center;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chart-empty{
    width:100%;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:12px;
}

/* commute chart */

.commute-chart .chart{
    min-width:520px;
}

.commute-bar{
    background:linear-gradient(to top,#9589ad,#c0b8d1);
}

/* =========================
   Package list
========================= */

.package-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.package-row{
    position:relative;
    overflow:hidden;
    border-radius:13px;
    background:#eee8e7;
}

.swipe-actions{
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:stretch;
}

.swipe-action{
    width:58px;
    border:0;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    font-size:10px;
}

.swipe-action span{
    font-size:16px;
}

.action-detail{
    background:#9e92b5;
}

.action-copy{
    background:#6f9c88;
}

.action-edit{
    background:#444145;
}

.action-delete{
    background:#c8787e;
}

.package-card{
    position:relative;
    z-index:2;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 5px 16px rgba(92,70,76,.05);
    transform:translateX(0);
    transition:transform .22s ease;
    touch-action:pan-y;
}

.package-card.swiped{
    transform:translateX(-232px);
}

.package-main{
    padding:10px 11px;
}

.package-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.package-title{
    min-width:0;
}

.institution-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
}

.institution-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--pink);
    flex:none;
}

.package-name{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.package-price{
    text-align:right;
    flex:none;
}

.package-price strong{
    font-size:17px;
    line-height:1;
}

.package-price small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:9px;
}

.package-info{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    overflow:hidden;
}

.info-pill{
    background:#f7f2f1;
    border-radius:7px;
    padding:4px 7px;
    color:#665d5e;
    font-size:9px;
    white-space:nowrap;
}

.info-pill.price{
    background:var(--pink-light);
    color:var(--pink-dark);
}

.info-pill.validity{
    background:var(--lavender-light);
    color:#756b8a;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.package-hint{
    margin-top:7px;
    color:#b1a5a5;
    font-size:9px;
}

/* =========================
   Commute overview
========================= */

.institution-meta{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 2px 10px;
    flex-wrap:wrap;
}

.institution-meta strong{
    font-size:13px;
}

.meta-separator{
    color:#d3c7c6;
}

.meta-item{
    font-size:10px;
    color:var(--muted);
}

.meta-item.metro{
    color:#756b8a;
}

.no-data{
    text-align:center;
    padding:35px 10px;
    color:var(--muted);
    font-size:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
}

/* =========================
   Bottom tools
========================= */

.tools{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:12px;
    box-shadow:var(--shadow);
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.tool-btn{
    height:38px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:9px;
    font-size:10px;
    color:#5f5657;
}

.tool-btn:hover{
    border-color:var(--pink);
}

.tool-btn.danger{
    color:var(--danger);
}

/* =========================
   Modal
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(42,34,36,.3);
    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(620px,100%);
    max-height:88vh;
    overflow:auto;
    background:var(--card);
    border-radius:22px 22px 0 0;
    padding:16px;
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.modal-head h3{
    margin:0;
    font-size:17px;
}

.close-btn{
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:#f3eeec;
    color:#766d6e;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.detail-item{
    padding:10px;
    border-radius:10px;
    background:#f8f4f2;
}

.detail-item.full{
    grid-column:1/-1;
}

.detail-label{
    font-size:9px;
    color:var(--muted);
    margin-bottom:4px;
}

.detail-value{
    font-size:12px;
    font-weight:600;
    word-break:break-word;
}

.detail-highlight{
    background:var(--pink-soft);
}

.detail-price{
    color:var(--pink-dark);
    font-size:16px;
}

.modal-footer{
    margin-top:12px;
    display:flex;
    gap:8px;
}

.modal-footer button{
    flex:1;
    height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
}

.modal-footer .primary{
    border:0;
    background:var(--pink);
    color:#fff;
}

/* =========================
   Toast
========================= */

.toast{
    position:fixed;
    z-index:2000;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    padding:10px 15px;
    background:#393435;
    color:#fff;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   Empty
========================= */

.empty{
    text-align:center;
    padding:40px 20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    color:var(--muted);
}

.empty-mark{
    font-size:30px;
    margin-bottom:8px;
}

.empty p{
    margin:4px 0;
    font-size:12px;
}

/* =========================
   Mobile
========================= */

@media(max-width:600px){

    .app{
        padding:0 12px 50px;
    }

    .hero{
        margin:0 -12px 15px;
        padding:23px 17px 20px;
    }

    .hero h1{
        font-size:24px;
    }

    .summary-grid{
        gap:7px;
    }

    .summary-card{
        padding:10px 8px;
    }

    .summary-value{
        font-size:17px;
    }

    .summary-label{
        font-size:10px;
    }

    .form-grid{
        gap:7px;
    }

    .form-field input,
    .form-field select,
    .time-select{
        height:35px;
        font-size:11px;
    }

    .tool-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .package-card.swiped{
        transform:translateX(-232px);
    }

    .swipe-action{
        width:58px;
    }

    .chart{
        min-width:480px;
    }
}

@media(min-width:700px){
    .modal{
        align-items:center;
    }

    .modal-box{
        border-radius:20px;
        max-height:80vh;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="hero">
        <div class="hero-top">
            <div class="ballet-mark">🩰</div>
            <div>
                <div class="eyebrow">BALLET STUDIO · PRICE BOOK</div>
            </div>
        </div>

        <h1>芭蕾机构价格对比</h1>
        <p>记录套餐 · 比较每小时成本 · 查看通勤距离</p>
    </header>


    <!-- 价格总览 -->
    <section class="section">

        <div class="section-title">
            <h2>价格总览</h2>
            <span>按当前数据统计</span>
        </div>

        <div class="summary-grid">

            <div class="summary-card">
                <div class="summary-label">机构数量</div>
                <div class="summary-value" id="summaryInstitutions">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">套餐数量</div>
                <div class="summary-value" id="summaryPackages">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">最低每小时</div>
                <div class="summary-value">
                    ¥<span id="summaryMinHour">0</span>
                </div>
            </div>

        </div>
    </section>


    <!-- 搜索 -->
    <section class="section">

        <div class="controls">

            <div class="control-row">

                <div class="search-wrap">
                    <span>⌕</span>
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="搜索机构或套餐名称"
                    >
                </div>

                <button class="filter-btn" id="clearSearch">
                    清除
                </button>

            </div>

            <div class="filter-row">

                <select class="filter-select" id="institutionFilter">
                    <option value="">全部机构</option>
                </select>

                <select class="filter-select" id="sortFilter">
                    <option value="hourAsc">每小时价格：低 → 高</option>
                    <option value="hourDesc">每小时价格：高 → 低</option>
                    <option value="totalAsc">总价格：低 → 高</option>
                    <option value="totalDesc">总价格：高 → 低</option>
                </select>

            </div>

        </div>

    </section>


    <!-- 新建套餐 -->
    <section class="section">

        <div class="new-package">

            <div class="new-package-head">

                <div class="new-package-title">
                    <div class="new-package-icon">✦</div>
                    <div>
                        <strong id="formTitle">新建套餐</strong>
                        <small>点击右侧按钮展开</small>
                    </div>
                </div>

                <button class="primary-btn" id="toggleForm">
                    ＋ 新建
                </button>

            </div>

            <div class="form-body" id="formBody">

                <input type="hidden" id="editingId">

                <div class="form-grid">

                    <div class="form-field">
                        <label>机构名称 *</label>

<script>
/* =========================================================
   Ballet Price Book
========================================================= */

const STORAGE_KEY = "ballet_price_database_v2";

let data = loadData();
let currentDetailId = null;

const $ = id => document.getElementById(id);


/* =========================================================
   初始化
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    buildTimeOptions();

    bindEvents();

    renderAll();

});


/* =========================================================
   数据
========================================================= */

function loadData(){

    try{

        const raw = localStorage.getItem(STORAGE_KEY);

        if(!raw){
            return [];
        }

        const parsed = JSON.parse(raw);

        if(!Array.isArray(parsed)){
            return [];
        }

        return parsed.map(normalizePackage);

    }catch(error){

        console.error(error);

        return [];

    }

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function normalizePackage(item){

    const p = {...item};

    p.id = p.id || (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
    );

    p.institution = p.institution || "";
    p.packageName = p.packageName || "";

    p.price = toNumber(p.price);
    p.lessons = toNumber(p.lessons);
    p.minutes = toNumber(p.minutes) || 60;

    p.validityValue =
        p.validityValue === undefined ||
        p.validityValue === null ||
        p.validityValue === ""
        ? ""
        : toNumber(p.validityValue);

    p.validityUnit =
        p.validityUnit || "month";

    p.district = p.district || "";
    p.metroStation = p.metroStation || "";

    p.homeDistance = toNumber(p.homeDistance);
    p.workDistance = toNumber(p.workDistance);

    /*
       兼容历史数据：
       homeTime / workTime
       以前可能直接保存成数字分钟
    */
    p.homeTime = parseCommuteTime(
        p.homeTime,
        p["到家时间(分钟)"],
        p["到家时间"]
    );

    p.workTime = parseCommuteTime(
        p.workTime,
        p["到公司时间(分钟)"],
        p["到公司时间"]
    );

    return p;

}


function toNumber(value){

    if(value === null || value === undefined || value === ""){
        return 0;
    }

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =========================================================
   时间
========================================================= */

/*
   一个完整的小时:分钟选择器
   每一分钟一个选项
   不再使用秒
   不再使用5分钟间隔
*/

function buildTimeOptions(){

    const selects = [
        $("homeTime"),
        $("workTime")
    ];

    selects.forEach(select => {

        for(let h=0; h<24; h++){

            for(let m=0; m<60; m++){

                const total = h * 60 + m;

                const option = document.createElement("option");

                option.value = total;

                option.textContent =
                    `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;

                select.appendChild(option);

            }

        }

    });

}


/*
   兼容各种历史时间格式：

   65
   "65"
   "1:05"
   "01:05"
   "1h5min"
   "1小时5分钟"
   "65分钟"
   Excel 时间小数
*/

function parseCommuteTime(value, legacyValue, chineseValue){

    let v =
        value !== undefined &&
        value !== null &&
        value !== ""
        ? value
        : (
            legacyValue !== undefined &&
            legacyValue !== null &&
            legacyValue !== ""
            ? legacyValue
            : chineseValue
        );

    if(v === undefined || v === null || v === ""){
        return "";
    }

    if(typeof v === "number"){

        /*
           Excel 如果把时间存成 0~1 的日期小数，
           自动转换成分钟。
        */
        if(v > 0 && v < 1){

            return Math.round(v * 24 * 60);

        }

        return Math.round(v);

    }

    let s = String(v).trim();

    if(!s){
        return "";
    }

    /*
       1小时5分钟
       1h5min
       1h 5m
    */
    const hm = s.match(
        /(\d+(?:\.\d+)?)\s*(?:小时|h|hr|hour)\s*(\d+(?:\.\d+)?)?\s*(?:分钟|min|m|minute)?/i
    );

    if(hm){

        const h = Number(hm[1]) || 0;
        const m = Number(hm[2]) || 0;

        return Math.round(h * 60 + m);

    }

    /*
       1:05
       01:05
    */
    const colon = s.match(/^(\d{1,2}):(\d{1,2})$/);

    if(colon){

        return Number(colon[1]) * 60 +
               Number(colon[2]);

    }

    /*
       65分钟
    */
    const minuteMatch = s.match(
        /(\d+(?:\.\d+)?)\s*(?:分钟|min|m)$/i
    );

    if(minuteMatch){

        return Math.round(Number(minuteMatch[1]));

    }

    /*
       纯数字
    */
    const n = Number(s);

    if(Number.isFinite(n)){

        if(n > 0 && n < 1){

            return Math.round(n * 24 * 60);

        }

        return Math.round(n);

    }

    return "";

}


function formatTime(totalMinutes){

    if(
        totalMinutes === "" ||
        totalMinutes === null ||
        totalMinutes === undefined ||
        !Number.isFinite(Number(totalMinutes))
    ){

        return "—";

    }

    const total = Math.max(0, Math.round(Number(totalMinutes)));

    const h = Math.floor(total / 60);
    const m = total % 60;

    if(h === 0){
        return `${m}分钟`;
    }

    if(m === 0){
        return `${h}小时`;
    }

    return `${h}小时${m}分钟`;

}


/* =========================================================
   价格
========================================================= */

function getHourPrice(p){

    if(
        !p.price ||
        !p.lessons ||
        !p.minutes
    ){

        return 0;

    }

    const totalHours =
        (p.lessons * p.minutes) / 60;

    if(totalHours <= 0){
        return 0;
    }

    return p.price / totalHours;

}


function getLessonPrice(p){

    if(!p.lessons){
        return 0;
    }

    return p.price / p.lessons;

}


/* =========================================================
   有效期
========================================================= */

function getValidityDisplay(p){

    if(
        p.validityUnit === "permanent" ||
        p.validityValue === "" ||
        p.validityValue === null ||
        p.validityValue === undefined
    ){

        if(p.validityUnit === "permanent"){
            return "永久有效";
        }

        return "—";

    }

    const value = Number(p.validityValue);

    if(!Number.isFinite(value)){
        return "—";
    }

    if(p.validityUnit === "day"){

        /*
           天数自动换算成月
           保留1位小数
        */

        const months = value / 30;

        return `${months.toFixed(1)}个月`;

    }

    if(p.validityUnit === "year"){

        return `${value}年`;

    }

    return `${value}个月`;

}

}

        lessons:toNumber($("lessons").value),

        minutes:toNumber($("minutes").value) || 60,

        validityValue:
            $("validityUnit").value === "permanent"

                $("validityValue").value === ""
                ? ""
                : toNumber($("validityValue").value)
            ),

        validityUnit:$("validityUnit").value,

        district:$("district").value.trim(),

        metroStation:$("metroStation").value.trim(),

        homeDistance:toNumber($("homeDistance").value),

        workDistance:toNumber($("workDistance").value),

        homeTime:

        workTime:
            $("workTime").value === ""

}


function savePackage(){

    const item = collectForm();

    if(!item.institution){

        showToast("请输入机构名称");

        return;

    }

    if(!item.packageName){

        showToast("请输入套餐名称");

        return;

    }

    if(item.price <= 0){

        showToast("请输入套餐价格");

        return;

    }

    if(item.lessons <= 0){

        showToast("请输入课时数量");

        return;

    }

    if(item.minutes <= 0){

        showToast("请输入每节课时长");

        return;

    }

    const editingId =
        $("editingId").value;

    if(editingId){

        const index =
            data.findIndex(x => x.id === editingId);

        if(index !== -1){

            data[index] = {
                ...data[index],
                ...item
            };

        }

    }else{

        data.unshift({

            id:
                Date.now().toString(36) +
                Math.random().toString(36).slice(2),

            createdAt:
                new Date().toISOString(),

            ...item

        });

    }

    saveData();

    resetForm();

    closeForm();

    renderAll();

    showToast(
        editingId
        ? "套餐已更新"
        : "套餐已添加"
    );

}

========================================================= */

function deletePackage(id){

        !confirm(
            `确定删除「${p.institution} · ${p.packageName}」吗？`

    data =
        data.filter(x => x.id !== id);

    renderAll();

    showToast("已删除");

/* =========================================================
   Swipe
========================================================= */

function bindSwipeEvents(){

    document
        .querySelectorAll(".package-card")
        .forEach(card => {

            let startX = 0;
            let startY = 0;
            let moved = false;

            card.addEventListener(
                "touchstart",
                e => {

                    const touch = e.touches[0];

                    startX = touch.clientX;
                    startY = touch.clientY;

                    moved = false;

                },
                {passive:true}
            );


            card.addEventListener(
                "touchmove",
                e => {

                    const touch = e.touches[0];

                    const dx =
                        touch.clientX - startX;

                    const dy =
                        touch.clientY - startY;

                    if(Math.abs(dx) > 10){
                        moved = true;
                    }

                    if(
                        Math.abs(dx) >
                        Math.abs(dy) &&
                        Math.abs(dx) > 15
                    ){

                        e.preventDefault();

                    }

                },
                {passive:false}
            );


            card.addEventListener(
                "touchend",
                e => {

                    if(!moved){
                        return;
                    }

                    const touch =
                        e.changedTouches[0];

                    const dx =
                        touch.clientX - startX;

                    /*
                       左滑：显示右侧操作
                       右滑：收回
                    */

                    if(dx < -40){

                        closeAllSwipes(card);

                        card.classList.add("swiped");

                    }else if(dx > 40){

                        card.classList.remove("swiped");

                    }

                }
            );

        });

}


function closeAllSwipes(except=null){

    document
        .querySelectorAll(".package-card.swiped")
        .forEach(card => {

            if(card !== except){

                card.classList.remove("swiped");

            }

        });

}

   筛选
========================================================= */

function getFilteredData(){

    const search =
        $("searchInput").value
            .trim()
            .toLowerCase();

    const institution =
        $("institutionFilter").value;

    const sort =
        $("sortFilter").value;

    let list =
        data.filter(p => {

            const matchesSearch =
                !search ||
                p.institution
                    .toLowerCase()
                    .includes(search) ||
                p.packageName
                    .toLowerCase()
                    .includes(search);

            const matchesInstitution =
                !institution ||
                p.institution === institution;

            return (
                matchesSearch &&
                matchesInstitution
            );

        });


    list.sort((a,b) => {

        if(sort === "hourAsc"){
            return getHourPrice(a) -
                   getHourPrice(b);
        }

        if(sort === "hourDesc"){
            return getHourPrice(b) -
                   getHourPrice(a);
        }

        if(sort === "totalAsc"){
            return a.price - b.price;
        }

        if(sort === "totalDesc"){
            return b.price - a.price;
        }

        return 0;

    });

    return list;

}


function updateInstitutionFilter(){

    const select =
        $("institutionFilter");

    const oldValue =
        select.value;

    const institutions =
        [...new Set(
            data
                .map(x => x.institution)
                .filter(Boolean)
        )]
        .sort((a,b) =>
            a.localeCompare(b,"zh-CN")
        );

    select.innerHTML =
        `<option value="">全部机构</option>` +
        institutions
            .map(name =>
                `<option value="${escapeAttr(name)}">
                    ${escapeHTML(name)}
                </option>`
            )
            .join("");

    if(institutions.includes(oldValue)){

        select.value = oldValue;

    }

}

========================================================= */

function getInstitutionCommuteData(){

    const map = new Map();

    data.forEach(p => {

        if(!p.institution){
            return;
        }

        const current =
            map.get(p.institution);

        if(!current){

            map.set(
                p.institution,
                {...p}
            );

            return;

        }

        /*
           同一家机构只显示一次。
           如果第一条资料缺少某项，
           就从其他套餐补齐。
        */

        const fields = [

            "district",
            "metroStation",
            "homeDistance",
            "workDistance",
            "homeTime",
            "workTime"

        ];

        fields.forEach(field => {

            const currentValue =
                current[field];

            const newValue =
                p[field];

            const currentEmpty =
                currentValue === "" ||
                currentValue === null ||
                currentValue === undefined ||
                currentValue === 0;

            const newHasValue =
                newValue !== "" &&
                newValue !== null &&
                newValue !== undefined &&
                newValue !== 0;

            if(currentEmpty && newHasValue){

                current[field] =
                    newValue;

            }

        });

    });

    return [...map.values()];

}


function renderCommuteOverview(){

    const institutions =
        getInstitutionCommuteData();


    const metaContainer =
        $("commuteMetaList");


    if(!institutions.length){

        metaContainer.innerHTML = "";

        $("commuteChart").innerHTML =
            `<div class="chart-empty">
                暂无通勤数据
             </div>`;

        return;

    }


    /*
       机构信息横向显示
       区域 + 最近地铁站
    */

    metaContainer.innerHTML =
        institutions.map(p => `

            <div class="institution-meta">

                <strong>
                    ${escapeHTML(p.institution)}
                </strong>

                <span class="meta-separator">·</span>

                <span class="meta-item">
                    ${escapeHTML(p.district || "区域未填写")}
                </span>

                ${
                    p.metroStation
                    ? `
                        <span class="meta-separator">·</span>

                        <span class="meta-item metro">
                            ${escapeHTML(p.metroStation)}
                        </span>
                    `
                    : ""
                }

            </div>

        `).join("");


    /*
       每家机构只取：
       到家 / 到公司 两项中最大的时间
       作为柱状图高度

       但标签会同时显示两种时间
    */

    const chartData =
        institutions
            .map(p => {

                const home =
                    p.homeTime === ""
                    ? null
                    : Number(p.homeTime);

                const work =
                    p.workTime === ""
                    ? null
                    : Number(p.workTime);

                const maxTime =
                    Math.max(
                        home || 0,
                        work || 0
                    );

                return {
                    ...p,
                    home,
                    work,
                    maxTime
                };

            })
            .filter(p => p.maxTime > 0)
            .sort((a,b) =>
                a.maxTime - b.maxTime
            );


    const container =
        $("commuteChart");


    if(!chartData.length){

        container.innerHTML =
            `<div class="chart-empty">
                暂无通勤时间数据
             </div>`;

        return;

    }


    const max =
        Math.max(
            ...chartData.map(x => x.maxTime)
        );


    container.innerHTML = `

        <div class="chart-grid">
            <div class="grid-line"></div>
            <div class="grid-line"></div>
            <div class="grid-line"></div>
            <div class="grid-line"></div>
            <div class="grid-line"></div>
        </div>

        ${chartData.map(p => {

            const height =
                Math.max(
                    5,
                    (p.maxTime / max) * 175
                );

            let label = "";

            if(
                p.home !== null &&
                p.work !== null
            ){

                label =
                    `家 ${formatTime(p.home)} · 公 ${formatTime(p.work)}`;

            }else if(p.home !== null){

                label =
                    `家 ${formatTime(p.home)}`;

            }else{

                label =
                    `公 ${formatTime(p.work)}`;

            }

            return `

                <div class="chart-item">

                    <div class="chart-value">
                        ${label}
                    </div>

                    <div class="chart-bar-wrap">

                        <div
                            class="chart-bar commute-bar"
                            style="height:${height}px"
                        ></div>

                    </div>

                    <div
                        class="chart-label"
                        title="${escapeAttr(p.institution)}"
                    >
                        ${escapeHTML(p.institution)}
                    </div>

                </div>

            `;

        }).join("")}

    `;

}

/* =========================================================
   Excel 导入
========================================================= */

function importExcel(file){

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const workbook =
                XLSX.read(
                    e.target.result,
                    {
                        type:"array",
                        cellDates:true
                    }
                );

            const firstSheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];

            const rows =
                XLSX.utils.sheet_to_json(
                    firstSheet,
                    {
                        defval:""
                    }
                );


            if(!rows.length){

                showToast("Excel 中没有数据");

                return;

            }


            const imported =
                rows
                    .map(row => {

                        const get = (...keys) => {

                            for(const key of keys){

                                if(
                                    row[key] !== undefined &&
                                    row[key] !== null &&
                                    row[key] !== ""
                                ){

                                    return row[key];

                                }

                            }

                            return "";

                        };


                        const validityUnitRaw =
                            String(
                                get(
                                    "有效期单位",
                                    "有效期单位（年/月/天）"
                                )
                            ).trim();


                        let validityUnit =
                            "month";


                        if(
                            validityUnitRaw === "永久" ||
                            validityUnitRaw === "永久有效" ||
                            validityUnitRaw === "permanent"
                        ){

                            validityUnit =
                                "permanent";

                        }else if(
                            validityUnitRaw === "年" ||
                            validityUnitRaw === "year"
                        ){

                            validityUnit =
                                "year";

                        }else if(
                            validityUnitRaw === "天" ||
                            validityUnitRaw === "day"
                        ){

                            validityUnit =
                                "day";

                        }else{

                            validityUnit =
                                "month";

                        }


                        /*
                           时间优先读取旧版“分钟”字段
                        */

                        const homeTime =
                            parseCommuteTime(
                                get(
                                    "到家时间(分钟)",
                                    "到家时间",
                                    "回家时间"
                                )
                            );

                        const workTime =
                            parseCommuteTime(
                                get(
                                    "到公司时间(分钟)",
                                    "到公司时间",
                                    "去公司时间"
                                )
                            );


                        return {

                            id:
                                Date.now().toString(36) +
                                Math.random().toString(36).slice(2),

                            createdAt:
                                new Date().toISOString(),

                            institution:
                                String(
                                    get(
                                        "机构名称",
                                        "机构",
                                        "机构名"
                                    )
                                ).trim(),

                            packageName:
                                String(
                                    get(
                                        "套餐名称",
                                        "套餐"
                                    )
                                ).trim(),

                            price:
                                toNumber(
                                    get(
                                        "套餐价格",
                                        "总价格",
                                        "价格"
                                    )
                                ),

                            lessons:
                                toNumber(
                                    get(
                                        "课时数量",
                                        "课时",
                                        "节数"
                                    )
                                ),

                            minutes:
                                toNumber(
                                    get(
                                        "每节课时长",
                                        "每节时长",
                                        "课时长度"
                                    )
                                ) || 60,

                            validityValue:
                                validityUnit === "permanent"
                                ? ""
                                : (
                                    get(
                                        "有效期数值",
                                        "有效期"
                                    ) === ""
                                    ? ""
                                    : toNumber(
                                        get(
                                            "有效期数值",
                                            "有效期"
                                        )
                                    )
                                ),

                            validityUnit,

                            district:
                                String(
                                    get(
                                        "区域",
                                        "地区"
                                    )
                                ).trim(),

                            metroStation:
                                String(
                                    get(
                                        "最近地铁站",
                                        "地铁站",
                                        "最近地铁"
                                    )
                                ).trim(),

                            homeDistance:
                                toNumber(
                                    get(
                                        "距家距离(km)",
                                        "距家距离",
                                        "回家距离"
                                    )
                                ),

                            workDistance:
                                toNumber(
                                    get(
                                        "距公司距离(km)",
                                        "距公司距离",
                                        "公司距离"
                                    )
                                ),

                            /*
                               这里是本次重点修复：
                               旧版导出的分钟数据可以直接恢复
                            */

                            homeTime,

                            workTime

                        };

                    })
                    .filter(
                        p =>
                            p.institution ||
                            p.packageName
                    );


            if(!imported.length){

                showToast("没有识别到有效套餐数据");

                return;

            }


            /*
               采用追加方式。
               原来的数据不会被覆盖。
            */

            data = [
                ...imported,
                ...data
            ];


            saveData();

            renderAll();

            showToast(
                `成功导入 ${imported.length} 条套餐`
            );


        }catch(error){

            console.error(error);

            showToast(
                "Excel 导入失败，请检查文件格式"
            );

        }

    };


    reader.readAsArrayBuffer(file);

}

function importJson(file){

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const imported =
                JSON.parse(e.target.result);

            if(!Array.isArray(imported)){

                throw new Error(
                    "JSON 格式错误"
                );

            }

            const normalized =
                imported.map(normalizePackage);

            data = normalized;

            saveData();

            );

        }catch(error){

            console.error(error);

            showToast(

            );

        }

    };

    reader.readAsText(file);

            }
        );


    /*
       永久有效时隐藏数值
    */

    $("validityUnit")
        .addEventListener(
            "change",
            () => {

                const permanent =
                    $("validityUnit").value === "permanent";

                $("validityValue").disabled =
                    permanent;

                if(permanent){

                    $("validityValue").value = "";

                }

            }
        );

}


/* =========================================================
   Helpers
========================================================= */

function formatMoney(value){

    const n =
        Number(value) || 0;

    return n.toLocaleString(
        "zh-CN",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}


function showToast(message){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () => {

                toast.classList.remove("show");

            },
            2200
        );

}


/* =========================================================
   全局函数
========================================================= */

window.showDetail = showDetail;
window.closeModal = closeModal;
window.copyPackage = copyPackage;
window.editPackage = editPackage;
window.deletePackage = deletePackage;

</script>
