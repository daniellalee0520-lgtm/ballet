<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>芭蕾机构价格对比</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f8f4f2;
  --card:#fffdfc;
  --text:#302c2d;
  --muted:#95898b;
  --border:#eadfdd;

  --pink:#c98f9f;
  --pink-dark:#b87588;
  --pink-light:#f5e5e9;
  --pink-soft:#fbf2f4;

  --lavender:#a79abb;
  --lavender-dark:#81739a;
  --lavender-light:#eeeaf5;

  --cream:#f5eee6;

  --green:#78917e;
  --green-light:#eaf1eb;

  --danger:#bd7076;
  --danger-light:#f8e9ea;

  --blue:#8da7ba;
  --blue-light:#eaf0f4;

  --shadow:0 8px 28px rgba(75,55,60,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 60px;
}

/* ==================================================
   HEADER
================================================== */

.hero{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      #fffaf8 0%,
      #f9eff1 48%,
      #f0ebf6 100%
    );
  border:1px solid #eee3e1;
  border-radius:28px;
  padding:26px 25px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.hero:after{
  content:"";
  position:absolute;
  right:-30px;
  top:-55px;
  width:190px;
  height:190px;
  border:1px solid rgba(201,143,159,.18);
  border-radius:50%;
}

.hero-small{
  font-size:11px;
  letter-spacing:2px;
  color:var(--pink-dark);
  font-weight:700;
  margin-bottom:7px;
}

.hero h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.5px;
}

.hero p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}

.hero-mark{
  position:absolute;
  right:24px;
  bottom:15px;
  font-size:42px;
  opacity:.12;
}

/* ==================================================
   SECTION
================================================== */

.section{
  margin-top:16px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 3px 10px;
}

.section-title h2{
  font-size:17px;
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

/* ==================================================
   FORM
================================================== */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--muted);
  font-size:11px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  height:40px;
  padding:0 11px;
  outline:none;
  color:var(--text);
}

.field input:focus,
.field select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(201,143,159,.10);
}

.validity-row{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:8px;
}

/*
   时间：
   现在改成一个整体选择器。
   0小时00分钟 → 6小时59分钟
*/
.time-wheel{
  width:100%;
}

.time-wheel select{
  width:100%;
  text-align:center;
  appearance:auto;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.btn{
  min-height:40px;
  border-radius:13px;
  padding:0 15px;
  font-weight:600;
}

.btn-primary{
  flex:1;
  background:var(--pink);
  color:white;
}

.btn-secondary{
  background:#f2eceb;
  color:#74686a;
}

/* ==================================================
   SUMMARY
================================================== */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summary-card{
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:13px 12px;
  box-shadow:0 5px 20px rgba(75,55,60,.04);
}

.summary-label{
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}

.summary-value{
  margin-top:5px;
  font-size:21px;
  font-weight:700;
  letter-spacing:-.4px;
}

.summary-card:nth-child(1) .summary-value{
  color:var(--pink-dark);
}

.summary-card:nth-child(2) .summary-value{
  color:var(--lavender);
}

.summary-card:nth-child(3) .summary-value{
  color:var(--green);
}

/* ==================================================
   FILTER
================================================== */

.filter-bar{
  display:flex;
  gap:8px;
  margin-bottom:11px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:40px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  padding:0 13px;
  outline:none;
}

.filter-bar select{
  width:130px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  padding:0 9px;
  color:var(--text);
}

/* ==================================================
   CHART COMMON
================================================== */

.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
}

/* ==================================================
   PRICE COLUMN CHART
================================================== */

.price-chart-wrap{
  overflow-x:auto;
  overflow-y:hidden;
  padding:10px 2px 2px;
  scrollbar-width:none;
}

.price-chart-wrap::-webkit-scrollbar{
  display:none;
}

.price-chart{
  min-width:max-content;
  height:300px;
  display:flex;
  align-items:flex-end;
  gap:13px;
  padding:0 7px;
}

.price-column{
  width:86px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  position:relative;
}

.price-column-value{
  font-size:11px;
  font-weight:700;
  color:var(--pink-dark);
  margin-bottom:5px;
  white-space:nowrap;
}

.price-column-bar-area{
  height:205px;
  width:48px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  position:relative;
}

.price-column-bar{
  width:42px;
  min-height:10px;
  border-radius:12px 12px 6px 6px;
  background:
    linear-gradient(
      180deg,
      #d9a8b5 0%,
      #bd8798 100%
    );
  box-shadow:
    0 6px 14px rgba(184,117,136,.16);
  transition:height .3s ease;
}

.price-column-label{
  width:90px;
  text-align:center;
  margin-top:8px;
}

.price-column-label strong{
  display:block;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price-column-label span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price-column-info{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  margin-top:5px;
}

.price-mini-tag{
  background:#f6eeee;
  color:#817476;
  border-radius:7px;
  padding:3px 6px;
  font-size:8px;
  white-space:nowrap;
}

/* ==================================================
   COMMUTE CHART
================================================== */

.commute-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  box-shadow:var(--shadow);
}

.commute-chart-wrap{
  overflow-x:auto;
  overflow-y:hidden;
  padding:8px 2px 4px;
  scrollbar-width:none;
}

.commute-chart-wrap::-webkit-scrollbar{
  display:none;
}

.commute-chart{
  min-width:max-content;
  height:300px;
  display:flex;
  align-items:flex-end;
  gap:17px;
  padding:0 8px;
}

.commute-column{
  width:104px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}

.commute-value-row{
  height:205px;
  width:90px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:7px;
}

.commute-single-bar{
  width:25px;
  min-height:8px;
  border-radius:10px 10px 5px 5px;
  position:relative;
}

.commute-home-bar{
  background:
    linear-gradient(
      180deg,
      #d7a5b3,
      #bf8b9c
    );
}

.commute-work-bar{
  background:
    linear-gradient(
      180deg,
      #bcb2ce,
      #9588ad
    );
}

.commute-bar-value{
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  font-size:8px;
  white-space:nowrap;
  color:#776b6d;
}

.commute-column-name{
  margin-top:8px;
  width:105px;
  text-align:center;
}

.commute-column-name strong{
  display:block;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.commute-column-name span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.commute-location{
  margin-top:4px;
  display:flex;
  justify-content:center;
  gap:4px;
  flex-wrap:wrap;
}

.location-tag{
  background:var(--cream);
  color:#81736c;
  border-radius:6px;
  padding:2px 5px;
  font-size:8px;
  max-width:105px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.metro-tag{
  background:var(--lavender-light);
  color:var(--lavender-dark);
}

.commute-legend{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:3px;
}

.legend-home{
  background:#c28d9e;
}

.legend-work{
  background:#988bad;
}

/* ==================================================
   PACKAGE LIST
================================================== */

.package-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.package-shell{
  position:relative;
  overflow:hidden;
  border-radius:17px;
  background:#eee7e6;
}

.package-actions{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:174px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
}

.swipe-action{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:white;
  font-size:10px;
  font-weight:600;
}

.swipe-action .action-icon{
  font-size:18px;
}

.copy-action{
  background:#8ea7bc;
}

.edit-action{
  background:#555153;
}

.delete-action{
  background:#c8757b;
}

.package-card{
  position:relative;
  z-index:2;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  min-height:88px;
  padding:9px 12px;
  box-shadow:0 4px 16px rgba(75,55,60,.045);

  transform:translateX(0);
  transition:transform .22s ease;
  touch-action:pan-y;
}

.package-card.open{
  transform:translateX(-174px);
}

.package-main{
  display:grid;
  grid-template-columns:minmax(0,1.4fr) auto auto;
  align-items:center;
  gap:10px;
}

.package-title{
  min-width:0;
}

.package-title strong{
  display:block;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-title span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.package-price{
  text-align:right;
}

.package-price strong{
  display:block;
  color:var(--pink-dark);
  font-size:16px;
}

.package-price span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:1px;
}

.package-lessons{
  text-align:right;
  min-width:55px;
}

.package-lessons strong{
  display:block;
  font-size:14px;
}

.package-lessons span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:1px;
}

.package-bottom{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  flex-wrap:wrap;
}

.mini-tag{
  border-radius:6px;
  padding:2px 6px;
  font-size:8px;
  color:#796d6f;
  background:#f6eeee;
  white-space:nowrap;
}

.mini-tag.valid{
  background:var(--lavender-light);
  color:#776b8e;
}

.mini-tag.location{
  background:var(--cream);
}

.mini-tag.metro{
  background:#edf1f5;
  color:#708397;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
  font-size:13px;
}

/* ==================================================
   DATA MANAGEMENT
================================================== */

.data-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
}

.data-buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.data-btn{
  min-width:0;
  min-height:66px;
  border-radius:17px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#665b5d;
  border:1px solid rgba(0,0,0,.035);
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.data-btn:active{
  transform:scale(.96);
}

.data-btn .icon{
  font-size:20px;
}

.data-btn span{
  font-size:10px;
  white-space:nowrap;
}

.data-btn:nth-child(1){
  background:#f5e5e9;
}

.data-btn:nth-child(2){
  background:#eeeaf5;
}

.data-btn:nth-child(3){
  background:#eaf1eb;
}

.data-btn:nth-child(4){
  background:#f5eee6;
}

.data-btn:nth-child(5){
  background:#f5e9ea;
  color:#a5676d;
}

/* ==================================================
   MODAL
================================================== */

.modal-mask{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(45,37,40,.35);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal-mask.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fffdfc;
  border-radius:27px 27px 18px 18px;
  padding:18px;
  box-shadow:0 20px 60px rgba(40,30,35,.20);
  animation:modalUp .22s ease;
}

@keyframes modalUp{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.modal-header strong{
  font-size:18px;
}

.modal-close{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#f3eceb;
  color:#796d6f;
  font-size:18px;
}

.detail-modal{
  padding-bottom:22px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.detail-item{
  background:#f9f4f3;
  border-radius:13px;
  padding:10px;
}

.detail-item.full{
  grid-column:1/-1;
}

.detail-item label{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.detail-item strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

/* ==================================================
   TOAST
================================================== */

.toast{
  position:fixed;
  z-index:2000;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  background:#3e3739;
  color:white;
  border-radius:12px;
  padding:10px 15px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:650px){

  .app{
    padding:10px 10px 45px;
  }

  .hero{
    border-radius:22px;
    padding:21px 18px;
  }

  .hero h1{
    font-size:23px;
  }

  .summary-grid{
    gap:7px;
  }

  .summary-card{
    padding:11px 8px;
    border-radius:15px;
  }

  .summary-value{
    font-size:18px;
  }

  .summary-label{
    font-size:10px;
  }

  .package-main{
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:7px;
  }

  .package-price strong{
    font-size:14px;
  }

  .package-lessons{
    min-width:43px;
  }

  .data-buttons{
    gap:5px;
  }

  .data-btn{
    min-height:62px;
    border-radius:14px;
  }

  .data-btn .icon{
    font-size:18px;
  }

  .data-btn span{
    font-size:9px;
  }

  .price-chart{
    height:285px;
  }

  .commute-chart{
    height:285px;
  }
}

@media(max-width:420px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .data-btn span{
    font-size:8px;
  }

  .data-btn{
    min-height:59px;
  }

  .package-card{
    padding:8px 10px;
  }

  .package-title strong{
    font-size:12px;
  }

  .package-price strong{
    font-size:13px;
  }

  .package-lessons strong{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <section class="hero">
    <div class="hero-small">BALLET STUDIO · PRICE BOOK</div>
    <h1>芭蕾机构价格对比</h1>
    <p>把不同机构、不同套餐放在一起，用相同课时长度比较真实成本。</p>
    <div class="hero-mark">🩰</div>
  </section>


  <!-- PACKAGE -->
  <section class="section">

    <div class="section-title">
      <h2>套餐</h2>
      <span id="packageCount">0 个套餐</span>
    </div>

    <div id="packageList" class="package-list"></div>

  </section>


  <!-- SUMMARY -->
  <section class="section">

    <div class="section-title">
      <h2>价格总览</h2>
    </div>

    <div class="summary-grid">

      <div class="summary-card">
        <div class="summary-label">套餐数量</div>
        <div class="summary-value" id="summaryPackages">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">机构数量</div>
        <div class="summary-value" id="summaryInstitutions">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">最低每60分钟</div>
        <div class="summary-value" id="summaryMinPrice">—</div>
      </div>

    </div>

  </section>


  <!-- FILTER -->
  <section class="section">

    <div class="filter-bar">

      <div class="search">
        <input
          id="searchInput"
          placeholder="搜索机构 / 套餐"
        >
      </div>

      <select id="sortSelect">
        <option value="price">价格从低到高</option>
        <option value="priceDesc">价格从高到低</option>
        <option value="name">机构名称</option>
      </select>

    </div>

  </section>


  <!-- PRICE CHART -->
  <section class="section">

    <div class="section-title">
      <h2>价格比较</h2>
      <span>每60分钟实际成本 · 从低到高</span>
    </div>

    <div class="chart-card">

      <div class="price-chart-wrap">
        <div id="priceChart" class="price-chart"></div>
      </div>

    </div>

  </section>


  <!-- COMMUTE -->
  <section class="section">

<script>

/* ==================================================
   DATA
================================================== */

const STORAGE_KEY =
  "ballet_price_database_v4";

let data = loadData();

let editingId = null;

let activeCardId = null;


/* ==================================================
   BASIC
================================================== */

function uid(){

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}


function num(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return 0;
  }

  const n =
    parseFloat(
      String(v)
        .replace(/[^\d.-]/g,"")
    );

  return Number.isFinite(n)
    ? n
    : 0;
}


function loadData(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    /*
      如果新版本没有数据，
      自动兼容之前版本的 storage。
    */

    let parsed = null;

    if(raw){

      parsed =
        JSON.parse(raw);

    }else{

      const oldKeys = [
        "ballet_price_database_v3",
        "ballet_price_database_v2"
      ];

      for(const key of oldKeys){

        const old =
          localStorage.getItem(key);

        if(old){

          parsed =
            JSON.parse(old);

          break;
        }

      }

    }

    if(!Array.isArray(parsed)){
      return [];
    }

    return parsed.map(normalizeItem);

  }catch(e){

    console.error(e);

    return [];
  }
}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


function normalizeItem(item){

  return {

    id:
      item.id || uid(),

    institution:
      item.institution || "",

    packageName:
      item.packageName || "",

    price:
      num(item.price),

    lessons:
      num(item.lessons),

    minutes:
      num(item.minutes) || 60,

    validityValue:
      item.validityValue === undefined
        ? ""
        : item.validityValue,

    validityUnit:
      item.validityUnit || "month",

    district:
      item.district || "",

    metroStation:
      item.metroStation || "",

    homeDistance:
      num(item.homeDistance),

    workDistance:
      num(item.workDistance),

    homeTime:
      parseTimeValue(
        item.homeTime
      ),

    workTime:
      parseTimeValue(
        item.workTime
      )
  };
}


/* ==================================================
   PRICE
================================================== */

function price60(item){

  if(
    !item.lessons ||
    !item.minutes ||
    !item.price
  ){
    return 0;
  }

  return (
    item.price /
    (
      item.lessons *
      item.minutes
    )
  ) * 60;
}


function lessonPrice(item){

  if(!item.lessons){
    return 0;
  }

  return item.price / item.lessons;
}


/* ==================================================
   VALIDITY
================================================== */

function validityMonths(item){

  if(
    item.validityUnit ===
    "permanent"
  ){
    return Infinity;
  }

  const value =
    num(item.validityValue);

  if(!value){
    return 0;
  }

  if(
    item.validityUnit ===
    "year"
  ){
    return value * 12;
  }

  if(
    item.validityUnit ===
    "day"
  ){
    return value / 30;
  }

  return value;
}


function validityText(item){

  if(
    item.validityUnit ===
    "permanent"
  ){
    return "永久有效";
  }

  const value =
    num(item.validityValue);

  if(!value){
    return "未设置有效期";
  }

  if(
    item.validityUnit ===
    "day"
  ){

    const months =
      value / 30;

    return (
      months.toFixed(1) +
      "个月"
    );
  }

  if(
    item.validityUnit ===
    "year"
  ){

    return (
      trimDecimal(value) +
      "年"
    );
  }

  return (
    trimDecimal(value) +
    "个月"
  );
}


function trimDecimal(n){

  const x = Number(n);

  if(Number.isInteger(x)){
    return String(x);
  }

  return x.toFixed(1);
}


/* ==================================================
   TIME PICKER
================================================== */

/*
  一个整体的滚动选择器：
  0小时00分钟
  0小时01分钟
  ...
  1小时05分钟
  ...
  6小时59分钟

  总共 420 个选项。
  iPhone 上 select 会直接调用系统滚动选择器。
*/

function populateTimeSelect(id){

  const select =
    document.getElementById(id);

  select.innerHTML = "";

  for(
    let total = 0;
    total <= 6 * 60 + 59;
    total++
  ){

    const hour =
      Math.floor(total / 60);

    const minute =
      total % 60;

    const option =
      document.createElement(
        "option"
      );

    option.value =
      total;

    option.textContent =
      `${hour}小时${String(minute).padStart(2,"0")}分钟`;

    select.appendChild(option);
  }
}


populateTimeSelect(
  "fHomeTime"
);

populateTimeSelect(
  "fWorkTime"
);


function parseTimeValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return 0;
  }

  if(typeof value === "number"){

    return Math.max(
      0,
      Math.round(value)
    );
  }

  let s =
    String(value)
      .trim()
      .toLowerCase();

  if(!s){
    return 0;
  }


  /*
    Excel / 时间格式：
    1:05
    01:05
  */

  if(
    /^\d+\s*:\s*\d+$/.test(s)
  ){

    const parts =
      s.split(":");

    const h =
      parseInt(parts[0],10) || 0;

    const m =
      parseInt(parts[1],10) || 0;

    return (
      h * 60 +
      m
    );
  }


  let hours = 0;

  let minutes = 0;


  const hMatch =
    s.match(
      /(\d+(?:\.\d+)?)\s*(?:小时|小時|h|hr|hrs)/
    );


  if(hMatch){

    hours =
      parseFloat(
        hMatch[1]
      ) || 0;
  }


  const mMatch =
    s.match(
      /(\d+(?:\.\d+)?)\s*(?:分钟|分鐘|min|mins|m)/
    );


  if(mMatch){

    minutes =
      parseFloat(
        mMatch[1]
      ) || 0;
  }


  if(
    hMatch ||
    mMatch
  ){

    return Math.round(
      hours * 60 +
      minutes
    );
  }


  const pure =
    parseFloat(
      s.replace(
        /[^\d.-]/g,
        ""
      )
    );


  if(
    Number.isFinite(pure)
  ){

    return Math.round(pure);
  }


  return 0;
}


function formatTime(total){

  total =
    parseTimeValue(total);

  if(total <= 0){

    return "未设置";
  }

  const h =
    Math.floor(
      total / 60
    );

  const m =
    total % 60;


  if(h && m){

    return (
      `${h}小时` +
      `${String(m).padStart(2,"0")}分钟`
    );
  }


  if(h){

    return `${h}小时`;
  }


  return `${m}分钟`;
}


/* ==================================================
   EDITOR
================================================== */

function openEditor(item=null){

      : null;

  document.getElementById(
    "fPackage"

  document.getElementById(
    "fPrice"

    item?.price || "";


  document.getElementById(
    "fLessons"

    item?.lessons || "";


  document.getElementById(
    "fMinutes"

    item?.minutes || 60;


  document.getElementById(
    "fValidityValue"
  ).value =
    item?.validityValue ?? "";


  document.getElementById(
    "fValidityUnit"
  ).value =
    item?.validityUnit ||
    "month";


  document.getElementById(
    "fDistrict"

    item?.district || "";


  document.getElementById(
    "fMetro"

  document.getElementById(
    "fHomeDistance"

    item?.homeDistance || "";


  document.getElementById(
    "fWorkDistance"
  ).value =
    item?.workDistance || "";


  document.getElementById(
    "fHomeTime"
  ).value =
    Math.min(
      parseTimeValue(
        item?.homeTime || 0
      ),
      419
    );


  document.getElementById(
    "fWorkTime"
  ).value =
    Math.min(
      parseTimeValue(
        item?.workTime || 0
      ),
      419
    );


  const validity =
    document.getElementById(
      "fValidityUnit"
    );

  const validityInput =
    document.getElementById(
      "fValidityValue"
    );

  validityInput.disabled =
    validity.value ===
    "permanent";


  document
    .getElementById(
      "editorMask"
    )
    .classList.add("show");


  setTimeout(()=>{

    document
      .getElementById(
        "fInstitution"
      )
      .focus();

  },100);
}


function closeEditor(){

  document

      "editorMask"

  editingId = null;
}

  if(
    e.target.id ===

function saveEditor(){

  const institution =
    document
      .getElementById(
        "fInstitution"
      )
      .value
      .trim();


  const packageName =
    document
      .getElementById(
        "fPackage"
      )
      .value
      .trim();


  const price =
    num(
      document
        .getElementById(
          "fPrice"
        )
        .value
    );


  const lessons =
    num(
      document
        .getElementById(
          "fLessons"
        )
        .value
    );


  const minutes =
    num(
      document
        .getElementById(
          "fMinutes"
        )
        .value
    );


  if(!institution){

    toast(
      "请填写机构名称"
    );

    return;
  }


  if(!packageName){

    toast(
      "请填写套餐名称"
    );

    return;
  }


  if(!price){

    toast(
      "请填写套餐价格"
    );

    return;
  }


  if(!lessons){

    toast(
      "请填写课时数量"
    );

    return;
  }


  if(!minutes){

    toast(
      "请填写每节课时长"
    );

    return;
  }


  const validityUnit =
    document
      .getElementById(
        "fValidityUnit"
      )
      .value;


  const validityValue =
    validityUnit ===
    "permanent"
      ? ""
      : num(
          document
            .getElementById(
              "fValidityValue"
            )
            .value
        );


  const homeTime =
    parseTimeValue(
      document
        .getElementById(
          "fHomeTime"
        )
        .value
    );


  const workTime =
    parseTimeValue(
      document
        .getElementById(
          "fWorkTime"
        )
        .value
    );


  const item = {

    id:
      editingId ||
      uid(),

    institution,

    packageName,

    price,

    lessons,

    minutes,

    validityValue,

    validityUnit,

    district:
      document
        .getElementById(
          "fDistrict"
        )
        .value
        .trim(),

    metroStation:
      document
        .getElementById(
          "fMetro"
        )
        .value
        .trim(),

    homeDistance:
      num(
        document
          .getElementById(
            "fHomeDistance"
          )
          .value
      ),

    workDistance:
      num(
        document
          .getElementById(
            "fWorkDistance"
          )
          .value
      ),

    homeTime,

    workTime
  };


  if(editingId){

    const index =
      data.findIndex(
        x =>
          x.id ===
          editingId
      );


    if(index !== -1){

      data[index] =
        item;
    }


    toast(
      "套餐已更新"
    );

  }else{

    data.unshift(item);

    toast(
      "套餐已添加"
    );
  }


  saveData();

  closeEditor();

  render();
}


/* ==================================================
   COPY
================================================== */

function copyItem(item){

  const copy = {

    ...item,

    id:uid(),

    packageName:
      item.packageName
        ? item.packageName +
          "（复制）"
        : ""
  };


  data.unshift(copy);

  saveData();

  render();

  toast(
    "已复制到新套餐"
  );
}


/* ==================================================
   DELETE
================================================== */

function deleteItem(id){

  const item =
    data.find(
      x =>
        x.id === id
    );


  if(!item) return;


  if(
    !confirm(
      `确定删除「${item.packageName}」吗？`
    )
  ){

    return;
  }


  data =
    data.filter(
      x =>
        x.id !== id
    );


  saveData();

  render();

  toast(
    "已删除"
  );
}

/* ==================================================
   PACKAGE RENDER
================================================== */

function renderPackages(){

  const list =
    document.getElementById(
      "packageList"
    );


  let items =
    [...data];


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const sort =
    document
      .getElementById(
        "sortSelect"
      )
      .value;


  if(keyword){

    items =
      items.filter(
        item =>
          (
            item.institution +
            " " +
            item.packageName +
            " " +
            item.district +
            " " +
            item.metroStation
          )
          .toLowerCase()
          .includes(keyword)
      );

/* ==================================================
   SWIPE
================================================== */

let swipeState = {

  card:null,

  startX:0,

  startY:0,

  currentX:0,

  moving:false
};


function swipeStart(e){

  const touch =
    e.touches[0];


  const card =
    e.currentTarget;


  swipeState = {

    card,

    startX:
      touch.clientX,

    startY:
      touch.clientY,

    currentX:
      touch.clientX,

    moving:false
  };
}


function swipeMove(e){

  if(
    !swipeState.card
  ){

    return;
  }


  const touch =
    e.touches[0];


  const dx =
    touch.clientX -
    swipeState.startX;


  const dy =
    touch.clientY -
    swipeState.startY;


  if(
    Math.abs(dy) >
    Math.abs(dx)
  ){

    return;
  }


  swipeState.moving =
    true;


  swipeState.currentX =
    touch.clientX;


  let distance =
    dx;


  if(distance > 0){

    distance = 0;
  }


  if(distance < -174){

    distance = -174;
  }


  swipeState.card.style.transition =
    "none";


  swipeState.card.style.transform =
    `translateX(${distance}px)`;
}


function swipeEnd(){

  if(
    !swipeState.card
  ){

    return;
  }


  const dx =
    swipeState.currentX -
    swipeState.startX;


  const card =
    swipeState.card;


  card.style.transition =
    "transform .22s ease";


  if(dx < -55){

    card.classList.add(
      "open"
    );

    activeCardId =
      card.dataset.id;

  }
  else if(dx > 55){

    card.classList.remove(
      "open"
    );

    activeCardId =
      null;

  }
  else if(
    !swipeState.moving
  ){

    if(
      card.classList.contains(
        "open"
      )
    ){

      card.classList.remove(
        "open"
      );

      activeCardId =
        null;

    }else{

      openDetail(
        data.find(
          x =>
            x.id ===
            card.dataset.id
        )
      );
    }
  }


  swipeState.card =
    null;
}

function handleAction(
  e,
  type,
  id
){

  e.stopPropagation();


  const item =
    data.find(
      x =>
        x.id === id
    );


  if(!item) return;


  if(type === "copy"){

    copyItem(item);
  }


  if(type === "edit"){

    openEditor(item);
  }


  if(type === "delete"){

    deleteItem(id);
  }
}

/* ==================================================
   COMMUTE
================================================== */

function renderCommute(){

  const box =
    document.getElementById(
      "commuteChart"
    );


  if(!data.length){

    box.innerHTML = `
      <div class="empty">
        暂无通勤数据
      </div>
    `;

    return;
  }


  /*
    同一家机构只显示一次。
    优先合并完整资料。
  */

  const map =
    new Map();


  data.forEach(
    item => {

      const key =
        item.institution
          .trim();


      if(!key) return;


      if(!map.has(key)){

        map.set(
          key,
          {
            ...item
          }
        );

        return;
      }


      const old =
        map.get(key);


      const merged = {

        ...old,

        district:
          old.district ||
          item.district,

        metroStation:
          old.metroStation ||
          item.metroStation,

        homeDistance:
          old.homeDistance ||
          item.homeDistance,

        workDistance:
          old.workDistance ||
          item.workDistance,

        homeTime:
          old.homeTime ||
          item.homeTime,

        workTime:
          old.workTime ||
          item.workTime
      };


      map.set(
        key,
        merged
      );
    }
  );


  const items =
    [...map.values()];


  const maxTime =
    Math.max(
      1,
      ...items.flatMap(
        item => [
          parseTimeValue(
            item.homeTime
          ),
          parseTimeValue(
            item.workTime
          )
        ]
      )
    );


  box.innerHTML =
    items.map(
      item => {

        const home =
          parseTimeValue(
            item.homeTime
          );


        const work =
          parseTimeValue(
            item.workTime
          );


        const homeHeight =
          home
            ? Math.max(
                8,
                home /
                maxTime *
                185
              )
            : 0;


        const workHeight =
          work
            ? Math.max(
                8,
                work /
                maxTime *
                185
              )
            : 0;


        return `

        <div class="commute-column">

          <div class="commute-value-row">

            ${
              home
                ?
                `
                <div
                  class="commute-single-bar commute-home-bar"
                  style="height:${homeHeight}px"
                >
                  <div class="commute-bar-value">
                    ${formatTime(home)}
                  </div>
                </div>
                `
                :
                ""
            }


            ${
              work
                ?
                `
                <div
                  class="commute-single-bar commute-work-bar"
                  style="height:${workHeight}px"
                >
                  <div class="commute-bar-value">
                    ${formatTime(work)}
                  </div>
                </div>
                `
                :
                ""
            }

          </div>


          <div class="commute-column-name">

            <strong>
              ${esc(item.institution)}
            </strong>

            <div class="commute-location">

              ${
                item.district
                  ?
                  `
                  <span class="location-tag">
                    ${esc(item.district)}
                  </span>
                  `
                  :
                  ""
              }

              ${
                item.metroStation
                  ?
                  `
                  <span class="location-tag metro-tag">
                    ${esc(item.metroStation)}
                  </span>
                  `
                  :
                  ""
              }

            </div>

          </div>

        </div>

        `;
      }
    ).join("");
}

/* ==================================================
   EXCEL IMPORT
================================================== */

function importExcel(event){

  const file =
    event.target.files[0];


  if(!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const workbook =
          XLSX.read(
            e.target.result,
            {
              type:"array"
            }
          );


        const sheet =
          workbook.Sheets[
            workbook.SheetNames[0]
          ];


        const rows =
          XLSX.utils.sheet_to_json(
            sheet,
            {
              defval:""
            }
          );


        if(!rows.length){

          toast(
            "Excel 没有数据"
          );

          return;
        }


        let imported = 0;


        rows.forEach(
          row => {

            const item =
              importRow(row);


            if(
              item.institution &&
              item.packageName
            ){

              data.push(item);

              imported++;
            }
          }
        );


        saveData();

        render();


        toast(
          `成功导入 ${imported} 条套餐`
        );


      }catch(error){

        console.error(error);


        toast(
          "Excel 导入失败，请检查文件"
        );


      }finally{

        event.target.value = "";
      }

    };


  reader.readAsArrayBuffer(
    file
  );
}


function getCell(
  row,
  names
){

  for(
    const name of names
  ){

    if(
      Object.prototype.hasOwnProperty.call(
        row,
        name
      )
    ){

      return row[name];
    }
  }


  return "";
}


function importRow(row){

  const institution =
    getCell(
      row,
      [
        "机构名称",
        "机构",
        "institution"
      ]
    );


  const packageName =
    getCell(
      row,
      [
        "套餐名称",
        "套餐",
        "packageName"
      ]
    );


  const price =
    num(
      getCell(
        row,
        [
          "套餐价格",
          "总价格",
          "价格",
          "price"
        ]
      )
    );


  const lessons =
    num(
      getCell(
        row,
        [
          "课时数量",
          "课时",
          "节数",
          "lessons"
        ]
      )
    );


  const minutes =
    num(
      getCell(
        row,
        [
          "每节课时长",
          "课时长度",
          "minutes"
        ]
      )
    ) || 60;


  /* --------------------------
     有效期
  -------------------------- */

  let validityValue =
    getCell(
      row,
      [
        "有效期数值",
        "validityValue"
      ]
    );


  let validityUnit =
    getCell(
      row,
      [
        "有效期单位",
        "validityUnit"
      ]
    );


  const validityTextRaw =
    getCell(
      row,
      [
        "有效期"
      ]
    );


  if(
    !validityUnit &&
    String(
      validityTextRaw
    ).includes("永久")
  ){

    validityUnit =
      "permanent";

    validityValue =
      "";
  }


  if(
    validityUnit === "年" ||
    validityUnit === "year"
  ){

    validityUnit =
      "year";

  }
  else if(
    validityUnit === "天" ||
    validityUnit === "day"
  ){

    validityUnit =
      "day";

  }
  else if(
    validityUnit ===
      "永久有效" ||
    validityUnit ===
      "permanent"
  ){

    validityUnit =
      "permanent";

    validityValue =
      "";

  }
  else{

    validityUnit =
      "month";
  }


  /* --------------------------
     通勤时间
  -------------------------- */

  /*
    优先读取纯分钟字段。
    这解决你之前 Excel 导入后
    通勤时间不显示的问题。
  */

  let homeTime =
    getCell(
      row,
      [
        "到家时间_分钟",
        "到家时间分钟",
        "到家时间（分钟）",
        "homeTime"
      ]
    );


  let workTime =
    getCell(
      row,
      [
        "到公司时间_分钟",
        "到公司时间分钟",
        "到公司时间（分钟）",
        "workTime"
      ]
    );


  /*
    如果纯分钟不存在，
    再读取显示格式。
  */

  if(
    homeTime === "" ||
    homeTime === null ||
    homeTime === undefined
  ){

    homeTime =
      getCell(
        row,
        [
          "到家时间",
          "回家时间"
        ]
      );
  }


  if(
    workTime === "" ||
    workTime === null ||
    workTime === undefined
  ){

    workTime =
      getCell(
        row,
        [
          "到公司时间",
          "去公司时间"
        ]
      );
  }


  return {

    id:
      uid(),

    institution:
      String(
        institution || ""
      ).trim(),

    packageName:
      String(
        packageName || ""
      ).trim(),

    price,

    lessons,

    minutes,

    validityValue:
      validityUnit ===
      "permanent"
        ? ""
        : validityValue,

    validityUnit,

    district:
      String(
        getCell(
          row,
          [
            "区域",
            "地区",
            "district"
          ]
        ) || ""
      ).trim(),

    metroStation:
      String(
        getCell(
          row,
          [
            "最近地铁站",
            "地铁站",
            "metroStation"
          ]
        ) || ""
      ).trim(),

    homeDistance:
      num(
        getCell(
          row,
          [
            "距家距离(km)",
            "距家距离",
            "homeDistance"
          ]
        )
      ),

    workDistance:
      num(
        getCell(
          row,
          [
            "距公司距离(km)",
            "距公司距离",
            "workDistance"
          ]
        )
      ),

    homeTime:
      parseTimeValue(
        homeTime
      ),

    workTime:
      parseTimeValue(
        workTime
      )
  };
}

================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

render();
